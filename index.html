function buildFeed(){
  const staff = S.profile.role !== 'parent';
  const box = el('<div style="display:flex;flex-direction:column;gap:14px"></div>');

  // ---- scope selector: classes for staff, children for parents with more than one ----
  let scopes = [];
  if(staff){
    scopes = [{id:'all', label:'كل الفصول'}].concat(S.classes.map(c => ({id:c.id, label:'فصل '+c.name})));
  } else if(S.myChildren.length > 1){
    scopes = [{id:'all', label:'الكل'}].concat(S.myChildren.map(c => ({id:c.id, label:first(c.full_name)})));
  }
  if(scopes.length && !scopes.find(x=>x.id===S.feedScope)) S.feedScope = 'all';

  if(scopes.length > 1){
    const chips = el('<div class="chips"></div>');
    scopes.forEach(sc => {
      const b = el(`<button class="chip" aria-pressed="${sc.id===S.feedScope}">${esc(sc.label)}</button>`);
      b.onclick = () => { S.feedScope = sc.id; render(); };
      chips.appendChild(b);
    });
    box.appendChild(chips);
  }

  // ---- which children and which class does the scope cover ----
  let kids, classIds;
  if(staff){
    kids = S.feedScope === 'all' ? S.children : S.children.filter(c => c.class_id === S.feedScope);
    classIds = S.feedScope === 'all' ? S.classes.map(c=>c.id) : [S.feedScope];
  } else {
    kids = S.feedScope === 'all' ? S.myChildren : S.myChildren.filter(c => c.id === S.feedScope);
    classIds = kids.map(c => c.class_id).filter(Boolean);
  }

  const items = [];
  kids.forEach(c => {
    const a = S.attendance[c.id];
    const fem = c.gender === 'f';
    if(a && a.check_in_at) items.push({t:a.check_in_at, kind:'in', title:(fem?'وصلت ':'وصل ')+first(c.full_name)+' إلى الروضة', sub:fmtTime(a.check_in_at)});
    if(a && a.check_out_at) items.push({t:a.check_out_at, kind:'out', title:(fem?'غادرت ':'غادر ')+first(c.full_name)+' الروضة', sub:fmtTime(a.check_out_at)});
  });

  S.posts
    .filter(p => p.class_id === null || classIds.includes(p.class_id))
    .forEach(p => {
      const cls = S.classes.find(x => x.id === p.class_id);
      items.push({
        t:p.created_at, kind:p.kind==='activity'?'photo':'megaphone',
        title:p.kind==='activity'?'نشاط جديد':'إعلان من الإدارة',
        sub:fmtTime(p.created_at) + (cls ? ' · فصل ' + cls.name : ' · لكل الروضة'),
        body:p.body, photos:p.photo_paths||[],
        postId:p.id, authorId:p.author_id
      });
    });

  items.sort((a,b)=> new Date(b.t)-new Date(a.t));

  const feed = el('<div class="feed"></div>');
  box.appendChild(feed);
  if(!items.length){ feed.appendChild(el('<div class="empty">لا توجد أخبار هنا بعد.</div>')); return box; }

  const TINT = { in:'tint-green', out:'tint-yellow', photo:'tint-blue', megaphone:'' };
  const ICCLR = { in:'green', out:'yellow', photo:'blue', megaphone:'pink' };

  items.slice(0,25).forEach(it => {
    const node = el(`<article class="post ${TINT[it.kind]||''}">
      <div class="post-head">
        <div class="ic ${ICCLR[it.kind]||'blue'}">${ICONS[it.kind]||ICONS.photo}</div>
        <div class="t"><b>${esc(it.title)}</b><span>${esc(it.sub)}</span></div>
      </div>
      ${it.body?'<p>'+esc(it.body)+'</p>':''}
    </article>`);
    feed.appendChild(node);

    // ---- delete a post: its author, or any admin of this kindergarten ----
    if(it.postId && canDeletePost(it)){
      const head = node.querySelector('.post-head');
      const dbtn = el(`<button class="postdel" title="حذف المنشور" aria-label="حذف المنشور">${ICONS.trash}</button>`);
      dbtn.onclick = () => confirmDeletePost(it);
      head.appendChild(dbtn);
    }

    const photos = it.photos || [];
    if(photos.length){
      const n = Math.min(photos.length, 3);
      const grid = el(`<div class="shots n${n}"></div>`);
      node.appendChild(grid);
      signedUrls(photos).then(urls => {
        grid.innerHTML = '';
        urls.slice(0,n).forEach((u,i) => {
          const last = (i===n-1 && photos.length>n);
          const b = el(`<button class="${last?'more':''}" ${last?`data-more="+${photos.length-n}"`:''} aria-label="عرض الصورة"><img loading="lazy" alt="صورة من النشاط" src="${u}"></button>`);
          b.onclick = () => openPhoto(u);
          grid.appendChild(b);
        });
      });
    }
  });
  return box;
}

/* ---------- deleting a post ---------- */
// the author may remove her own; an admin may remove any in her kindergarten.
// preview mode is read-only, matching the rest of the app.
function canDeletePost(it){
  if(S.preview) return false;
  const r = S.profile.role;
  if(r === 'parent' || r === 'bus') return false;
  if(r === 'admin') return true;
  return it.authorId && it.authorId === S.profile.id;
}

function confirmDeletePost(it){
  const what = it.kind === 'photo' ? 'النشاط' : 'الإعلان';
  const n = (it.photos || []).length;
  confirmAction(
    'حذف ' + what,
    `سيُحذف هذا ${what} من صفحة الأهل نهائيًا${n ? `، مع ${n} من الصور المرفقة` : ''}. لا يمكن التراجع.`,
    'حذف نهائيًا',
    async () => {
      const r = await safe(sb.rpc('delete_post', { p_id: it.postId }));
      if(!r) return 'تعذّر الحذف — تأكد من صلاحيتك ومن تشغيل تحديث قاعدة البيانات.';
      S.posts = S.posts.filter(p => p.id !== it.postId);
      toast('تم حذف ' + what);
      render();
    });
}

        row.querySelector('.tagx').textContent = 'رقم غير مسجّل';
        row.querySelector('.tagx').className = 'tagx';
      }
      rx.appendChild(row);
    });

  const test = el(`<div class="card">
    <h3>فحص الإشعارات</h3>

    const b = e.target; b.disabled = true; b.textContent = 'جارٍ الإرسال…';
    const box = test.querySelector('#tres');

      const { data, error } = await sb.functions.invoke('notify', { body:{ type:'test' } });

/* ---------- printable parent code cards (A4, 8 per page, QR opens sign-up with the code filled in) ---------- */
function joinUrl(code){
  const base = (IS_NATIVE || GENERIC) ? 'https://kidora.answer.sa' : location.origin;
  return base + '/?code=' + encodeURIComponent(code);
}
function qrSvg(text){
  try {
    const q = qrcode(0, 'M'); q.addData(text); q.make();
    return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  } catch(_){ return ''; }
}
function printCodesSheet(){
  const opts = S.classes.map(c => `<option value="${c.id}">فصل ${esc(c.name)}</option>`).join('');
  openSheet(`
    <h3>طباعة بطاقات الرموز</h3>
    <p class="help">ورقة A4 فيها ٨ بطاقات: اسم الطفل ورمزه ورمز QR. يمسحه ولي الأمر بكاميرا جواله فيفتح التسجيل والرمز مكتوب. قصّي البطاقات وأرسليها مع الأطفال.</p>
    <div class="field"><label for="pcl">الفصل</label>
      <select id="pcl"><option value="">جميع الفصول</option>${opts}</select></div>
    <label class="consentbox"><input type="checkbox" id="pfree" checked><span>فقط الأطفال الذين لم يسجّل أولياء أمورهم بعد</span></label>
    <div id="pmsg"></div>
    <button class="btn" id="pgo">طباعة</button>
    <button class="btn soft sm" id="px">إغلاق</button>
  `);
  sheetPanel.querySelector('#px').onclick = closeSheet;
  sheetPanel.querySelector('#pgo').onclick = () => {
    const cl = sheetPanel.querySelector('#pcl').value;
    const onlyFree = sheetPanel.querySelector('#pfree').checked;
    const rows = S.children
      .filter(c => !cl || c.class_id === cl)
      .map(c => ({ c, inv: S.invites.find(i => i.child_id === c.id && !i.revoked) }))
      .filter(x => x.inv && (!onlyFree || (x.inv.uses||0) === 0))
      .sort((a,b) => String(a.c.class_id).localeCompare(String(b.c.class_id)) || a.c.full_name.localeCompare(b.c.full_name, 'ar'));
    if(!rows.length){ sheetPanel.querySelector('#pmsg').innerHTML = '<div class="err">لا توجد رموز للطباعة بهذا الاختيار.</div>'; return; }
    if(IS_NATIVE){
      sheetPanel.querySelector('#pmsg').innerHTML = '<div class="err">الطباعة من الكمبيوتر: افتحي kidora.answer.sa وسجّلي الدخول ثم اختاري «طباعة بطاقات الرموز».</div>';
      return;
    }
    const pa = document.getElementById('printarea');
    pa.innerHTML = rows.map(({c, inv}) => {
      const cls = S.classes.find(x => x.id === c.class_id);
      return `<div class="pcard">
        <div class="qr">${qrSvg(joinUrl(inv.code))}</div>
        <div class="tx">
          <span class="kg">${esc(brandName())}</span>
          <span class="nm">${esc(c.full_name)}</span>
          <span class="cl">${cls ? 'فصل ' + esc(cls.name) : ''}</span>
          <span class="cd">${esc(inv.code)}</span>
          <span class="st">امسح الرمز بكاميرا الجوال لإنشاء حسابك، أو حمّل تطبيق «كيدورا» من App Store وأدخل الرمز عند التسجيل. الرمز خاص بطفلك.</span>
        </div></div>`;
    }).join('');
    closeSheet();
    document.documentElement.classList.add('printing');
    const done = () => { document.documentElement.classList.remove('printing'); pa.innerHTML = ''; window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(() => window.print(), 60);
  };
}

// CSV or pasted rows: الاسم , الفصل , الجنس
// Which column is which. Order matters: «اسم الحافلة» must not be read as the
// child's name, and «جوال ولي الأمر» must not be read as a class.
function headerRole(h){
  const t = String(h||'').trim();
  if(!t) return null;
  if(/حافلة|باص|bus/i.test(t))            return /اسم|خط|رقم|route|no/i.test(t) ? 'route' : 'bus';
  if(/جوال|هاتف|رقم|phone|mobile/i.test(t)) return 'phone';           // read, never imported
  if(/فصل|صف|class|group/i.test(t))       return 'cls';
  if(/جنس|نوع|gender|sex/i.test(t))       return 'gender';
  if(/اسم|طفل|name|child|student/i.test(t)) return 'name';
  return null;
}
const YES = v => /^(1|نعم|ايوه|أيوه|صح|yes|y|true|✓|✔)$/i.test(String(v||'').trim());
const MALE = v => /^(m|male|ذكر|ولد|بنين)$/i.test(String(v||'').trim());

// A child's name, not a number or a sentence of instructions. Guards against
// importing the wrong sheet of a workbook.
function looksLikeName(s){
  const t = String(s || '').trim();
  if(t.length < 2 || t.length > 60) return false;
  if(/^[\d.,\s%-]+$/.test(t)) return false;              // pure numbers
  if(t.split(/\s+/).length > 8) return false;            // a sentence
  if(/[«»:;•]|\.$/.test(t)) return false;                // prose punctuation
  return /[؀-ۿA-Za-z]/.test(t);                // has actual letters
}

function rowsFromMatrix(mat){
  if(!mat || !mat.length) return [];
  let idx = { name:0, cls:1, gender:2, bus:-1, route:-1 }, start = 0;
  const first = mat[0].map(x=>String(x==null?'':x).trim());
  const roles = first.map(headerRole);
  if(roles.some(r=>r==='name')){
    start = 1;
    idx = { name:-1, cls:-1, gender:-1, bus:-1, route:-1 };
    roles.forEach((r,i)=>{ if(r && r!=='phone' && idx[r] === -1) idx[r] = i; });
  }
  const out = [];
  for(let i=start;i<mat.length;i++){
    const p = mat[i].map(x=>String(x==null?'':x).trim());
    const name = (idx.name>=0 ? p[idx.name] : p[0]) || '';
    if(!name) continue;
    if(/^(مثال|example)/i.test(name)) continue;          // skip the template's sample row
    if(!looksLikeName(name)) continue;                   // skip prose / numbers
    const bus = idx.bus>=0 ? YES(p[idx.bus]) : false;
    out.push({
      name,
      class:  idx.cls>=0 ? (p[idx.cls]||'') : '',
      gender: MALE(idx.gender>=0 ? p[idx.gender] : '') ? 'm' : 'f',
      bus,
      route:  bus && idx.route>=0 ? (p[idx.route]||'') : ''
    });
  }
  return out;
}

function parseRows(text){
  const lines = String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return [];
  const split = (l) => l.includes('\t') ? l.split('\t') : l.split(',');
  return rowsFromMatrix(lines.map(l => split(l).map(x=>x.trim())));
}

// SheetJS, fetched only when someone actually imports a workbook
let xlsxLib = null;
function loadXlsx(){
  if(xlsxLib) return Promise.resolve(xlsxLib);
  if(window.XLSX){ xlsxLib = window.XLSX; return Promise.resolve(xlsxLib); }
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => { xlsxLib = window.XLSX; res(xlsxLib); };
    s.onerror = () => rej(new Error('no-xlsx'));
    document.head.appendChild(s);
  });
}
async function rowsFromWorkbook(file){
  const XL = await loadXlsx();
  const wb = XL.read(await file.arrayBuffer(), { type:'array' });
  // prefer the data sheet; fall back to the first one that has a name column
  const names = wb.SheetNames;
  // "الأطفال" does not contain "طفل" (the alef sits between ف and ل), so match
  // on "طف" instead, and always try an instructions sheet last.
  const isData  = n => /طف|children|kids|بيانات|data|قائمة|أسماء|اسماء/i.test(n);
  const isGuide = n => /تعليم|إرشاد|ارشاد|دليل|instruction|readme|guide|help/i.test(n);
  // an instructions sheet is never a source of children, even if every other
  // sheet comes back empty — better to report "no rows" than to import prose.
  let order = names.filter(n => isData(n) && !isGuide(n))
    .concat(names.filter(n => !isData(n) && !isGuide(n)));
  if(!order.length) order = names.slice();

  for(const nm of order){
    const mat = XL.utils.sheet_to_json(wb.Sheets[nm], { header:1, blankrows:false, defval:'' });
    const rows = rowsFromMatrix(mat);
    if(rows.length) return Object.assign(rows, { sheet: nm });
  }
  return [];
}

        `<p class="help">يركب الحافلة: ${rows.filter(r=>r.bus).length} من ${rows.length}</p>` +

      e.target.textContent = 'استيراد ' + rows.length + ' طفل';

    const made = r.data;
    await refresh(); await loadInvites();
    openSheet(`<h3>تم استيراد ${made.length} طفل</h3>
      <p class="help">هذه رموز أولياء الأمور. كل رمز يصلح لأربعة أشخاص.</p>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>الطفل</th><th>الفصل</th><th>الرمز</th></tr></thead>

      <button class="btn" id="idl">تنزيل الرموز CSV</button>

    sheetPanel.querySelector('#idl').onclick = () => {
      const head = 'الطفل,الفصل,رمز ولي الأمر\n';
      const body = made.map(x=>[x.full_name, x.class_name||'', x.code].join(',')).join('\n');
      const blob = new Blob(['﻿'+head+body], {type:'text/csv;charset=utf-8'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'parent-codes.csv';
      document.body.appendChild(a); a.click(); a.remove();
    };
    sheetPanel.querySelector('#idone').onclick = ()=>{ closeSheet(); render(); };
  };
}


/* ================= parent card: one image the director sends on WhatsApp ================= */
const CARD_W = 1080, CARD_H = 1920;

function cardPalette(){
  const t = (S.kg && S.kg.theme) || {};
  return {
    pink: t.pink || '#E0206E', blue: t.blue || '#24A7E1',
    green: t.green || '#7FB227', yellow: t.yellow || '#EFB513'
  };
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

// wraps Arabic properly because the browser measures the shaped text
function wrapLines(ctx, text, maxW){
  const words = String(text).split(' ');
  const lines = []; let line = '';
  words.forEach(w => {
    const t = line ? line + ' ' + w : w;
    if(ctx.measureText(t).width > maxW && line){ lines.push(line); line = w; }
    else line = t;
  });
  if(line) lines.push(line);
  return lines;
}

function drawParentCard(ctx, d){
  const P = cardPalette();
  const R = CARD_W - 90;          // right margin (RTL origin)
  ctx.textAlign = 'right';
  ctx.direction = 'rtl';

  ctx.fillStyle = '#FBF7F9';
  ctx.fillRect(0,0,CARD_W,CARD_H);

  // brand mark: the four dots
  const dot = 30, gap = 10, dx = R - (dot*2+gap), dy = 96;
  const cols = [P.pink,P.blue,P.yellow,P.green];
  [[0,0],[1,0],[0,1],[1,1]].forEach(([cx,cy],i)=>{
    ctx.fillStyle = cols[i];
    ctx.beginPath();
    ctx.arc(dx+cx*(dot+gap)+dot/2, dy+cy*(dot+gap)+dot/2, dot/2, 0, Math.PI*2);
    ctx.fill();
  });

  ctx.fillStyle = '#241820';
  ctx.font = '700 44px "IBM Plex Sans Arabic", sans-serif';
  ctx.fillText(d.kgName, dx - 24, dy + dot + 12);

  // heading
  ctx.fillStyle = P.pink;
  ctx.font = '600 30px "IBM Plex Sans Arabic", sans-serif';
  ctx.fillText('بطاقة ولي الأمر', R, 236);

  ctx.fillStyle = '#241820';
  ctx.font = '700 68px "IBM Plex Sans Arabic", sans-serif';
  ctx.fillText(d.childName, R, 320);

  ctx.fillStyle = '#6E6069';
  ctx.font = '400 32px "IBM Plex Sans Arabic", sans-serif';
  ctx.fillText(d.className ? 'فصل ' + d.className : 'تابع يوم طفلك أولًا بأول', R, 376);

  // the code — the one thing that must be unmistakable
  const bx = 90, by = 430, bw = CARD_W-180, bh = 260;
  ctx.fillStyle = '#FDE9F1';
  roundRect(ctx,bx,by,bw,bh,36); ctx.fill();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#A5124F';
  ctx.font = '600 30px "IBM Plex Sans Arabic", sans-serif';
  ctx.fillText('رمز الدخول', CARD_W/2, by + 74);

  ctx.fillStyle = '#241820';
  ctx.font = '700 96px "IBM Plex Mono", ui-monospace, monospace';
  ctx.fillText(d.code, CARD_W/2, by + 186);

  // the link
  ctx.fillStyle = '#0E6E99';
  ctx.font = '600 44px "IBM Plex Mono", ui-monospace, monospace';
  ctx.fillText(d.host, CARD_W/2, by + bh + 92);
  ctx.fillStyle = '#6E6069';
  ctx.font = '400 28px "IBM Plex Sans Arabic", sans-serif';
  ctx.fillText('افتح هذا الرابط من جوالك', CARD_W/2, by + bh + 140);

  // steps
  ctx.textAlign = 'right';
  let y = 880;
  const steps = [
    ['افتح الرابط أعلاه من متصفح جوالك', ''],
    ['أضِف التطبيق إلى شاشتك الرئيسية',
     'آيفون: زر المشاركة ⬆ ← «إضافة إلى الشاشة الرئيسية»\nأندرويد: قائمة ⋮ ← «تثبيت التطبيق»'],
    ['افتحه من الشاشة الرئيسية وسجّل برقم جوالك', 'ثم أدخل رمز الدخول المكتوب أعلاه'],
    ['فعّل الإشعارات عندما يطلبها', 'بدونها لن يصلك تنبيه وصول طفلك']
  ];
  steps.forEach(([title, sub], i) => {
    const cy = y + 26;
    ctx.fillStyle = P.pink;
    ctx.beginPath(); ctx.arc(R - 27, cy, 27, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = '700 30px "IBM Plex Sans Arabic", sans-serif';
    ctx.fillText(String(i+1), R - 27, cy + 11);

    ctx.textAlign = 'right';
    ctx.fillStyle = '#241820';
    ctx.font = '600 38px "IBM Plex Sans Arabic", sans-serif';
    ctx.fillText(title, R - 76, cy + 12);
    y += 70;

    if(sub){
      ctx.fillStyle = '#6E6069';
      ctx.font = '400 30px "IBM Plex Sans Arabic", sans-serif';
      sub.split('\n').forEach(part => {
        wrapLines(ctx, part, CARD_W - 260).forEach(ln => {
          ctx.fillText(ln, R - 76, y + 14); y += 46;
        });
      });
    }
    y += 52;
  });

  // the reassurance a parent actually wants
  const nx = 90, nw = CARD_W-180, nh = 150;
  const ny = CARD_H - 300;
  ctx.fillStyle = '#EFF7E2';
  roundRect(ctx,nx,ny,nw,nh,28); ctx.fill();
  ctx.fillStyle = '#4F7212';
  ctx.font = '600 32px "IBM Plex Sans Arabic", sans-serif';
  ctx.fillText('خصوصية طفلك', R - 30, ny + 60);
  ctx.font = '400 27px "IBM Plex Sans Arabic", sans-serif';
  ctx.fillText('ترى طفلك أنت فقط، ولا تُنشر صوره إلا بموافقتك.', R - 30, ny + 106);

  ctx.fillStyle = '#9C8F97';
  ctx.font = '400 26px "IBM Plex Sans Arabic", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('الرمز خاص بطفلك — لا تشاركه خارج العائلة', CARD_W/2, CARD_H - 96);
}

  saveBtn.onclick = async () => {
    const blob = await toBlob();
    if(!blob){ sheetPanel.querySelector('#cardmsg').innerHTML = '<div class="err">تعذّر إنشاء الصورة.</div>'; return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast('حُفظت الصورة');
  };

  // on a phone, sharing straight to WhatsApp beats downloading
  const shareBtn = sheetPanel.querySelector('#cardshare');
  if(navigator.canShare){
    shareBtn.style.display = '';
    shareBtn.onclick = async () => {
      const blob = await toBlob();
      if(!blob) return;
      const file = new File([blob], fname, { type:'image/png' });
      if(!navigator.canShare({ files:[file] })){ toast('المشاركة غير مدعومة على هذا الجهاز'); return; }
      try { await navigator.share({ files:[file], title:'بطاقة ولي الأمر' }); } catch(_){}
    };
  }
}

    list.appendChild(r);
  });
  if(!S.staff.length) list.appendChild(el('<div class="empty">لا توجد حسابات بعد.</div>'));
  wrap.appendChild(list);

  const unused = S.invites.filter(i => i.role !== 'parent' && (i.uses||0) < (i.max_uses||1));
  if(unused.length){
    const card = el('<div class="card"><h3>رموز غير مستخدمة</h3><div class="rowlist"></div></div>');

    const roleLabel = { admin:'مديرة', teacher:'معلمة', bus:'مرافقة الحافلة' };
    unused.forEach(i => {

      lx.appendChild(r);
    });
    wrap.appendChild(card);
  }
  return wrap;
}

        p_name: sheetPanel.querySelector('#bn').value.trim(),
        p_tagline: sheetPanel.querySelector('#bt').value.trim(),
        p_logo: logo_url,
        p_theme: {
          pink: sheetPanel.querySelector('#cp').value, blue: sheetPanel.querySelector('#cb').value,
          green: sheetPanel.querySelector('#cg').value, yellow: sheetPanel.querySelector('#cy').value
        },
        p_slug: sheetPanel.querySelector('#bs').value.trim().toLowerCase()
      }));
      if(!r) throw new Error('تعذّر الحفظ');
      await loadTenants();
      if(S.kg && S.kg.id === t.id){ await loadBrand(); }
      msg.innerHTML = '<div class="ok">تم الحفظ.</div>';
      render();
    }catch(err){
      msg.innerHTML = '<div class="err">' + esc(err.message || String(err)) + '</div>';
    }
    btn.disabled = false; btn.textContent = 'حفظ';
  };
}

function monthStart(){ const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1).toLocaleDateString('en-CA'); }

function adminReports(){
  const wrap = el('<div style="display:flex;flex-direction:column;gap:14px"></div>');
  const card = el(`<div class="card">
    <h3>تقرير الحضور</h3>
    <div class="actions2">
      <div class="field" style="flex:1"><label for="rf">من</label><input id="rf" type="date" value="${monthStart()}"></div>
      <div class="field" style="flex:1"><label for="rt">إلى</label><input id="rt" type="date" value="${today()}"></div>
    </div>
    <button class="btn sm" id="rrun">عرض التقرير</button>
    <div id="rout"></div>
  </div>`);
  const out = card.querySelector('#rout');

  const paint = (rows, from, to) => {
    if(!rows || !rows.length){ out.innerHTML = '<div class="empty">لا توجد بيانات في هذه الفترة.</div>'; return; }
    out.innerHTML = '';
    out.appendChild(el(`<div class="tblwrap"><table class="tbl">
      <thead><tr><th>الطفل</th><th>الفصل</th><th>أيام الحضور</th><th>غياب مُبلّغ</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td>${esc(r.full_name)}</td><td>${esc(r.class_name||'—')}</td>
        <td class="num">${r.present}</td><td class="num">${r.absent_reported}</td></tr>`).join('')}</tbody>
    </table></div>`));
    const dl = el('<button class="btn soft sm">تنزيل CSV</button>');
    dl.onclick = () => {
      const head = 'الطفل,الفصل,أيام الحضور,غياب مبلغ\n';
      const body = rows.map(r=>[r.full_name, r.class_name||'', r.present, r.absent_reported].join(',')).join('\n');
      const blob = new Blob(['\ufeff' + head + body], {type:'text/csv;charset=utf-8'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `attendance-${from}-to-${to}.csv`;
      document.body.appendChild(a); a.click(); a.remove();
    };
    out.appendChild(dl);
  };

  card.querySelector('#rrun').onclick = async (e) => {
    const btn = e.target; btn.disabled = true; btn.textContent = 'جارٍ الحساب…';
    const from = card.querySelector('#rf').value, to = card.querySelector('#rt').value;
    const r = await safe(sb.rpc('attendance_report', { p_from: from, p_to: to }));
    btn.disabled = false; btn.textContent = 'عرض التقرير';
    if(!r){ out.innerHTML = '<div class="err">التقرير غير متاح بعد — شغّل تحديث قاعدة البيانات أولًا.</div>'; return; }
    S.report = r.data || [];
    paint(S.report, from, to);
  };
  wrap.appendChild(card);

  // consent overview
  const cs = el('<div class="card"><h3>موافقات أولياء الأمور</h3><div id="csout"><p class="help">جارٍ التحميل…</p></div></div>');
  wrap.appendChild(cs);
  safe(sb.rpc('consent_status')).then(r => {
    const box = cs.querySelector('#csout'); if(!box) return;
    if(!r){ box.innerHTML = '<p class="help">غير متاح بعد — شغّل تحديث قاعدة البيانات.</p>'; return; }
    const rows = r.data || [];
    const withG = rows.filter(x => x.guardians > 0);
    const done = withG.filter(x => x.consented > 0).length;
    const missing = withG.filter(x => x.consented === 0)
      .map(x => (S.children.find(c=>c.id===x.child_id)||{}).full_name).filter(Boolean);
    box.innerHTML = `<p class="help">${done} من ${withG.length} طفل لديهم موافقة مسجّلة.</p>` +
      (missing.length ? '<p class="help">بدون موافقة: ' + esc(missing.slice(0,12).join('، ')) + '</p>' : '');
  });

  // full data export — the kindergarten owns its own records
  const ex = el(`<div class="card"><h3>تصدير بيانات الروضة</h3>
    <p class="help">ملف واحد يحتوي الأطفال والفصول وأولياء الأمور والحضور والغياب والأنشطة. الصور نفسها تبقى في التطبيق.</p>
    <div id="exout"></div>
    <button class="btn soft sm" id="exgo">تصدير الآن</button></div>`);
  ex.querySelector('#exgo').onclick = async (e) => {
    const b = e.target; b.disabled = true; b.textContent = 'جارٍ التصدير…';
    const r = await safe(sb.rpc('export_kindergarten'));
    if(!r || !r.data){
      ex.querySelector('#exout').innerHTML = '<div class="err">غير متاح بعد — شغّل تحديث قاعدة البيانات.</div>';
      b.disabled = false; b.textContent = 'تصدير الآن'; return;
    }
    const blob = new Blob([JSON.stringify(r.data, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `kindergarten-export-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    ex.querySelector('#exout').innerHTML = '<div class="ok">تم تنزيل الملف.</div>';
    b.disabled = false; b.textContent = 'تصدير الآن';
  };
  wrap.appendChild(ex);

  // photo retention
  const rt = el(`<div class="card"><h3>الاحتفاظ بالصور</h3>
    <p class="help">تُحذف صور الأنشطة والتقارير الأقدم من ${S.kg && S.kg.photo_retention_days ? S.kg.photo_retention_days : 365} يومًا تلقائيًا كل ليلة.</p>
    <div id="pgout"></div>
    <button class="btn soft sm" id="purge">حذف الصور القديمة الآن</button></div>`);
  rt.querySelector('#purge').onclick = async (e) => {
    const b = e.target; b.disabled = true; b.textContent = 'جارٍ الحذف…';
    const r = await safe(sb.rpc('purge_old_photos'));
    rt.querySelector('#pgout').innerHTML = r
      ? '<div class="ok">' + ((r.data ?? 0) ? 'جارٍ حذف ' + r.data + ' صورة قديمة — تكتمل خلال دقيقة.' : 'لا توجد صور قديمة للحذف.') + '</div>'
      : '<div class="err">تعذّر الحذف الآن. حاول لاحقًا.</div>';
    b.disabled = false; b.textContent = 'حذف الصور القديمة الآن';
  };
  wrap.appendChild(rt);
  return wrap;
}

function deleteMyAccountSheet(){

  openSheet(`

    <p class="help">${isParent
      ? 'سحب الموافقة الأساسية يعني إغلاق حسابك: يُحذف حسابك وكلمة مرورك وارتباطك بطفلك، وتتوقف الإشعارات. سجلّ الحضور الذي تحتفظ به الروضة كسجلّ رسمي يبقى لديها.'
      : 'يُحذف حسابك وكلمة مرورك وإشعاراتك نهائيًا. الحضور الذي سجّلته والأنشطة التي نشرتها تبقى للروضة.'}</p>
    ${isParent ? '<p class="help">إن كان ما يزعجك هو الصور فقط، أوقف «نشر صور طفلي» بدل حذف الحساب — الخدمة تستمر كما هي.</p>' : ''}
    <p class="help">لا يمكن التراجع. ستحتاج رمز انضمام جديد من الروضة للعودة.</p>
    <p class="help">للتأكيد، اكتب <b>DELETE</b> في الحقل التالي.</p>
    <div class="field"><input id="dmc" class="confirmbox" placeholder="DELETE" autocapitalize="characters" autocomplete="off"></div>
    <div id="dmmsg"></div>
    <button class="btn" id="dmgo" style="background:var(--pink)" disabled>حذف حسابي نهائيًا</button>
    <button class="btn soft sm" id="dmx">تراجع</button>
  `);
  const inp = sheetPanel.querySelector('#dmc');
  const go  = sheetPanel.querySelector('#dmgo');
  sheetPanel.querySelector('#dmx').onclick = closeSheet;
  inp.oninput = () => { go.disabled = inp.value.trim().toUpperCase() !== 'DELETE'; };
  go.onclick = async () => {
    go.disabled = true; go.textContent = 'جارٍ الحذف…';
    const { error } = await sb.rpc('delete_my_account', { p_confirm: 'DELETE' });
    if(error){
      const m = String(error.message || '');
      sheetPanel.querySelector('#dmmsg').innerHTML = '<div class="err">' + esc(
        m.includes('LAST_ADMIN')     ? 'أنتِ المديرة الوحيدة للروضة. عيّني مديرة أخرى قبل حذف حسابك.' :
        m.includes('OWNER_CANNOT')   ? 'حساب مالك المنصة لا يُحذف من هنا.' :
        'تعذّر الحذف. حاول مرة أخرى أو راسلنا على support@answer.sa.') + '</div>';
      go.disabled = false; go.textContent = 'حذف حسابي نهائيًا'; return;
    }
    await safe(sb.auth.signOut());
    closeSheet();
    location.reload();
  };
}

function confirmAction(title, body, label, run){
  openSheet(`
    <h3>${title}</h3>
    <p class="help">${body}</p>
    <div id="cfmsg"></div>
    <button class="btn" id="cfgo" style="background:var(--pink)">${esc(label)}</button>
    <button class="btn soft sm" id="cfx">تراجع</button>
  `);
  sheetPanel.querySelector('#cfx').onclick = closeSheet;
  sheetPanel.querySelector('#cfgo').onclick = async (e) => {
    e.target.disabled = true; e.target.textContent = 'جارٍ التنفيذ…';
    const err = await run();
    if(err){
      sheetPanel.querySelector('#cfmsg').innerHTML = '<div class="err">' + esc(err) + '</div>';
      e.target.disabled = false; e.target.textContent = label; return;
    }
    closeSheet();
  };
}

/* ================= settings ================= */
function viewSettings(){
  const wrap = el('<div style="display:flex;flex-direction:column;gap:16px"></div>');
  const parent = actingRole() === 'parent';
  const busOnly = actingRole() === 'bus';

  // --- notifications ---
  const card = el(`<div class="card"><h3>الإشعارات</h3></div>`);
  const rows = [
    ['attendance', 'الوصول والمغادرة', parent ? 'تنبيه فور تسجيل دخول أو خروج طفلك.' : 'تنبيه عند تسجيل الحضور.'],
    ['announcements', 'إعلانات الإدارة', 'الرحلات، الإجازات، التذكيرات.'],
  ];
  if(!parent) rows.push(['absence', 'بلاغات الغياب', 'عندما يُبلّغ ولي أمر عن غياب طفله.']);

  rows.forEach(([key, title, desc]) => {
    const r = el(`<div class="switchrow"><div class="t"><b>${title}</b><span>${desc}</span></div>
      <button class="sw" role="switch" aria-checked="${!!S.notif[key]}"></button></div>`);
    r.querySelector('.sw').onclick = async (e) => {
      S.notif[key] = !S.notif[key];
      e.target.setAttribute('aria-checked', String(!!S.notif[key]));
      await safe(sb.rpc('set_notif', { p: S.notif }));
    };
    card.appendChild(r);
    card.appendChild(el('<div class="divider"></div>'));
  });

  const act = el(`<div class="field"><label for="ac">الأنشطة والصور</label>
    <select id="ac">
      <option value="instant" ${S.notif.activities==='instant'?'selected':''}>تنبيه فوري لكل نشاط</option>
      <option value="daily" ${S.notif.activities==='daily'?'selected':''}>ملخّص واحد الساعة ٦ مساءً</option>
      <option value="off" ${S.notif.activities==='off'?'selected':''}>بدون تنبيه</option>
    </select></div>`);
  act.querySelector('#ac').onchange = async (e) => {
    S.notif.activities = e.target.value;
    await safe(sb.rpc('set_notif', { p: S.notif }));
    toast('تم الحفظ');
  };
  card.appendChild(act);

  const quiet = el(`<div class="switchrow"><div class="t"><b>ساعات الهدوء</b><span>لا تصل تنبيهات الأنشطة والإعلانات بين ٩ مساءً و٦ صباحًا.</span></div>
    <button class="sw" role="switch" aria-checked="${!!S.notif.quiet}"></button></div>`);
  quiet.querySelector('.sw').onclick = async (e) => {
    S.notif.quiet = !S.notif.quiet;
    e.target.setAttribute('aria-checked', String(!!S.notif.quiet));
    await safe(sb.rpc('set_notif', { p: S.notif }));
  };
  card.appendChild(quiet);
  if(!busOnly) wrap.appendChild(card);

  if(busOnly){
    wrap.appendChild(el(`<div class="card"><h3>مرافقة الحافلة</h3>
      <p class="help">تظهر لك أطفال الحافلة فقط. أول ضغطة تسجّل ركوب الطفل، والثانية تسجّل وصوله، والثالثة تلغي التسجيل إذا ضغطتِ على الطفل الخطأ.</p>
      <p class="help">ولي الأمر يصله إشعار فوري عند كل ضغطة.</p></div>`));
  }

  // --- device ---
  if(!busOnly){
    const dev = el('<div class="card"><h3>هذا الجهاز</h3></div>');
    const b = pushBanner();
    if(b) dev.appendChild(b);
    else dev.appendChild(el('<p class="help">الإشعارات مفعّلة على هذا الجهاز ✅</p>'));
    wrap.appendChild(dev);
  }

  // --- privacy (parents) ---
  if(parent){
    const pv = el(`<div class="card"><h3>الخصوصية والموافقة</h3></div>`);

    if(!S.consentGiven){
      pv.appendChild(el(`<p class="help">لم تُسجَّل موافقتك بعد. الموافقة الأساسية لازمة لعرض بيانات طفلك.</p>`));
      const cb = el('<button class="btn sm">تسجيل الموافقة</button>');
      cb.onclick = async () => {
        const r = await safe(sb.rpc('set_consent', { p_photo: null, p_version: POLICY_VERSION }));
        if(!r){ toast('تعذّر الحفظ'); return; }
        S.consentGiven = true; toast('تم تسجيل الموافقة'); render();
      };
      pv.appendChild(cb);
    } else {
      pv.appendChild(el(`<div class="switchrow"><div class="t"><b>البيانات الأساسية</b>
        <span>الاسم، الفصل، الحضور والغياب، رحلات الحافلة. لازمة لتشغيل الخدمة.</span></div>
        <span class="tagx free">مُفعّلة</span></div>`));

      const ph = el(`<div class="switchrow"><div class="t"><b>نشر صور طفلي</b>
        <span>اختياري. إيقافه لا يُخرجك من التطبيق — يستمر كل شيء عدا الصور.</span></div>
        <button class="sw" role="switch" aria-checked="${!!S.photoConsent}"></button></div>`);
      ph.querySelector('.sw').onclick = async (e) => {
        const want = !S.photoConsent;
        const r = await safe(sb.rpc('set_photo_consent', { p_ok: want }));
        if(!r){ toast('تعذّر الحفظ'); return; }
        S.photoConsent = want;
        e.target.setAttribute('aria-checked', String(want));
        toast(want ? 'تم السماح بنشر الصور' : 'تم إيقاف نشر الصور. أبلغ الروضة لحذف الصور المنشورة سابقًا.');
      };
      pv.appendChild(ph);

      const wd = el('<button class="btn soft sm">سحب الموافقة الأساسية وإغلاق الحساب</button>');
      wd.onclick = deleteMyAccountSheet;
      pv.appendChild(wd);
    }

    pv.appendChild(el(`<p class="help" style="margin-top:4px">
      <a href="${POLICY_URL}" target="_blank" rel="noopener">اقرأ سياسة الخصوصية كاملة</a></p>`));
    wrap.appendChild(pv);
  }

  // --- password ---
  const pw = el(`<div class="card"><h3>كلمة المرور</h3>
    <div class="field"><label for="np">كلمة مرور جديدة</label><input id="np" type="password" minlength="8" autocomplete="new-password" placeholder="٨ أحرف على الأقل"></div>
    <div class="field"><label for="np2">تأكيد كلمة المرور</label><input id="np2" type="password" minlength="8" autocomplete="new-password" placeholder="أعِد كتابة كلمة المرور">
      <p class="help" id="nphint"></p></div>
    <div id="pwmsg"></div>
    <button class="btn soft sm" id="pwsave">تغيير كلمة المرور</button></div>`);
  {
    const a = pw.querySelector('#np'), b = pw.querySelector('#np2'), hint = pw.querySelector('#nphint');
    const checkMatch = () => {
      if(!b.value){ hint.textContent = ''; return; }
      const same = a.value === b.value;
      hint.textContent = same ? '✓ متطابقتان' : 'كلمتا المرور غير متطابقتين';
      hint.style.color = same ? 'var(--green-ink)' : 'var(--pink-ink)';
    };
    a.addEventListener('input', checkMatch);
    b.addEventListener('input', checkMatch);
  }
  pw.querySelector('#pwsave').onclick = async () => {
    const v  = pw.querySelector('#np').value;
    const v2 = pw.querySelector('#np2').value;
    const out = pw.querySelector('#pwmsg');
    if(!v || v.length < 8){ out.innerHTML = '<div class="err">٨ أحرف على الأقل.</div>'; return; }
    if(v !== v2){ out.innerHTML = '<div class="err">كلمتا المرور غير متطابقتين.</div>'; return; }
    const { error } = await sb.auth.updateUser({ password: v });
    out.innerHTML = error
      ? '<div class="err">'+esc(error.message)+'</div>'
      : '<div class="ok">تم تغيير كلمة المرور.</div>';
    if(!error){ pw.querySelector('#np').value = ''; pw.querySelector('#np2').value = ''; pw.querySelector('#nphint').textContent = ''; }
  };
  wrap.appendChild(pw);

  // --- delete my own account (App Store 5.1.1(v)) ---
  // parents reach this through the consent card above; everyone else gets it here
  if(S.profile.role !== 'parent' && !S.isOwner && !S.preview){
    const da = el(`<div class="card danger">
      <h3>حذف حسابي</h3>
      <p class="help">يحذف حسابك وكلمة مرورك وإشعاراتك نهائيًا. سجلّات الحضور والأنشطة التي تخصّ الروضة تبقى لديها كسجلّ رسمي.</p>
      <button class="btn soft sm" id="dme" style="color:var(--pink)">حذف حسابي نهائيًا…</button>
    </div>`);
    da.querySelector('#dme').onclick = deleteMyAccountSheet;
    wrap.appendChild(da);
  }

  const out = el('<button class="btn soft">تسجيل الخروج</button>');
  out.onclick = async()=>{ if(S.channel) sb.removeChannel(S.channel); await unregisterNative(); await sb.auth.signOut(); location.reload(); };
  wrap.appendChild(out);
  return wrap;
}

/* ================= push ================= */
const VAPID_PUBLIC = 'BNqCBI2yu25gyEKTWJ-7EumIBd7-ggybkflelEWHougONUbkkF1t6HJ2xpNCPTWMt9k6BgsXEaxSN4tGh3ic3U0';
function b64ToBytes(b64){
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g,'+').replace(/_/g,'/'));
  const out = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) out[i] = raw.charCodeAt(i);
  return out;
}
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const NativePush = !DEMO && IS_NATIVE && (PLATFORM !== 'android' || window.__ANDROID_PUSH === true)
  && window.Capacitor.Plugins && window.Capacitor.Plugins.PushNotifications;
const pushSupported = NativePush ? true
  : (!DEMO && !IS_NATIVE && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window);

// ---- iPhone app: Apple push (APNs). The token arrives through a listener. ----
let nativeToken = null;
function nativePushListeners(){
  if(!NativePush || nativePushListeners.done) return;
  nativePushListeners.done = true;
  NativePush.addListener('registration', async (t) => {
    nativeToken = t && t.value;
    if(!nativeToken || !S.profile) return;
    const r = await safe(sb.rpc('register_device', { p_token: nativeToken, p_platform: PLATFORM === 'android' ? 'android' : 'ios' }));
    S.pushOn = !!r;
    render();
  });
  NativePush.addListener('registrationError', () => { S.pushOn = false; render(); });
  // tapping a notification opens the app on fresh data
  NativePush.addListener('pushNotificationActionPerformed', async () => {
    if(S.session && S.profile && S.kg){ await refresh(); render(); }
  });
}
async function enablePushNative(){
  nativePushListeners();
  let p = await NativePush.checkPermissions();
  if(p.receive === 'prompt' || p.receive === 'prompt-with-rationale') p = await NativePush.requestPermissions();
  S.nativePerm = p.receive;
  if(p.receive !== 'granted') throw new Error('لم يُسمح بالإشعارات. فعّلها من الإعدادات ← Kidora ← الإشعارات.');
  await NativePush.register();
}
async function checkPushStateNative(){
  nativePushListeners();
  const p = await NativePush.checkPermissions();
  S.nativePerm = p.receive;
  // already allowed: show it as on now; refresh the token with Apple in the background
  if(p.receive === 'granted'){ S.pushOn = true; NativePush.register().catch(()=>{}); }
  else S.pushOn = false;
}
async function unregisterNative(){
  if(!NativePush || !nativeToken) return;
  await safe(sb.rpc('unregister_device', { p_token: nativeToken }));
}

async function registerSW(){
  if(IS_NATIVE || !('serviceWorker' in navigator)) return null;
  try { return await navigator.serviceWorker.register('sw.js'); } catch(e){ return null; }
}
async function saveSubscription(sub){
  const j = sub.toJSON();
  const { error } = await sb.from('push_subscriptions').upsert({
    profile_id: S.profile.id, endpoint: j.endpoint,
    p256dh: j.keys.p256dh, auth: j.keys.auth, user_agent: navigator.userAgent
  }, { onConflict: 'endpoint' });
  if(error) throw new Error('تعذّر حفظ الاشتراك.');
  S.pushOn = true;
}
async function enablePush(){
  if(NativePush) return enablePushNative();
  if(!pushSupported) throw new Error('متصفحك لا يدعم الإشعارات.');
  const reg = await registerSW();
  if(!reg) throw new Error('تعذّر تشغيل خدمة الإشعارات.');
  await navigator.serviceWorker.ready;
  const perm = await Notification.requestPermission();
  if(perm !== 'granted') throw new Error('لم يتم السماح بالإشعارات من إعدادات المتصفح.');
  let sub = await reg.pushManager.getSubscription();
  if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: b64ToBytes(VAPID_PUBLIC) });
  await saveSubscription(sub);
}
// signed photo links last an hour; reuse them for 50 minutes instead of
// requesting fresh ones on every redraw (that was a network call per post)
const _signed = new Map();
async function signedUrls(paths){
  const now = Date.now();
  const missing = (paths||[]).filter(p => { const c = _signed.get(p); return !c || c.exp < now; });
  if(missing.length){
    const r = await sb.storage.from('photos').createSignedUrls(missing, 3600);
    ((r && r.data) || []).forEach((d,i) => { if(d && d.signedUrl) _signed.set(d.path || missing[i], { url:d.signedUrl, exp: now + 50*60*1000 }); });
  }
  return (paths||[]).map(p => (_signed.get(p) || {}).url).filter(Boolean);
}
function notifyServer(payload){ sb.functions.invoke('notify', { body: payload }).catch(()=>{}); }

function pushBanner(){
  // on iPhone Safari the App Store app is the reliable way to get alerts
  const iosHint = el(`<div class="notif">
    <div class="t"><b>حمّل تطبيق كيدورا</b><span>لتصلك الإشعارات فور وصول طفلك. سجّل الدخول فيه بنفس رقم الجوال وكلمة المرور.</span></div>
    <a class="nbtn" href="https://apps.apple.com/sa/app/id6819013599" target="_blank" rel="noopener">App Store</a>
  </div>`);
  if(NativePush){
    if(S.pushOn) return null;
    if(S.nativePerm === 'denied'){
      return el(`<div class="notif info"><div class="t"><b>الإشعارات موقوفة</b><span>فعّلها من الإعدادات ← Kidora ← الإشعارات.</span></div></div>`);
    }
  } else {
  if(!pushSupported) return (isIOS && !isStandalone) ? iosHint : null;
  if(Notification.permission === 'granted' && S.pushOn) return null;
  if(Notification.permission === 'denied'){
    return el(`<div class="notif info"><div class="t"><b>الإشعارات موقوفة</b><span>فعّلها من إعدادات المتصفح لهذا الموقع.</span></div></div>`);
  }
  if(isIOS && !isStandalone) return iosHint;
  }
  const n = el(`<div class="notif">
    <div class="t"><b>فعّل إشعارات الهاتف</b><span>ليصلك تنبيه فور وصول طفلك أو نشر نشاط.</span></div>
    <button type="button">تفعيل</button>
  </div>`);
  n.querySelector('button').onclick = async (e) => {
    e.target.disabled = true; e.target.textContent = '…';
    try { await enablePush(); toast('تم تفعيل الإشعارات'); render(); }
    catch(err){ toast(err.message); e.target.disabled=false; e.target.textContent='تفعيل'; }
  };
  return n;
}

async function checkPushState(){
  if(NativePush){ try { await checkPushStateNative(); } catch(_){ S.pushOn = false; } return; }
  if(!pushSupported || Notification.permission !== 'granted'){ S.pushOn = false; return; }
  const reg = await registerSW();
  if(!reg){ S.pushOn = false; return; }
  const sub = await reg.pushManager.getSubscription();
  if(!sub){ S.pushOn = false; return; }
  S.pushOn = true;
  saveSubscription(sub).catch(() => { S.pushOn = false; });   // don't wait on the network
}

/* ================= shell ================= */
// Redraw without losing your place. Switching tabs starts at the top;
// a background refresh on the same tab keeps the scroll exactly where it was.
function render(){
  const sameTab = render._tab === S.tab;
  const y = window.scrollY;
  renderInner();
  window.scrollTo(0, (sameTab && render._tab === S.tab) ? y : 0);
  render._tab = S.tab;
}
// For updates nobody asked for (timer, live changes): skip while someone is
// typing or has a sheet open, so the keyboard never closes under them.
function softRender(){
  const a = document.activeElement;
  const typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  const sheetOpen = typeof sheet !== 'undefined' && sheet.classList.contains('open');
  if(typing || sheetOpen){ softRender.pending = true; return; }
  softRender.pending = false;
  render();
}
function renderInner(){
  const role = actingRole();
  const staff = role==='admin' || role==='teacher';
  const isBus = role==='bus';
  const tabs = (staff
    ? [{k:'roster',l:'الفصل',i:'users'}, {k:'feed',l:'الأخبار',i:'home'}].concat(role==='admin'?[{k:'admin',l:'الإدارة',i:'chart'}]:[])
    : isBus
    ? [{k:'bus',l:'الحافلة',i:'car'}]
    : [{k:'home',l:'طفلي',i:'home'}]
  ).concat(S.isOwner && !S.preview ? [{k:'platform',l:'المنصة',i:'chart'}] : [])
   .concat([{k:'settings',l:'الإعدادات',i:'gear'}]);
  if(!S.tab || !tabs.find(t=>t.k===S.tab)) S.tab = tabs[0].k;

  document.documentElement.classList.remove('authmode');
  app.innerHTML = '';
  if(DEMO) app.appendChild(demoBanner());
  const cls = S.classes.find(c=>c.id===S.activeClass);
  const sub = staff && S.tab==='roster' && cls ? 'فصل '+cls.name+' · '+fmtDay(new Date())
            : isBus && S.tab==='bus' ? BUS_TRIPS[S.busTrip] + ' · ' + fmtDay(new Date())
            : fmtDay(new Date());

  const top = el(`<div class="topbar">
    <img class="logo" src="${esc(brandLogo())}" alt="">
    <div class="who"><b>${esc(brandName())}</b><span>${esc(sub)}</span></div>
    <button class="iconbtn" id="gotoSettings" aria-label="الإعدادات">${ICONS.gear}</button>
  </div>`);
  top.querySelector('#gotoSettings').onclick = ()=>{ S.tab='settings'; render(); };
  app.appendChild(top);

  const main = el('<main></main>');
  if(S.preview){
    const pv = el(`<div class="notif info">
      <div class="t"><b>معاينة كـ ${esc(ROLE_AR[S.preview]||S.preview)}</b><span>هذا عرض تجريبي — البيانات حقيقية والأزرار معطّلة.</span></div>
      <button type="button">خروج</button>
    </div>`);
    pv.querySelector('button').onclick = ()=>setPreview(null);
    main.appendChild(pv);
  }
  if(S.tab !== 'settings' && !isBus && !S.preview){
    const banner = pushBanner();
    if(banner) main.appendChild(banner);
  }
  if(S.tab==='settings') main.appendChild(viewSettings());
  else if(S.tab==='platform') main.appendChild(viewPlatform());
  else if(S.tab==='roster') main.appendChild(viewRoster());
  else if(S.tab==='bus') main.appendChild(viewBus());
  else if(S.tab==='admin') main.appendChild(viewAdmin());
  else if(S.tab==='feed') main.appendChild(buildFeed());
  else main.appendChild(viewParent());
  app.appendChild(main);

  if(tabs.length>1){
    const nav = el('<nav class="tabs"></nav>');
    tabs.forEach(t=>{
      const nNew = t.k === 'roster' ? unseenReportCount() : 0;
      const b = el(`<button ${S.tab===t.k?'aria-current="page"':''}>${ICONS[t.i]}<span>${t.l}</span>${nNew ? `<i class="tbadge">${nNew > 9 ? '9+' : nNew}</i>` : ''}</button>`);
      b.onclick = async ()=>{ S.tab=t.k; render();
        if(t.k==='admin'){
          await Promise.all([ S.invites.length ? null : loadInvites(), S.staff.length ? null : loadStaff(), loadResets() ]);
          if(S.tab==='admin') render();
        }
        if(t.k==='platform'){ await loadTenants(); if(S.tab==='platform') render(); }
      };
      nav.appendChild(b);
    });
    app.appendChild(nav);
  }
}

/* ================= boot ================= */
async function boot(){
  // links like kidora.answer.sa/?demo=parent open the demo straight away
  if(!DEMO){
    const want = new URLSearchParams(location.search).get('demo');
    if(want !== null){
      history.replaceState(null, '', location.pathname);
      if(['parent','teacher','admin'].includes(want)) { startDemo(want); return; }
      boot.openDemo = true;
    }
  }
  {
    const qs = new URLSearchParams(location.search), c = (qs.get('code')||'').trim().toUpperCase();
    if(/^[A-Z]-[A-Z0-9]{4,16}$/.test(c)){
      try { sessionStorage.setItem('kidora_code', c); } catch(_){}
      qs.delete('code'); history.replaceState(null, '', location.pathname + (qs.toString() ? '?' + qs : ''));
    }
  }
  app.innerHTML = '<div class="spin"></div>';
  if(!S.brand) await loadBrand();
  const { data } = await sb.auth.getSession();
  S.session = data.session;
  if(!S.session){ renderAuth(pendingCode() ? 'up' : 'in'); if(boot.openDemo){ boot.openDemo = false; demoRoleSheet(); } return; }
  const ready = await loadCore();
  if(!ready){ renderNeedsCode(); return; }
  subscribe();
  S.pending = new Set(queueGet().map(x => x.child_id));
  await checkPushState();
  render();
  flushQueue();
  if(boot.timer) clearInterval(boot.timer);   // boot() runs again after sign-in/out; keep one timer
  boot.timer = setInterval(async()=>{
    if(!(S.session && document.visibilityState==='visible')) return;
    await flushQueue();
    const before = stateSig(); await refresh();
    if(stateSig() !== before || softRender.pending) softRender();
  }, 60000);
}
// a cheap fingerprint of what's on screen, so the timer redraws only on real change
function stateSig(){
  try { return JSON.stringify([S.attendance, S.absences, S.pickups, S.myBus,
    (S.posts||[]).map(p=>p.id), (S.updates||[]).map(u=>u.child_id+'|'+u.updated_at),
    (S.children||[]).length]); } catch(_){ return String(Math.random()); }
}
document.addEventListener('visibilitychange', async ()=>{
  if(document.visibilityState==='visible' && S.session && S.profile && S.kg){
    const before = stateSig(); await refresh();
    if(stateSig() !== before || softRender.pending) softRender();
  }
});
// catch up on anything skipped while the keyboard was open
document.addEventListener('focusout', () => setTimeout(() => { if(softRender.pending) softRender(); }, 300));
boot();
</script>
