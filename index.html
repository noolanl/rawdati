<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; media-src 'self' blob: https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-itunes-app" content="app-id=6819013599">
<script>if(location.protocol==='http:' && /(^|\.)answer\.sa$/.test(location.hostname)) location.replace('https://' + location.host + location.pathname + location.search + location.hash);</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kidora">
<title>Kidora — كيدورا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* ===== brand tokens — taken from the kindergarten logo ===== */
:root{
  --ground:#F2F8FC;
  --surface:#FFFFFF;
  --sunken:#EDF3F8;
  --ink:#22374A;
  --ink-2:#7791A6;
  --line:#E4EEF6;

  --pink:#E0206E;      --pink-soft:#FDE7F0;   --pink-ink:#A5124F;
  --blue:#24A7E1;      --blue-soft:#E3F5FD;   --blue-ink:#0E6E99;
  --green:#7FB227;     --green-soft:#EEF7DF;  --green-ink:#4F7212;
  --yellow:#EFB513;    --yellow-soft:#FEF4D9; --yellow-ink:#9A6E00;

  --shadow-sm:0 2px 8px rgba(34,55,74,.06);
  --shadow:0 10px 28px -14px rgba(34,55,74,.30);
  --r-lg:24px; --r-md:18px; --r-sm:14px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif;font-weight:700;margin:0;text-wrap:balance;line-height:1.35}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
img{max-width:100%}

/* ===== shell ===== */
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--ground)}
.topbar{padding-top:calc(12px + var(--safe-area-inset-top, env(safe-area-inset-top))) !important}
.topbar{
  position:sticky;top:0;z-index:30;background:var(--surface);
  padding:12px 16px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--line);
}
.logo{width:42px;height:42px;flex:none;border-radius:13px;background:#fff;object-fit:contain;padding:1px}
.topbar .who{flex:1;min-width:0}
.topbar .who b{display:block;font-family:"Baloo Bhaijaan 2",sans-serif;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .who span{font-size:12px;color:var(--ink-2)}
.iconbtn{
  background:var(--sunken);border:none;border-radius:12px;width:38px;height:38px;flex:none;
  display:grid;place-items:center;cursor:pointer;color:var(--ink-2);
}
.iconbtn svg{width:17px;height:17px}
main{flex:1;padding:16px 16px 100px;display:flex;flex-direction:column;gap:16px}

/* ===== auth ===== */
.auth{max-width:410px;margin:0 auto;padding:34px 22px 48px;display:flex;flex-direction:column;gap:18px;min-height:100%;justify-content:center}
.auth{width:100%;flex:1;min-height:100vh;min-height:100dvh;justify-content:flex-start;
  padding-top:calc(24px + var(--safe-area-inset-top, env(safe-area-inset-top, 0px)));
  padding-bottom:calc(24px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)))}
.auth-logo{display:block;width:104px;margin:0 auto 2px;padding:14px;background:#fff;border-radius:28px;box-shadow:var(--shadow-sm)}
.auth h1{font-size:27px;text-align:center}
/* sign-in screens: the page itself never scrolls or bounces; only this box scrolls, and only if it must */
html.authmode, html.authmode body{height:100%;overflow:hidden;overscroll-behavior:none}
html.authmode #app{height:100%;min-height:0}
html.authmode .auth{height:100%;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.auth > :first-child{margin-top:auto}
.auth > :last-child{margin-bottom:auto}
@media (max-height:940px){
  .auth{gap:14px}
  .auth-logo{width:90px;padding:12px;border-radius:25px}
  .trydemo{padding-top:12px;margin-top:2px;gap:6px}
}
@media (max-height:760px){
  .auth{gap:12px}
  .auth-logo{width:78px;padding:10px;border-radius:22px}
  .auth h1{font-size:23px}
  .trydemo{padding-top:10px;margin-top:0}
}
.trydemo{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:6px;padding-top:16px;border-top:1px solid var(--line)}
.trydemo span{font-size:13px;color:var(--ink-2)}
.trydemo .btn{width:100%}
.demoroles{display:flex;flex-direction:column;gap:10px}
.demorole{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:right;padding:14px 16px;border-radius:16px;
  border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font:inherit;color:var(--ink)}
.demorole b{font-size:16px}
.demorole span{font-size:12.5px;color:var(--ink-2)}
.demorole:active{border-color:var(--pink)}
.demobar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:calc(8px + var(--safe-area-inset-top, env(safe-area-inset-top, 0px))) 14px 8px;background:var(--yellow-soft);color:var(--yellow-ink);font-size:12.5px;font-weight:600}
.demobar span{flex:1;min-width:150px}
.demobar button{border:none;background:rgba(0,0,0,.06);color:inherit;font:inherit;font-weight:700;border-radius:999px;padding:5px 12px;cursor:pointer}
body:has(.demobar) .topbar{position:relative;padding-top:12px !important}
.auth .sub{margin:0;text-align:center;font-size:13.5px;color:var(--ink-2)}
.segmented{display:flex;background:var(--sunken);border-radius:999px;padding:5px;gap:5px}
.segmented button{
  flex:1;border:none;background:transparent;border-radius:999px;padding:10px;cursor:pointer;
  font-weight:600;color:var(--ink-2);font-size:14px;transition:.2s;
}
.segmented button[aria-selected="true"]{background:var(--surface);color:var(--pink);box-shadow:var(--shadow-sm)}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;color:var(--ink-2);font-weight:600}
.field input,.field textarea,.field select{
  background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-sm);
  padding:13px 15px;width:100%;transition:border-color .18s;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);outline:none}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-2);opacity:.65}
.help{font-size:12px;color:var(--ink-2);margin:0}
.err{background:var(--pink-soft);color:var(--pink-ink);border-radius:var(--r-sm);padding:11px 14px;font-size:13.5px}
.ok{background:var(--green-soft);color:var(--green-ink);border-radius:var(--r-sm);padding:11px 14px;font-size:13.5px}

/* ===== buttons ===== */
.btn{
  border:none;border-radius:999px;padding:14px 20px;cursor:pointer;width:100%;
  font-family:"Baloo Bhaijaan 2",sans-serif;font-size:16px;font-weight:600;
  background:var(--pink);color:#fff;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 6px 16px -8px rgba(224,32,110,.7);transition:transform .12s;
}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.55;cursor:progress;box-shadow:none}
.btn.blue{background:var(--blue);box-shadow:0 6px 16px -8px rgba(36,167,225,.7)}
.btn.green{background:var(--green);box-shadow:0 6px 16px -8px rgba(127,178,39,.7)}
.btn.soft{background:var(--sunken);color:var(--ink);box-shadow:none}
.btn.sm{padding:11px 16px;font-size:14.5px}
.btn svg{width:17px;height:17px}
.linkbtn{background:none;border:none;color:var(--blue);cursor:pointer;font-weight:600;font-size:13.5px;padding:0}

/* ===== pieces ===== */
.card{background:var(--surface);border-radius:var(--r-lg);padding:17px;display:flex;flex-direction:column;gap:11px;box-shadow:var(--shadow-sm)}
.card h3{font-size:16.5px}

.chips{display:flex;gap:6px;overflow-x:auto;background:var(--sunken);border-radius:999px;padding:5px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  border:none;background:transparent;border-radius:999px;padding:9px 16px;white-space:nowrap;
  cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink-2);transition:.2s;
}
.chip[aria-pressed="true"]{background:var(--surface);color:var(--blue);box-shadow:var(--shadow-sm)}

.counter{display:flex;gap:9px}
.pill{flex:1;border-radius:var(--r-md);padding:12px 13px;display:flex;flex-direction:column;background:var(--surface);box-shadow:var(--shadow-sm)}
.pill b{font-family:"Baloo Bhaijaan 2",sans-serif;font-size:24px;line-height:1.1}
.pill span{font-size:11.5px;color:var(--ink-2)}
.pill.ok{background:var(--green-soft);box-shadow:none} .pill.ok b{color:var(--green-ink)}
.pill.left{background:var(--yellow-soft);box-shadow:none} .pill.left b{color:var(--yellow-ink)}
.pill.no{background:var(--pink-soft);box-shadow:none} .pill.no b{color:var(--pink-ink)}
.pill.blue{background:var(--blue-soft);box-shadow:none} .pill.blue b{color:var(--blue-ink)}

/* ===== roster ===== */
.roster{display:flex;flex-direction:column;gap:8px}
.kid{
  display:flex;align-items:center;gap:12px;width:100%;text-align:right;
  background:var(--surface);border:none;border-radius:var(--r-md);padding:11px 13px;cursor:pointer;
  box-shadow:var(--shadow-sm);transition:background .18s;
}
.kid:active{transform:scale(.995)}
.kid.present{background:var(--green-soft);box-shadow:none}
.kid.left{background:var(--yellow-soft);box-shadow:none}
.face{
  width:36px;height:36px;border-radius:12px;flex:none;display:grid;place-items:center;
  font-weight:700;font-size:14px;background:var(--blue-soft);color:var(--blue-ink);
}
.kid.present .face{background:#fff;color:var(--green-ink)}
.kid.left .face{background:#fff;color:var(--yellow-ink)}
.kid .nm{flex:1;min-width:0}
.kid .nm b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kid .nm span{font-size:12px;color:var(--ink-2)}
.check{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--line);color:transparent;background:#fff}
.kid.present .check{background:var(--green);border-color:var(--green);color:#fff}
.kid.left .check{background:var(--yellow);border-color:var(--yellow);color:#fff}
.check svg{width:14px;height:14px}
.kid.busy{opacity:.5;pointer-events:none}
.kid.riding{background:var(--blue-soft);box-shadow:none}
.kid.riding .face{background:#fff;color:var(--blue-ink)}
.kid.riding .check{background:var(--blue);border-color:var(--blue);color:#fff}
.bell{font-size:11px;vertical-align:middle;opacity:.85}

/* ===== parent hero ===== */
.hero{border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:6px;background:var(--green-soft)}
.hero.out{background:var(--surface);box-shadow:var(--shadow-sm)}
.hero.left{background:var(--yellow-soft)}
.hero .st{display:flex;align-items:center;gap:10px;font-family:"Baloo Bhaijaan 2",sans-serif;font-size:20px;color:var(--green-ink)}
.hero.out .st{color:var(--ink-2)} .hero.left .st{color:var(--yellow-ink)}
.dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.hero small{color:var(--ink-2);font-size:13px}
.hero .who-kid{font-size:12px;color:var(--ink-2);font-weight:600}

/* ===== feed ===== */
.feed{display:flex;flex-direction:column;gap:12px}
.post{background:var(--surface);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-sm)}
.post.tint-green{background:var(--green-soft);box-shadow:none}
.post.tint-yellow{background:var(--yellow-soft);box-shadow:none}
.post.tint-blue{background:var(--blue-soft);box-shadow:none}
.post-head{display:flex;align-items:center;gap:11px}
.ic{width:36px;height:36px;border-radius:12px;flex:none;display:grid;place-items:center;background:#fff}
.ic svg{width:17px;height:17px}
.ic.green{color:var(--green-ink)} .ic.yellow{color:var(--yellow-ink)}
.ic.blue{color:var(--blue-ink)} .ic.pink{color:var(--pink-ink)}
.post-head .t{flex:1;min-width:0}
.post-head .t b{display:block;font-size:14.5px;font-weight:600}
.post-head .t span{font-size:12px;color:var(--ink-2)}
.postdel{flex:none;width:32px;height:32px;border:none;border-radius:10px;background:transparent;color:var(--ink-2);display:grid;place-items:center;cursor:pointer;transition:.15s}
.postdel svg{width:17px;height:17px}
.postdel:hover{background:var(--pink-soft);color:var(--pink-ink)}
.danger{border:1px solid var(--pink-soft);background:var(--surface)}
.danger h3{color:var(--pink-ink)}
.danger .confirmbox{width:100%;text-align:center;letter-spacing:.16em;font-weight:700;text-transform:uppercase}
.post p{margin:0;font-size:14.5px;line-height:1.6}

.shots{display:grid;gap:6px}
.shots.n1{grid-template-columns:1fr}
.shots.n2{grid-template-columns:1fr 1fr}
.shots.n3{grid-template-columns:repeat(3,1fr)}
.shots button{border:none;padding:0;background:var(--sunken);border-radius:var(--r-sm);overflow:hidden;cursor:pointer;display:block}
.shots.n1 button{aspect-ratio:4/3}
.shots.n2 button,.shots.n3 button{aspect-ratio:1}
.shots img{width:100%;height:100%;object-fit:cover;display:block}
.shots .more{position:relative}
.shots .more::after{
  content:attr(data-more);position:absolute;inset:0;display:grid;place-items:center;
  background:rgba(34,55,74,.55);color:#fff;font-family:"Baloo Bhaijaan 2",sans-serif;font-size:20px;
}

/* ===== lightbox ===== */
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(20,32,44,.94);display:none;align-items:center;justify-content:center;padding:16px}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:86vh;border-radius:var(--r-md);object-fit:contain}
.lightbox .x{position:absolute;top:calc(14px + var(--safe-area-inset-top, env(safe-area-inset-top)));left:14px;width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.16);color:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center}

/* ===== dashboard ===== */
.bars{display:flex;flex-direction:column;gap:13px}
.bar{display:grid;grid-template-columns:1fr 60px;gap:10px;align-items:center;font-size:13.5px}
.bar .lbl{display:flex;flex-direction:column;gap:6px}
.track{height:9px;border-radius:99px;background:var(--sunken);overflow:hidden}
.fill{height:100%;background:var(--green);border-radius:99px;transition:width .5s}
.bar .val{text-align:left;color:var(--ink-2)}

.codes{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
.code{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--sunken);border-radius:var(--r-sm);padding:9px 13px;font-size:13px}
.code b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:600;color:var(--blue-ink)}
.code .used{color:var(--ink-2);font-size:11.5px}

/* ===== admin sub-nav, lists, absence ===== */
.subnav{display:flex;gap:6px;overflow-x:auto;background:var(--sunken);border-radius:999px;padding:5px;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav button{border:none;background:transparent;border-radius:999px;padding:9px 15px;white-space:nowrap;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.subnav button[aria-pressed="true"]{background:var(--surface);color:var(--pink);box-shadow:var(--shadow-sm)}

.rowlist{display:flex;flex-direction:column;gap:8px}
.row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:right;cursor:pointer;
  background:var(--surface);border:none;border-radius:var(--r-md);padding:11px 13px;box-shadow:var(--shadow-sm);
}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{font-size:12px;color:var(--ink-2)}
.row .tagx,.switchrow .tagx{flex:none;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--sunken);color:var(--ink-2)}
.row .tagx.free,.switchrow .tagx.free{background:var(--green-soft);color:var(--green-ink)}
.row .tagx.full{background:var(--blue-soft);color:var(--blue-ink)}

.codebox{display:flex;align-items:center;gap:10px;background:var(--blue-soft);border-radius:var(--r-md);padding:13px 15px}
.codebox b{flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:17px;color:var(--blue-ink);letter-spacing:.04em}
.codebox button{border:none;background:var(--blue);color:#fff;border-radius:999px;padding:8px 15px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}

.kid.absent{background:var(--pink-soft);box-shadow:none}
.kid.absent .face{background:#fff;color:var(--pink-ink)}
.absent-note{display:flex;align-items:center;gap:10px;background:var(--pink-soft);border-radius:var(--r-md);padding:12px 15px;font-size:13.5px;color:var(--pink-ink)}
.absent-note .t{flex:1}
.absent-note button{border:none;background:transparent;color:var(--pink-ink);font-weight:700;cursor:pointer;font-size:13px;text-decoration:underline;font-family:inherit}
.actions2{display:flex;gap:9px}
.actions2 .btn{flex:1}

.switchrow{display:flex;align-items:center;gap:12px;padding:11px 0}
.switchrow .t{flex:1;min-width:0}
.switchrow .t b{display:block;font-size:14.5px;font-weight:600}
.switchrow .t span{font-size:12.5px;color:var(--ink-2)}
.sw{width:48px;height:28px;border-radius:999px;background:var(--line);border:none;flex:none;position:relative;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw[aria-checked="true"]{background:var(--green)}
.sw[aria-checked="true"]::after{transform:translateX(-20px)}
.divider{height:1px;background:var(--line);margin:2px 0}

.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{color:var(--ink-2);font-weight:600;font-size:11.5px}
.tbl td.num{font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

.consentbox{display:flex;gap:11px;align-items:flex-start;background:var(--sunken);border-radius:var(--r-md);padding:13px 15px;font-size:13.5px;line-height:1.6}
.consentbox input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--green)}
.pickup-note{display:flex;align-items:center;gap:10px;background:var(--blue-soft);border-radius:var(--r-md);padding:12px 15px;font-size:13.5px;color:var(--blue-ink)}
.pickup-note .t{flex:1}
.pickup-note button{border:none;background:transparent;color:var(--blue-ink);font-weight:700;cursor:pointer;font-size:13px;text-decoration:underline;font-family:inherit}

/* ===== notification banner ===== */
.notif{display:flex;align-items:center;gap:12px;background:var(--yellow-soft);border-radius:var(--r-md);padding:13px 15px}
.notif .t{flex:1;min-width:0}
.notif .t b{display:block;font-size:14px}
.notif .t span{font-size:12.5px;color:var(--ink-2)}
.notif .nbtn{border-radius:999px;padding:10px 16px;flex:none;background:var(--yellow);color:#fff;font-weight:700;font-size:13.5px;text-decoration:none;font-family:"Baloo Bhaijaan 2",sans-serif}
.notif button{
  border:none;border-radius:999px;padding:10px 18px;cursor:pointer;flex:none;
  background:var(--yellow);color:#fff;font-weight:700;font-size:13.5px;font-family:"Baloo Bhaijaan 2",sans-serif;
}
.notif.info{background:var(--blue-soft)}

/* ===== bottom nav ===== */
nav.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);
  border-top:1px solid var(--line);display:flex;padding:8px 10px calc(8px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom)));
  max-width:560px;margin:0 auto;
}
nav.tabs button{
  flex:1;background:none;border:none;cursor:pointer;border-radius:14px;padding:7px 4px;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink-2);font-weight:600;
}
nav.tabs button[aria-current="page"]{color:var(--pink)}
nav.tabs button{position:relative}
.tbadge{position:absolute;top:2px;inset-inline-start:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;
  background:var(--pink);color:#fff;font-size:11px;font-style:normal;font-weight:700;line-height:18px;text-align:center;box-shadow:0 0 0 2px var(--surface)}
.reports{display:flex;flex-direction:column;gap:10px}
.reports .rhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.reports .newcount{background:var(--pink-soft);color:var(--pink-ink);font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.rrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--sunken)}
.rrow.new{background:var(--pink-soft)}
.ricon{font-size:20px;flex:none}
.rtxt{flex:1;min-width:0;display:flex;flex-direction:column}
.rtxt b{font-size:14px}
.rtxt span{font-size:12.5px;color:var(--ink-2)}
.rnew{flex:none;font-size:11px;font-weight:700;color:#fff;background:var(--pink);border-radius:999px;padding:2px 8px}
nav.tabs svg{width:21px;height:21px}

/* ===== sheet + toast ===== */
.sheet{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(20,32,44,.45)}
.sheet.open{display:flex}
.sheet .panel{background:var(--surface);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom)));display:flex;flex-direction:column;gap:13px;max-height:88vh;overflow:auto}
.sheet h3{font-size:19px}
.toast{
  position:fixed;top:calc(12px + var(--safe-area-inset-top, env(safe-area-inset-top)));left:12px;right:12px;z-index:80;max-width:536px;margin:0 auto;
  background:var(--ink);color:#fff;border-radius:var(--r-md);padding:13px 16px;
  box-shadow:0 14px 30px -14px rgba(0,0,0,.5);
  opacity:0;transform:translateY(-16px);transition:.28s;pointer-events:none;font-size:14px;
}
.toast.show{opacity:1;transform:none}
.empty{text-align:center;color:var(--ink-2);font-size:14px;padding:28px 10px}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--pink);border-radius:50%;animation:sp .7s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}.btn:active{transform:none}}

/* ===== iPhone: fit the screen, no zoom, real tap feedback ===== */
html,body{overflow-x:clip;max-width:100%}
/* iOS zooms the whole page into any field under 16px — that zoom is what made
   the app slide sideways and stop fitting the screen */
input,select,textarea,.field input,.field textarea,.field select{font-size:16px}
/* every tappable thing answers the finger immediately */
button,.row,.chip,.kid,.iconbtn,nav.tabs button,.subnav button{transition:transform .09s ease,opacity .09s ease}
button:active,.row:active,.chip:active,.iconbtn:active,nav.tabs button:active,.subnav button:active{transform:scale(.96);opacity:.75}
.btn:active{transform:scale(.97);opacity:.85}
.kid:active{transform:scale(.985)}
button:disabled:active{transform:none;opacity:inherit}
/* inside the app: behave like an app, not a web page */
html.native,html.native body{overscroll-behavior:none;-webkit-text-size-adjust:100%}
html.native body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html.native input,html.native textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
html.native img{-webkit-user-drag:none;-webkit-touch-callout:none}
main{padding-bottom:max(100px, calc(84px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom))))}
@media (prefers-reduced-motion:reduce){button:active,.row:active,.chip:active,.btn:active,.kid:active{transform:none}}
#printarea{display:none}
@media print{
  @page{size:A4;margin:8mm}
  html.printing body > *:not(#printarea){display:none !important}
  html.printing #printarea{display:grid !important;grid-template-columns:1fr 1fr;gap:0;background:#fff}
  html.printing body{background:#fff !important}
}
.pcard{box-sizing:border-box;height:69mm;border:1px dashed #bbb;padding:5mm 6mm;display:flex;gap:5mm;align-items:center;break-inside:avoid;page-break-inside:avoid;font-family:"IBM Plex Sans Arabic",sans-serif;color:#241820;direction:rtl}
.pcard .qr{flex:0 0 33mm;width:33mm;height:33mm}
.pcard .qr svg{width:100%;height:100%}
.pcard .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1.4mm}
.pcard .kg{font-size:9pt;color:#A5124F;font-weight:600}
.pcard .nm{font-size:14pt;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .cl{font-size:9pt;color:#6E6069}
.pcard .cd{font:700 15pt "IBM Plex Mono",ui-monospace,monospace;direction:ltr;text-align:right;letter-spacing:.5px;background:#FDE9F1;border-radius:2mm;padding:1mm 2.5mm;align-self:flex-start}
.pcard .st{font-size:8pt;color:#6E6069;line-height:1.45}
</style>
</head>

<div id="app"><div class="spin"></div></div>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet"><div class="panel" id="sheetPanel"></div></div>
<div id="printarea" aria-hidden="true"></div>
<div class="lightbox" id="lightbox"><button class="x" id="lbClose" aria-label="إغلاق">✕</button><img id="lbImg" alt=""></div>

    const st = { op:'select', filters:[], order:null, limit:null, single:false, payload:null, ret:false };
    const run = () => {
      const tbl = T[t] || (T[t] = []);
      const match = r => st.filters.every(f => f(r));
      if(st.op === 'insert' || st.op === 'upsert'){
        const rows = (Array.isArray(st.payload) ? st.payload : [st.payload]).map(r => Object.assign({ id:uid(), created_at:new Date().toISOString() }, r));
        rows.forEach(r => tbl.unshift(r));
        return { data: st.single ? clone(rows[0]) : clone(rows), error:null };
      }
      if(st.op === 'update'){
        const hit = tbl.filter(match); hit.forEach(r => Object.assign(r, st.payload));
        return { data: st.single ? clone(hit[0]||null) : clone(hit), error:null };
      }
      if(st.op === 'delete'){
        for(let i = tbl.length - 1; i >= 0; i--) if(match(tbl[i])) tbl.splice(i, 1);
        return { data:null, error:null };
      }
      let rows = visible(t, tbl).filter(match);
      if(st.order){ const { col, asc } = st.order; rows = rows.slice().sort((a,b) => (a[col] > b[col] ? 1 : a[col] < b[col] ? -1 : 0) * (asc ? 1 : -1)); }
      if(st.limit != null) rows = rows.slice(0, st.limit);
      return { data: st.single ? clone(rows[0] || null) : clone(rows), error: null };
    };
    const q = {
      select(){ if(st.op !== 'select') st.ret = true; return q; },
      eq(c,v){ st.filters.push(r => r[c] === v); return q; },
      neq(c,v){ st.filters.push(r => r[c] !== v); return q; },
      in(c,arr){ st.filters.push(r => (arr||[]).includes(r[c])); return q; },
      gte(c,v){ st.filters.push(r => r[c] >= v); return q; },
      lte(c,v){ st.filters.push(r => r[c] <= v); return q; },
      order(col, o){ st.order = { col, asc: !(o && o.ascending === false) }; return q; },
      limit(n){ st.limit = n; return q; },
      single(){ st.single = true; return q; },
      maybeSingle(){ st.single = true; return q; },
      insert(p){ st.op = 'insert'; st.payload = p; return q; },
      upsert(p){ st.op = 'upsert'; st.payload = p; return q; },
      update(p){ st.op = 'update'; st.payload = p; return q; },
      delete(){ st.op = 'delete'; return q; },
      then(res, rej){ return Promise.resolve(run()).then(res, rej); },
      catch(f){ return Promise.resolve(run()).catch(f); }
    };

/* ---------- error reports: unexpected JS errors go to the server (max 5 per session, no personal data) ---------- */
const APP_VERSION = '2026.10.08';
(() => {
  if(DEMO) return;
  const seen = new Set(); let sent = 0;
  const report = (message, source, stack) => {
    try {
      message = String(message || '').slice(0, 500);
      if(!message || sent >= 5 || seen.has(message)) return;
      if(/ResizeObserver loop|Script error\.?$|Load failed|Failed to fetch|NetworkError|AbortError/i.test(message)) return;
      seen.add(message); sent++;
      const platform = (window.Capacitor && window.Capacitor.getPlatform) ? window.Capacitor.getPlatform() : 'web';
      sb.rpc('log_client_error', { p: { message, source: String(source||'').slice(0,300), stack: String(stack||'').slice(0,2000),
        platform, version: APP_VERSION, path: location.pathname, ua: navigator.userAgent } }).then(()=>{}, ()=>{});
    } catch(_){}
  };
  window.addEventListener('error', e => report(e.message, (e.filename||'') + ':' + (e.lineno||'') + ':' + (e.colno||''), e.error && e.error.stack));
  window.addEventListener('unhandledrejection', e => { const r = e.reason || {}; report(r.message || r, 'promise', r.stack); });
})();

// (kidora.answer.sa) show Kidora until sign-in, then the account's kindergarten.
// A kindergarten subdomain (old style, e.g. mubdioon.answer.sa) still picks its tenant. ----
const HOST0 = (location.hostname.split('.')[0] || '').toLowerCase();
const GENERIC = IS_NATIVE || ['kidora','www','localhost','127','app',''].includes(HOST0) || /github\.io$/.test(location.hostname);
const SLUG = GENERIC ? '' : HOST0;
const BRAND_FALLBACK = GENERIC ? APP_BRAND
  : { name:'المبدعون الصغار', tagline:'تطبيق التواصل بين الروضة وأولياء الأمور', logo_url:'logo.png', theme:{} };
function brandLogo(){ return (S.brand && S.brand.logo_url) || 'logo.png'; }
function kidsWord(n){
  if(n === 1) return 'طفل واحد';
  if(n === 2) return 'طفلان';
  if(n >= 3 && n <= 10) return n + ' أطفال';
  return n + ' طفلًا';
}
function brandName(){ return (S.kg && S.kg.name) || (S.brand && S.brand.name) || BRAND_FALLBACK.name; }

async function loadBrand(){
  if(GENERIC){ S.brand = APP_BRAND; applyBrand(); return; }
  const r = await safe(sb.rpc('tenant_public', { p_slug: SLUG }));
  const row = r && r.data && r.data[0];
  S.brand = row || BRAND_FALLBACK;
  applyBrand();
}
function applyBrand(){
  const t = (S.brand && S.brand.theme) || {};
  const root = document.documentElement;
  ['pink','blue','green','yellow'].forEach(k => { if(t[k]) root.style.setProperty('--' + k, t[k]); });
  if(t.ground) root.style.setProperty('--ground', t.ground);
  const n = brandName();
  document.title = n;
  const m = document.querySelector('meta[name="apple-mobile-web-app-title"]'); if(m) m.setAttribute('content', n);
  if(S.brand && S.brand.logo_url){
    document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]').forEach(l => l.href = S.brand.logo_url);
  }
}

// parents sign in with a phone number; it maps to an internal address Supabase understands
const LOGIN_DOMAIN = 'wali.mubdioon.sa';
function normalisePhone(v){
  let d = String(v||'').replace(/[^\d+]/g,'');
  if(d.startsWith('+')) d = d.slice(1);
  if(d.startsWith('00')) d = d.slice(2);
  if(d.startsWith('966')) return d;
  if(d.startsWith('0')) return '966' + d.slice(1);
  if(d.startsWith('5') && d.length === 9) return '966' + d;
  return d;
}
function toEmail(id){
  const t = String(id||'').trim();
  if(t.includes('@')) return t;
  return normalisePhone(t) + '@' + LOGIN_DOMAIN;
}
function isPhone(id){ return !String(id||'').includes('@'); }
function copyText(t, btn){
  navigator.clipboard.writeText(t).then(()=>{ if(btn){ const o=btn.textContent; btn.textContent='تم النسخ'; setTimeout(()=>btn.textContent=o,1600);} }).catch(()=>toast('انسخ الرمز يدويًا: '+t));
}

function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 3200);
}

  const emIn = v.querySelector('#em'), emSwap = v.querySelector('#emswap'), emLbl = v.querySelector('#emlbl');

    const toEmail = emIn.getAttribute('inputmode') === 'tel';

    emIn.placeholder = toEmail ? 'name@example.com' : '05XXXXXXXX';
    emLbl.textContent = toEmail ? 'البريد الإلكتروني' : 'رقم الجوال';
    emSwap.textContent = toEmail ? 'الدخول برقم الجوال' : 'الدخول بالبريد الإلكتروني بدلًا من الجوال';
    emIn.value = ''; emIn.blur(); emIn.focus();
  };
  const msg = v.querySelector('#msg');

  // live match feedback on sign-up, so a typo shows before submitting
  const pw1 = v.querySelector('#pw'), pw2 = v.querySelector('#pw2'), pwhint = v.querySelector('#pwhint');
  if(pw2 && pwhint){
    const checkMatch = () => {
      if(!pw2.value){ pwhint.textContent = ''; pw2.setCustomValidity(''); return; }
      const same = pw1.value === pw2.value;
      pwhint.textContent = same ? '✓ متطابقتان' : 'كلمتا المرور غير متطابقتين';
      pwhint.style.color = same ? 'var(--green-ink)' : 'var(--pink-ink)';
      pw2.setCustomValidity(same ? '' : 'كلمتا المرور غير متطابقتين');
    };
    pw1.addEventListener('input', checkMatch);
    pw2.addEventListener('input', checkMatch);

  v.querySelector('#f').onsubmit = async (e) => {

    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true; msg.innerHTML = '';
    const raw = v.querySelector('#em').value.trim();
    const email = toEmail(raw);
    const phone = isPhone(raw) ? normalisePhone(raw) : null;

        if(password.length < 8){ throw new Error('كلمة المرور يجب أن تكون ٨ أحرف على الأقل.'); }
        if(password !== v.querySelector('#pw2').value){ throw new Error('كلمتا المرور غير متطابقتين.'); }
        const { data, error } = await sb.auth.signUp({ email, password, options:{ data:{ full_name, phone } } });
        if(error) throw error;
        if(!data.session){ msg.innerHTML = '<div class="ok">تم إنشاء الحساب. سجّل الدخول الآن.</div>'; btn.disabled=false; return; }
        const { error: e2 } = await sb.rpc('redeem_invite', { p_code: code });
        if(e2){
          await sb.auth.signOut();
          throw new Error(e2.message.includes('ALREADY_USED') ? 'هذا الرمز مستخدم من قبل.' : 'رمز الانضمام غير صحيح.');
        }
        clearPendingCode();
        const photoOk = !!(v.querySelector('#cp') && v.querySelector('#cp').checked);
        await safe(sb.rpc('set_consent', { p_photo: photoOk, p_version: POLICY_VERSION }));
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if(error) throw new Error('رقم الجوال أو كلمة المرور غير صحيحة.');
      }
      await boot();
    }catch(err){
      msg.innerHTML = '<div class="err">'+esc(err.message||'حدث خطأ')+'</div>';
      btn.disabled = false;
    }
  };
}

async function loadCore(){
  const { data: prof } = await sb.from('profiles').select('*').eq('id', S.session.user.id).single();
  S.profile = prof;
  if(!prof || !prof.kindergarten_id) return false;
  const isStaff0 = prof.role === 'admin' || prof.role === 'teacher';
  // everything at once: one wait instead of seven in a row
  const [kg, classes, ow, g, np] = await Promise.all([
    sb.from('kindergartens').select('*').eq('id', prof.kindergarten_id).single(),
    sb.from('classes').select('*').eq('kindergarten_id', prof.kindergarten_id).order('name'),
    safe(sb.rpc('is_owner')),
    safe(sb.rpc('my_consent')),
    isStaff0 ? safe(sb.rpc('no_photo_children')) : Promise.resolve(null),
    refresh()
  ]);
  S.kg = kg.data; S.classes = classes.data || [];
  if(GENERIC && S.kg){
    S.brand = { name:S.kg.name, tagline:S.kg.tagline || APP_BRAND.tagline,
                logo_url:S.kg.logo_url || APP_BRAND.logo_url, theme:S.kg.theme || {} };
    applyBrand();
  }
  S.notif = (prof && prof.notif) ? Object.assign({}, NOTIF_DEFAULT, prof.notif) : Object.assign({}, NOTIF_DEFAULT);
  S.hasV2 = !!(prof && prof.notif);
  S.isOwner = !!(ow && ow.data === true);
  const gr = (g && g.data) || [];
  S.consentGiven = gr.some(x => x.consent_at);
  S.photoConsent = gr.length ? gr.every(x => x.photo_consent !== false) : true;
  if(isStaff0) S.noPhoto = new Set(((np && np.data) || []).map(r => r.child_id));
  if(!S.activeClass && S.classes.length) S.activeClass = S.classes[0].id;
  return true;
}

    await loadBusRoster();
    S.children = []; S.attendance = {}; S.posts = []; S.absences = {}; S.pickups = {};
    S.linked = new Set();

  const role0 = S.profile && S.profile.role;
  const [ch, at, po, ab, du, pk, mb, lkr] = await Promise.all([
    sb.from('children').select('id,full_name,gender,class_id,active,rides_bus,bus_route').eq('active', true).order('full_name'),
    sb.from('attendance').select('*').eq('day', today()),
    sb.from('posts').select('*').order('created_at',{ascending:false}).limit(30),
    sb.from('absences').select('*').gte('day', today()).lte('day', dayOffset(7)),
    role0 === 'parent' ? safe(sb.rpc('my_child_updates', { p_limit: 30 }))
      : (role0 === 'admin' || role0 === 'teacher') ? safe(sb.rpc('day_updates', { p_day: null }))
      : Promise.resolve(null),
    safe(sb.from('pickups').select('*').gte('day', today()).lte('day', dayOffset(7))),
    role0 === 'parent' ? safe(sb.rpc('my_bus_today')) : Promise.resolve(null),
    role0 !== 'parent' ? safe(sb.rpc('children_with_push')) : Promise.resolve(null)
  ]);
  S.children = ch.data || [];
  S.attendance = {};
  (at.data||[]).forEach(r => S.attendance[r.child_id] = r);
  S.posts = po.data || [];
  S.absences = {};
  (ab.data||[]).forEach(r => S.absences[r.child_id + '|' + r.day] = r);
  // daily reports: parents see their own children's, staff see today's
  S.updates = (du && du.data) ? du.data : [];
  S.pickups = {};
  if(pk) (pk.data||[]).forEach(r => S.pickups[r.child_id + '|' + r.day] = r);
  if(S.profile.role === 'parent'){
    S.myChildren = S.children;
    S.myBus = {};
    if(mb) (mb.data||[]).forEach(r => S.myBus[r.child_id + '|' + r.trip] = r);
  }
  // previewing another role: borrow the data that role would see
  if(S.preview === 'parent'){
    S.myChildren = S.children.slice(0, 1);
    S.myBus = {};
    const ids = S.myChildren.map(c => c.id);
    if(ids.length){
      const bl = await safe(sb.from('bus_logs').select('*').eq('day', today()).in('child_id', ids));
      if(bl) (bl.data||[]).forEach(r => S.myBus[r.child_id + '|' + r.trip] = r);
    }
  }
  if(S.preview === 'bus') await loadBusRoster();
  if(S.profile.role !== 'parent'){
    const lk = (lkr && lkr.data) || [];
    S.linked = new Set(lk.map(r => (typeof r === 'string' ? r : r.children_with_push)));
  }
  if(!S.activeClass && S.classes.length) S.activeClass = S.classes[0].id;
}

function subscribe(){
  if(S.channel) sb.removeChannel(S.channel);
  S.channel = sb.channel('live')
    .on('postgres_changes',{event:'*',schema:'public',table:'attendance'}, p => {
      const r = p.new && p.new.id ? p.new : null;
      if(r && r.day === today()){ S.attendance[r.child_id] = r; softRender(); }
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'posts'}, p => {
      if(!S.posts.find(x=>x.id===p.new.id)){ S.posts.unshift(p.new); softRender(); }
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'absences'}, async () => {
      await refresh(); softRender();
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'bus_logs'}, async () => {
      if(S.profile.role === 'bus') { await loadBusRoster(); softRender(); }
      else if(S.profile.role === 'parent'){ await refresh(); softRender(); }
    })
    .subscribe();
}

// ---- offline queue: a tap at the door must never be lost to bad wifi ----
const QKEY = DEMO ? 'pendingTaps_demo' : 'pendingTaps_v1';
function queueGet(){ try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch(_){ return []; } }
function queueSet(v){ try { localStorage.setItem(QKEY, JSON.stringify(v)); } catch(_){} }
function stateOfRow(r){
  if(!r || !r.check_in_at) return 'out';
  return r.check_out_at ? 'left' : 'in';
}
function nextState(cur){ return cur === 'out' ? 'in' : cur === 'in' ? 'left' : 'out'; }

function queueTap(childId, want){
  const q = queueGet().filter(x => x.child_id !== childId);
  q.push({ child_id: childId, want, ts: Date.now() });
  queueSet(q);
  S.pending.add(childId);
}

async function flushQueue(){
  const q = queueGet();
  if(!q.length || !navigator.onLine) return;
  const at = await safe(sb.from('attendance').select('*').eq('day', today()));
  if(!at) return;                                  // still offline; try again later
  const cur = {};
  (at.data || []).forEach(r => cur[r.child_id] = r);

  const rest = [];
  let done = 0;
  for(const it of q){
    // the tap may have reached the server before the connection dropped
    if(stateOfRow(cur[it.child_id]) === it.want){ done++; continue; }
    let row = cur[it.child_id], guard = 0, ok = false;
    while(guard++ < 3){
      const { data, error } = await sb.rpc('toggle_attendance', { p_child: it.child_id });
      if(error) break;
      row = data;
      if(stateOfRow(row) === it.want){ ok = true; break; }
    }
    if(ok){
      cur[it.child_id] = row; S.attendance[it.child_id] = row; done++;
      if(it.want !== 'out') notifyServer({ type:'attendance', child_id: it.child_id });
    } else {
      rest.push(it);
    }
  }
  queueSet(rest);
  S.pending = new Set(rest.map(x => x.child_id));
  if(done){ toast('تم إرسال ' + done + ' تسجيل كان محفوظًا على الجهاز'); await refresh(); render(); }
}
window.addEventListener('online', () => flushQueue());

function absenceOf(childId, day){ return S.absences[childId + '|' + (day||today())] || null; }
function pickupOf(childId, day){ return S.pickups[childId + '|' + (day||today())] || null; }

// ---- parent reports (absence / pickup) shown to staff inside the app, no push ----
const SEEN_KEY = DEMO ? 'kidora_seen_reports_demo' : 'kidora_seen_reports';
function seenReports(){ try { return new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || '[]')); } catch(_){ return new Set(); } }
function markReportsSeen(ids){
  const s = seenReports(); ids.forEach(i => s.add(i));
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(Array.from(s).slice(-400))); } catch(_){}
}
function parentReports(classId){
  const kids = new Map(S.children.filter(c => !classId || c.class_id === classId).map(c => [c.id, c]));
  const out = [];
  Object.values(S.absences || {}).forEach(a => { const c = kids.get(a.child_id); if(c && a.day >= today())
    out.push({ id:'a:' + a.id, kind:'absence', child:c, day:a.day, at:a.created_at,
               text: 'غياب ' + (a.day === today() ? 'اليوم' : fmtDay(new Date(a.day + 'T12:00:00'))) + ' · ' + (REASONS[a.reason] || a.reason || '') + (a.note ? ' · ' + a.note : '') }); });
  Object.values(S.pickups || {}).forEach(p => { const c = kids.get(p.child_id); if(c && p.day >= today())
    out.push({ id:'p:' + p.id, kind:'pickup', child:c, day:p.day, at:p.created_at,
               text: 'يستلمه ' + (p.day === today() ? 'اليوم' : fmtDay(new Date(p.day + 'T12:00:00'))) + ': ' + p.person_name + (p.relation ? ' (' + p.relation + ')' : '') }); });
  return out.sort((x, y) => String(y.at || '').localeCompare(String(x.at || '')));
}
function unseenReportCount(){
  const role = actingRole();
  if(role !== 'admin' && role !== 'teacher') return 0;
  const seen = seenReports();
  return parentReports().filter(r => !seen.has(r.id)).length;
}
function reportsCard(classId){
  const list = parentReports(classId);
  if(!list.length) return null;
  const seen = seenReports();
  const fresh = list.filter(r => !seen.has(r.id));
  const card = el(`<div class="card reports"><div class="rhead"><h3>بلاغات أولياء الأمور</h3>
    ${fresh.length ? `<span class="newcount">${fresh.length} جديد</span>` : ''}</div></div>`);
  list.slice(0, 8).forEach(r => card.appendChild(el(`<div class="rrow ${seen.has(r.id) ? '' : 'new'}">
    <span class="ricon">${r.kind === 'absence' ? '🤒' : '🚸'}</span>
    <span class="rtxt"><b>${esc(r.child.full_name)}</b><span>${esc(r.text)}</span></span>
    ${seen.has(r.id) ? '' : '<span class="rnew">جديد</span>'}</div>`)));
  if(fresh.length){
    const b = el('<button class="btn soft sm">تم الاطلاع</button>');
    b.onclick = () => { markReportsSeen(fresh.map(r => r.id)); render(); };
    card.appendChild(b);
  }
  return card;
}

/* ================= bus ================= */
const BUS_TRIPS = { am:'رحلة الصباح', pm:'رحلة العودة' };
const ROLE_AR = { admin:'مديرة', teacher:'معلمة', bus:'مرافقة الحافلة', parent:'ولي أمر' };
// the platform owner can look at the app through another role's eyes.
// this only changes what is DRAWN — the database still answers as him.
function actingRole(){ return S.preview || S.profile.role; }
// in preview nothing may be written — the owner is not really this person
function previewBlock(){
  if(!S.preview) return false;
  toast('معاينة فقط — لا يمكن التسجيل من هنا');
  return true;
}
async function setPreview(role){
  S.preview = role;
  S.tab = null; S.busRoute = null; S.adminTab = 'overview';
  await refresh();
  render();
}
function busState(r){
  if(!r || !r.boarded_at) return 'none';
  return r.arrived_at ? 'arrived' : 'boarded';
}
function busLabel(trip, st, t){
  if(st==='none') return trip==='am' ? 'لم يركب بعد' : 'لم يركب بعد';
  if(trip==='am') return st==='boarded' ? 'في الحافلة · ' + fmtTime(t) : 'وصل الروضة · ' + fmtTime(t);
  return st==='boarded' ? 'في الحافلة · ' + fmtTime(t) : 'وصل المنزل · ' + fmtTime(t);
}
async function loadBusRoster(){
  const r = await safe(sb.rpc('bus_roster', { p_trip: S.busTrip }));
  S.busRoster = (r && r.data) || [];
  const routes = [...new Set(S.busRoster.map(x=>x.bus_route).filter(Boolean))];
  if(S.busRoute && !routes.includes(S.busRoute)) S.busRoute = null;
}

function statusOf(childId){
  const a = S.attendance[childId];
  if(!a || !a.check_in_at) return {k:'out', t:null};
  if(a.check_out_at) return {k:'left', t:a.check_out_at};
  return {k:'in', t:a.check_in_at};
}

/* ================= staff: roster ================= */
function viewRoster(){
  const kids = S.children.filter(c => c.class_id === S.activeClass);
  const inN = kids.filter(k => statusOf(k.id).k==='in').length;
  const leftN = kids.filter(k => statusOf(k.id).k==='left').length;
  const absN = kids.filter(k => statusOf(k.id).k==='out' && absenceOf(k.id)).length;

  const wrap = el('<div style="display:flex;flex-direction:column;gap:16px"></div>');

  if(S.classes.length > 1){
    const chips = el('<div class="chips"></div>');
    S.classes.forEach(c => {
      const b = el(`<button class="chip" aria-pressed="${c.id===S.activeClass}">${esc(c.name)}</button>`);
      b.onclick = () => { S.activeClass = c.id; render(); };
      chips.appendChild(b);
    });
    wrap.appendChild(chips);
  }

  wrap.appendChild(el(`<div class="counter">
    <div class="pill ok"><b class="num">${inN}</b><span>في الروضة</span></div>
    <div class="pill left"><b class="num">${leftN}</b><span>غادر</span></div>
    <div class="pill no"><b class="num">${kids.length-inN-leftN-absN}</b><span>لم يصل</span></div>
    <div class="pill blue"><b class="num">${absN}</b><span>غياب مُبلّغ</span></div>
  </div>`));

  const rc = reportsCard(S.activeClass);
  if(rc) wrap.appendChild(rc);

  const drBtn = el('<button class="btn blue" style="width:100%">تقرير اليوم</button>');
  drBtn.onclick = dailyReportSheet;
  wrap.appendChild(drBtn);

  const roster = el('<div class="roster"></div>');
  if(!kids.length) roster.appendChild(el('<div class="empty">لا يوجد أطفال في هذا الفصل.</div>'));
  kids.forEach(k => {
    const st = statusOf(k.id);
    const ab = st.k==='out' ? absenceOf(k.id) : null;
    const label = st.k==='in' ? 'وصل ' + fmtTime(st.t)
                : st.k==='left' ? 'غادر ' + fmtTime(st.t)
                : ab ? 'غياب مُبلّغ · ' + (REASONS[ab.reason] || ab.reason) + (ab.note ? ' · ' + ab.note : '')
                : 'لم يصل بعد';
    const pk = pickupOf(k.id);
    const label2 = (S.pending.has(k.id) ? '⏳ بانتظار الإرسال · ' : '')
                 + (pk ? label + ' · يستلمه: ' + pk.person_name : label);
    const b = el(`<button class="kid ${st.k==='out' ? (ab?'absent':'') : st.k}">
      <span class="face">${esc(initial(k.full_name))}</span>
      <span class="nm"><b>${esc(k.full_name)}${S.linked.has(k.id)?' <span class="bell" title="ولي الأمر مشترك في الإشعارات">🔔</span>':''}${S.noPhoto.has(k.id)?' <span class="bell" title="ولي الأمر لا يوافق على نشر صور طفله">🚫📷</span>':''}</b><span>${label2}</span></span>
      <span class="check">${ICONS.check}</span>
    </button>`);
    b.onclick = async () => {
      if(previewBlock()) return;
      b.classList.add('busy');
      const want = nextState(statusOf(k.id).k);
      let failedOffline = false;
      try{
        if(!navigator.onLine) throw new Error('offline');
        const { data, error } = await sb.rpc('toggle_attendance', { p_child: k.id });
        if(error) throw error;
        S.attendance[k.id] = data;
        S.pending.delete(k.id);
        const q = queueGet().filter(x => x.child_id !== k.id); queueSet(q);
      }catch(err){
        const msg = String((err && err.message) || err);
        if(!navigator.onLine || /offline|fetch|network|Failed to fetch|timeout/i.test(msg)){
          failedOffline = true;
          queueTap(k.id, want);
          // show the teacher what she just did, even with no signal
          const now = new Date().toISOString();
          const row = S.attendance[k.id] || { child_id:k.id, day:today(), check_in_at:null, check_out_at:null };
          if(want === 'in'){ row.check_in_at = now; row.check_out_at = null; }
          else if(want === 'left'){ row.check_out_at = now; }
          else { row.check_in_at = null; row.check_out_at = null; }
          S.attendance[k.id] = row;
        } else {
          b.classList.remove('busy');
          toast('تعذّر التسجيل: ' + msg);
          return;
        }
      }
      b.classList.remove('busy');
      const s2 = statusOf(k.id);
      if(failedOffline){
        toast('لا يوجد اتصال — حُفظ على الجهاز وسيُرسل تلقائيًا');
      } else {
        if(s2.k !== 'out') notifyServer({ type:'attendance', child_id: k.id });
        const notified = S.linked.has(k.id) ? ' — أُشعر ولي الأمر' : '';
        toast(s2.k==='in' ? 'تم تسجيل وصول ' + first(k.full_name) + notified
            : s2.k==='left' ? 'تم تسجيل مغادرة ' + first(k.full_name) + notified
            : 'تم إلغاء التسجيل');
      }
      render();
    };
    roster.appendChild(b);
  });
  wrap.appendChild(roster);

  const acts = el('<div style="display:flex;flex-direction:column;gap:9px"></div>');
  const a1 = el(`<button class="btn blue">${ICONS.photo} نشر نشاط وصور</button>`);
  a1.onclick = () => { if(!previewBlock()) composer('activity'); };
  const a2 = el(`<button class="btn soft">${ICONS.megaphone} إرسال إعلان</button>`);
  a2.onclick = () => { if(!previewBlock()) composer('announcement'); };
  acts.append(a1,a2);
  wrap.appendChild(acts);
  return wrap;
}


/* ================= bus escort: the whole app for her ================= */
function viewBus(){
  const wrap = el('<div style="display:flex;flex-direction:column;gap:16px"></div>');

  // which trip
  const seg = el(`<div class="segmented">
    <button aria-selected="${S.busTrip==='am'}">رحلة الصباح</button>
    <button aria-selected="${S.busTrip==='pm'}">رحلة العودة</button>
  </div>`);
  seg.children[0].onclick = async ()=>{ if(S.busTrip==='am') return; S.busTrip='am'; await loadBusRoster(); render(); };
  seg.children[1].onclick = async ()=>{ if(S.busTrip==='pm') return; S.busTrip='pm'; await loadBusRoster(); render(); };
  wrap.appendChild(seg);

  // which bus, when the kindergarten runs more than one
  const routes = [...new Set(S.busRoster.map(x=>x.bus_route).filter(Boolean))];
  if(routes.length > 1){
    const chips = el('<div class="chips"></div>');
    const all = el(`<button class="chip" aria-pressed="${!S.busRoute}">الكل</button>`);
    all.onclick = ()=>{ S.busRoute=null; render(); };
    chips.appendChild(all);
    routes.forEach(rt => {
      const b = el(`<button class="chip" aria-pressed="${rt===S.busRoute}">${esc(rt)}</button>`);
      b.onclick = ()=>{ S.busRoute=rt; render(); };
      chips.appendChild(b);
    });
    wrap.appendChild(chips);
  }

  const kids = S.busRoster.filter(k => !S.busRoute || k.bus_route === S.busRoute);
  const onBus = kids.filter(k => busState(k)==='boarded').length;
  const done  = kids.filter(k => busState(k)==='arrived').length;
  const absN  = kids.filter(k => k.absent && busState(k)==='none').length;
  const waiting = kids.length - onBus - done - absN;

  wrap.appendChild(el(`<div class="counter">
    <div class="pill blue"><b class="num">${onBus}</b><span>في الحافلة</span></div>
    <div class="pill ok"><b class="num">${done}</b><span>${S.busTrip==='am'?'وصل الروضة':'وصل المنزل'}</span></div>
    <div class="pill no"><b class="num">${waiting}</b><span>لم يركب</span></div>
    <div class="pill left"><b class="num">${absN}</b><span>غياب مُبلّغ</span></div>
  </div>`));

  // the one thing that matters: nobody left on the bus
  if(kids.length && onBus === 0 && done > 0 && waiting === 0){
    wrap.appendChild(el(`<div class="ok">✅ الحافلة فارغة — كل الأطفال ${S.busTrip==='am'?'وصلوا الروضة':'وصلوا منازلهم'}.</div>`));
  } else if(onBus > 0){
    wrap.appendChild(el(`<div class="absent-note"><span class="t">لا يزال <b>${onBus}</b> ${onBus===1?'طفل':'أطفال'} في الحافلة.</span></div>`));
  }

  const roster = el('<div class="roster"></div>');
  if(!kids.length){
    roster.appendChild(el('<div class="empty">لا يوجد أطفال مسجّلين في الحافلة. تراجع الإدارة قائمة الأطفال.</div>'));
  }
  kids.forEach(k => {
    const st = busState(k);
    const t  = st==='arrived' ? k.arrived_at : k.boarded_at;
    const cls = st==='boarded' ? 'riding' : st==='arrived' ? 'present' : (k.absent ? 'absent' : '');
    const label = k.absent && st==='none' ? 'غياب مُبلّغ اليوم' : busLabel(S.busTrip, st, t);
    const b = el(`<button class="kid ${cls}">
      <span class="face">${esc(initial(k.full_name))}</span>
      <span class="nm"><b>${esc(k.full_name)}</b><span>${esc(label)}${k.bus_route && routes.length>1 ? ' · '+esc(k.bus_route) : ''}</span></span>
      <span class="check">${st==='arrived' ? ICONS.check : ICONS.car}</span>
    </button>`);
    b.onclick = async () => {
      if(previewBlock()) return;
      b.classList.add('busy');
      const r = await safe(sb.rpc('bus_mark', { p_child: k.child_id, p_trip: S.busTrip }));
      b.classList.remove('busy');
      if(!r || !r.data){ toast('تعذّر التسجيل — تأكدي من الاتصال'); return; }
      const row = r.data;
      k.boarded_at = row.boarded_at; k.arrived_at = row.arrived_at;
      const s2 = busState(k);
      if(s2 !== 'none') notifyServer({ type:'bus', child_id: k.child_id, trip: S.busTrip });
      toast(s2==='boarded' ? 'ركب ' + first(k.full_name) + ' الحافلة — أُشعر ولي الأمر'
          : s2==='arrived' ? (S.busTrip==='am' ? 'وصل ' : 'وصل ') + first(k.full_name) + (S.busTrip==='am'?' الروضة':' المنزل') + ' — أُشعر ولي الأمر'
          : 'تم إلغاء التسجيل');
      render();
    };
    roster.appendChild(b);
  });
  wrap.appendChild(roster);
  return wrap;
}

      const files = isAct ? Array.from(sheetPanel.querySelector('#ph').files||[]) : [];
      for(const f of files.slice(0,9)){
        const path = `${S.kg.id}/${crypto.randomUUID()}-${f.name.replace(/[^\w.\-]/g,'_')}`;
        const { error } = await sb.storage.from('photos').upload(path, f, { upsert:false });
        if(error) throw error;
        paths.push(path);
      }
      const { data, error } = await sb.from('posts').insert({
        kindergarten_id: S.kg.id, class_id, author_id: S.profile.id,
        kind, body, photo_paths: paths
      }).select().single();
      if(error) throw error;
      if(!S.posts.find(p=>p.id===data.id)) S.posts.unshift(data);
      notifyServer({ type:'post', post_id: data.id });
      closeSheet(); toast(isAct?'تم نشر النشاط':'تم إرسال الإعلان'); render();
    }catch(err){
      sheetPanel.querySelector('#cmsg').innerHTML = '<div class="err">تعذّر النشر: '+esc(err.message)+'</div>';
      btn.disabled=false; btn.textContent='نشر';
    }
  };
}

/* ================= daily report ================= */
// التقرير اليومي — ماذا أكل الطفل، هل نام، كيف كان مزاجه، وملاحظة المعلمة.
// المعلمة ترى فصولها فقط (الخادم هو من يفرض ذلك، لا الواجهة).

const DR_FIELDS = [
  { key:'meal',     label:'الأكل',   opts:[['all','أكل كل وجبته'],['some','أكل بعضها'],['none','لم يأكل']] },
  { key:'nap',      label:'النوم',   opts:[['slept','نام'],['rested','استراح فقط'],['no','لم ينم']] },
  { key:'mood',     label:'المزاج',  opts:[['happy','سعيد'],['ok','عادي'],['upset','متضايق']] },
  { key:'bathroom', label:'الحمّام', opts:[['ok','طبيعي'],['accident','حصل حادث']] }
];
const DR_TEXT = {};
DR_FIELDS.forEach(f => f.opts.forEach(([v,l]) => { DR_TEXT[f.key+':'+v] = l; }));

async function loadUpdatable(){
  const r = await safe(sb.rpc('updatable_children'));
  S.upKids = (r && r.data) ? r.data : [];
  return S.upKids;
}

function drBlank(){ return { meal:null, nap:null, mood:null, bathroom:null, note:'', files:[] }; }

async function dailyReportSheet(){
  if(previewBlock()) return;
  openSheet('<h3>تقرير اليوم</h3><p class="help">جارٍ تحميل الأطفال…</p>');
  await loadUpdatable();

  if(!S.upKids.length){
    openSheet(`<h3>تقرير اليوم</h3>
      <div class="err">لا توجد فصول مسندة إليك بعد. تطلب المديرة إسنادك إلى فصل من شاشة «الفصول».</div>
      <button class="btn soft sm" id="drx">إغلاق</button>`);
    sheetPanel.querySelector('#drx').onclick = closeSheet;
    return;
  }

  const st = {
    step: 1,
    cls: 'all',
    sel: new Set(),
    mode: 'bulk',
    idx: 0,                 // which child, in one-by-one mode
    bulk: drBlank(),
    per: {}                 // child_id -> form data
  };
  drRender(st);
}

function drClasses(){
  const seen = new Map();
  S.upKids.forEach(k => { if(k.class_id && !seen.has(k.class_id)) seen.set(k.class_id, k.class_name || '—'); });
  return Array.from(seen, ([id,name]) => ({ id, name }));
}

function drRender(st){
  if(st.step === 1) return drStepPick(st);
  if(st.step === 2) return drStepMode(st);
  return drStepForm(st);
}

/* ---- step 1: who is this report for ---- */
function drStepPick(st){
  const classes = drClasses();
  openSheet(`<h3>تقرير اليوم</h3>
    <p class="help">اختر الأطفال، ثم اكتب ما جرى في يومهم. يصل التقرير لأولياء أمورهم فقط.</p>
    <div id="drchips"></div>
    <div class="actions2" style="margin-bottom:4px">
      <button class="btn soft sm" id="drall">تحديد الكل</button>
      <button class="btn soft sm" id="drnone">إلغاء التحديد</button>
    </div>
    <div id="drlist" class="rowlist" style="max-height:46vh;overflow:auto"></div>
    <div id="drmsg"></div>
    <button class="btn" id="drnext" disabled>التالي</button>
    <button class="btn soft sm" id="drx">إلغاء</button>`);

  const list  = sheetPanel.querySelector('#drlist');
  const next  = sheetPanel.querySelector('#drnext');
  const chips = sheetPanel.querySelector('#drchips');

  const visible = () => S.upKids.filter(k => st.cls === 'all' || k.class_id === st.cls);

  const paintNext = () => {
    next.disabled = st.sel.size === 0;
    next.textContent = st.sel.size ? `التالي · ${kidsWord(st.sel.size)}` : 'التالي';
  };

  if(classes.length > 1){
    const row = el('<div class="chips"></div>');
    [{id:'all',name:'كل فصولي'}].concat(classes).forEach(c => {
      const b = el(`<button class="chip" aria-pressed="${st.cls===c.id}">${esc(c.name)}</button>`);
      b.onclick = () => { st.cls = c.id; drStepPick(st); };
      row.appendChild(b);
    });
    chips.appendChild(row);
  }

  const paintList = () => {
    list.innerHTML = '';
    const kids = visible();
    if(!kids.length){ list.appendChild(el('<div class="empty">لا يوجد أطفال هنا.</div>')); return; }
    kids.forEach(k => {
      const on = st.sel.has(k.id);
      const b = el(`<button class="row" aria-pressed="${on}" style="${on?'background:var(--blue-soft)':''}">
        <span class="face">${esc(initial(k.full_name))}</span>
        <span class="nm"><b>${esc(k.full_name)}</b><span>${esc(k.class_name||'بدون فصل')}${k.has_today?' · أُرسل اليوم':''}</span></span>
        <span class="tagx ${on?'free':'full'}">${on?'✓':'—'}</span>
      </button>`);
      b.onclick = () => {
        if(st.sel.has(k.id)) st.sel.delete(k.id); else st.sel.add(k.id);
        paintList(); paintNext();
      };
      list.appendChild(b);
    });
  };

  sheetPanel.querySelector('#drall').onclick  = () => { visible().forEach(k=>st.sel.add(k.id)); paintList(); paintNext(); };
  sheetPanel.querySelector('#drnone').onclick = () => { visible().forEach(k=>st.sel.delete(k.id)); paintList(); paintNext(); };
  sheetPanel.querySelector('#drx').onclick    = closeSheet;
  next.onclick = () => {
    if(!st.sel.size) return;
    if(st.sel.size === 1){ st.mode = 'bulk'; st.step = 3; } else { st.step = 2; }
    drRender(st);
  };

  paintList(); paintNext();
}

/* ---- step 2: one message for everyone, or one per child ---- */
function drStepMode(st){
  openSheet(`<h3>طريقة الإرسال</h3>
    <p class="help">اخترتِ ${kidsWord(st.sel.size)}.</p>
    <button class="btn" id="drbulk">رسالة واحدة للجميع</button>
    <p class="help">نفس التقرير يصل لكل الأطفال المحددين — مناسب ليوم مشترك مثل رحلة أو نشاط.</p>
    <button class="btn soft" id="drper">لكل طفل على حدة</button>
    <p class="help">تملئين تقرير كل طفل بنفسه — أدق، ويأخذ وقتًا أطول.</p>
    <button class="btn soft sm" id="drback">رجوع</button>`);
  sheetPanel.querySelector('#drbulk').onclick = () => { st.mode='bulk'; st.step=3; drRender(st); };
  sheetPanel.querySelector('#drper').onclick  = () => { st.mode='per'; st.idx=0; st.step=3; drRender(st); };
  sheetPanel.querySelector('#drback').onclick = () => { st.step=1; drRender(st); };
}

/* ---- step 3: the report itself ---- */
function drStepForm(st){
  const ids  = Array.from(st.sel);
  const per  = st.mode === 'per';
  const kid  = per ? S.upKids.find(k => k.id === ids[st.idx]) : null;
  if(per && !st.per[kid.id]) st.per[kid.id] = drBlank();
  const data = per ? st.per[kid.id] : st.bulk;
  const last = !per || st.idx === ids.length - 1;

  openSheet(`<h3>${per ? esc(kid.full_name) : 'تقرير اليوم'}</h3>
    <p class="help">${per
      ? `طفل ${st.idx+1} من ${ids.length}${kid.has_today?' · له تقرير اليوم، وسيُحدَّث':''}`
      : `يصل إلى أولياء أمور ${kidsWord(ids.length)}.`}</p>
    <div id="drfields"></div>
    <div class="field"><label for="drnote">ملاحظة (اختياري)</label>
      <textarea id="drnote" rows="3" placeholder="مثال: شارك في نشاط الرسم واستمتع كثيرًا."></textarea></div>
    <div class="field"><label for="drph">صور (اختياري)</label>
      <input id="drph" type="file" accept="image/*" multiple>
      <p class="help" id="drphnote"></p>
      ${S.noPhoto && S.noPhoto.size ? `<p class="help" style="color:var(--pink-ink)">تنبيه: ${S.noPhoto.size} من الأطفال لا يوافق أولياء أمورهم على نشر صورهم.</p>` : ''}</div>
    <div id="drmsg2"></div>
    <button class="btn" id="drsend">${per && !last ? 'التالي' : 'إرسال'}</button>
    ${per && st.idx>0 ? '<button class="btn soft sm" id="drprev">السابق</button>' : ''}
    ${per ? `<button class="btn soft sm" id="drskip">${last?'تخطّي هذا الطفل وإرسال':'تخطّي هذا الطفل'}</button>` : ''}
    <button class="btn soft sm" id="drback2">رجوع</button>`);

  // option chips
  const box = sheetPanel.querySelector('#drfields');
  DR_FIELDS.forEach(f => {
    const wrap = el(`<div class="field"><label>${f.label}</label></div>`);
    const row = el('<div class="chips"></div>');
    f.opts.forEach(([v,l]) => {
      const b = el(`<button type="button" class="chip" aria-pressed="${data[f.key]===v}">${l}</button>`);
      b.onclick = () => {
        data[f.key] = (data[f.key] === v) ? null : v;   // tap again to clear
        row.querySelectorAll('.chip').forEach((c,i) => c.setAttribute('aria-pressed', String(f.opts[i][0] === data[f.key])));
      };
      row.appendChild(b);
    });
    wrap.appendChild(row);
    box.appendChild(wrap);
  });

  const noteEl = sheetPanel.querySelector('#drnote');
  const phEl   = sheetPanel.querySelector('#drph');
  const phNote = sheetPanel.querySelector('#drphnote');
  noteEl.value = data.note || '';

  // a file input can't be repopulated when we redraw this sheet, so the chosen
  // files live in `data` and we only replace them when new ones are picked.
  const paintPhotos = () => {
    const n = (data.files || []).length;
    phNote.innerHTML = n
      ? `${n} صورة مرفقة — <button type="button" class="linkbtn" id="drphclr">إزالة</button>`
      : '';
    const clr = phNote.querySelector('#drphclr');
    if(clr) clr.onclick = () => { data.files = []; phEl.value = ''; paintPhotos(); };
  };
  phEl.onchange = () => {
    const f = Array.from(phEl.files || []);
    if(f.length) data.files = f;
    paintPhotos();
  };
  paintPhotos();

  const capture = () => { data.note = noteEl.value; };

  const back = sheetPanel.querySelector('#drback2');
  back.onclick = () => { capture(); st.step = (ids.length > 1 ? 2 : 1); drRender(st); };

  const prev = sheetPanel.querySelector('#drprev');
  if(prev) prev.onclick = () => { capture(); st.idx--; drRender(st); };

  const skip = sheetPanel.querySelector('#drskip');
  if(skip) skip.onclick = () => {
    st.per[kid.id] = null;                 // nothing recorded for this child
    if(last) drSubmit(st); else { st.idx++; drRender(st); }
  };

  sheetPanel.querySelector('#drsend').onclick = () => {
    capture();
    if(per && !last){ st.idx++; drRender(st); return; }
    drSubmit(st);
  };
}

/* ---- upload photos and write the reports ---- */
async function drUpload(files){
  const paths = [];
  for(const f of (files || []).slice(0, 9)){
    if(f.size > 8 * 1024 * 1024) throw new Error('حجم الصورة كبير (الحد ٨ ميجابايت): ' + f.name);
    if(!/^image\//.test(f.type)) throw new Error('هذا الملف ليس صورة: ' + f.name);
    const path = `${S.kg.id}/${crypto.randomUUID()}-${f.name.replace(/[^\w.\-]/g,'_')}`;
    const { error } = await sb.storage.from('photos').upload(path, f, { upsert:false });
    if(error) throw error;
    paths.push(path);
  }
  return paths.length ? paths : null;
}

function drFilled(d){
  return !!(d && (d.meal || d.nap || d.mood || d.bathroom || (d.note||'').trim() || (d.files||[]).length));
}

async function drSubmit(st){
  const btn = sheetPanel.querySelector('#drsend');
  const msg = sheetPanel.querySelector('#drmsg2');
  const fail = (t) => {
    if(msg) msg.innerHTML = '<div class="err">' + esc(t) + '</div>';
    if(btn){ btn.disabled = false; btn.textContent = 'إرسال'; }
  };
  if(btn){ btn.disabled = true; btn.textContent = 'جارٍ الإرسال…'; }

  try{
    const ids = Array.from(st.sel);
    let sentIds = [];

    if(st.mode === 'bulk'){
      const d = st.bulk;
      if(!drFilled(d)) return fail('اكتب شيئًا واحدًا على الأقل قبل الإرسال.');
      const photos = await drUpload(d.files);
      const { data, error } = await sb.rpc('send_daily_update', {
        p_child_ids: ids,
        p_meal: d.meal, p_nap: d.nap, p_mood: d.mood, p_bathroom: d.bathroom,
        p_note: (d.note||'').trim() || null, p_photos: photos
      });
      if(error) throw error;
      if(!data) throw new Error('لم يُحفظ أي تقرير.');
      sentIds = ids;
    } else {
      const filled = ids.filter(id => drFilled(st.per[id]));
      if(!filled.length) return fail('لم تُكتب أي تقارير.');
      for(const id of filled){
        const d = st.per[id];
        const photos = await drUpload(d.files);
        const { error } = await sb.rpc('send_daily_update', {
          p_child_ids: [id],
          p_meal: d.meal, p_nap: d.nap, p_mood: d.mood, p_bathroom: d.bathroom,
          p_note: (d.note||'').trim() || null, p_photos: photos
        });
        if(error) throw error;
        sentIds.push(id);
      }
    }

    notifyServer({ type:'daily_update', child_ids: sentIds });
    closeSheet();
    toast('تم إرسال تقرير ' + kidsWord(sentIds.length));
    await loadUpdatable();
    render();
  }catch(err){
    const m = String((err && err.message) || err);
    fail(m.includes('NOT_ALLOWED') ? 'بعض الأطفال خارج فصولك. حدّث الصفحة وأعد المحاولة.'
       : m.includes('NO_CHILDREN') ? 'لم تختر أي طفل.'
       : 'تعذّر الإرسال: ' + m);
  }
}

/* ---- reading a report back ---- */
function drSummary(u){
  const bits = [];
  DR_FIELDS.forEach(f => { if(u[f.key]) bits.push(DR_TEXT[f.key+':'+u[f.key]]); });
  return bits.join(' · ');
}

/* ================= parent ================= */
function viewParent(){
  const wrap = el('<div style="display:flex;flex-direction:column;gap:16px"></div>');
  if(!S.myChildren.length){
    wrap.appendChild(el('<div class="empty">لم يتم ربط حسابك بطفل بعد. أدخل رمز طفلك من الروضة.</div>'));
    const add0 = el('<button class="btn">إدخال رمز الطفل</button>');
    add0.onclick = () => { if(!previewBlock()) linkSiblingSheet(); };
    wrap.appendChild(add0);
    return wrap;
  }
  S.myChildren.forEach(c => {
    const st = statusOf(c.id);
    const cls = S.classes.find(x=>x.id===c.class_id);
    const txt = st.k==='in' ? first(c.full_name) + ' في الروضة الآن'
              : st.k==='left' ? first(c.full_name) + ' غادر الروضة'
              : first(c.full_name) + ' لم يصل بعد';
    const sub = st.t ? (st.k==='in'?'الوصول ':'المغادرة ') + fmtTime(st.t) : fmtDay(new Date());
    wrap.appendChild(el(`<div class="hero ${st.k==='in'?'':st.k}">
      <span class="who-kid">${esc(c.full_name)}${cls?' · فصل '+esc(cls.name):''}</span>
      <div class="st"><span class="dot"></span><span>${esc(txt)}</span></div>
      <small>${esc(sub)}</small>
    </div>`));

    // today's report from the teacher
    const up = (S.updates || []).find(u => u.child_id === c.id && u.day === today());
    if(up){
      const sum = drSummary(up);
      const card = el(`<div class="card">
        <h3>تقرير اليوم · ${esc(first(c.full_name))}</h3>
        ${sum ? `<div class="chips" style="margin-top:2px">${
          DR_FIELDS.filter(f=>up[f.key]).map(f=>`<span class="chip" aria-pressed="true">${esc(DR_TEXT[f.key+':'+up[f.key]])}</span>`).join('')
        }</div>` : ''}
        ${up.note ? '<p style="margin-top:8px;font-size:14.5px;line-height:1.6">'+esc(up.note)+'</p>' : ''}
        <p class="help">${esc(fmtTime(up.updated_at))}</p>
      </div>`);
      const paths = up.photo_paths || [];
      if(paths.length){
        const n = Math.min(paths.length, 3);
        const grid = el(`<div class="shots n${n}"></div>`);
        card.appendChild(grid);
        signedUrls(paths).then(urls => {
          grid.innerHTML = '';
          urls.slice(0,n).forEach((u,i) => {
            const lastOne = (i===n-1 && paths.length>n);
            const b = el(`<button class="${lastOne?'more':''}" ${lastOne?`data-more="+${paths.length-n}"`:''} aria-label="عرض الصورة"><img loading="lazy" alt="صورة من تقرير اليوم" src="${u}"></button>`);
            b.onclick = () => openPhoto(u);
            grid.appendChild(b);
          });
        });
      }
      wrap.appendChild(card);
    }

    // reported absences for today and tomorrow
    [today(), dayOffset(1)].forEach(d => {
      const ab = absenceOf(c.id, d);
      if(!ab) return;
      const n = el(`<div class="absent-note">
        <span class="t">بلاغ غياب ${esc(dayLabel(d))} · ${esc(REASONS[ab.reason]||ab.reason)}${ab.note?' · '+esc(ab.note):''}</span>
        <button type="button">إلغاء</button>
      </div>`);
      n.querySelector('button').onclick = async () => {
        const { error } = await sb.rpc('cancel_absence', { p_child: c.id, p_day: d });
        if(error){ toast('تعذّر الإلغاء'); return; }
        delete S.absences[c.id + '|' + d];
        toast('تم إلغاء البلاغ'); render();
      };
      wrap.appendChild(n);
    });

    // the bus, when the child rides it
    ['am','pm'].forEach(tp => {
      const r = S.myBus[c.id + '|' + tp];
      const st = busState(r);
      if(st === 'none') return;
      const t = st==='arrived' ? r.arrived_at : r.boarded_at;
      const txt = tp==='am'
        ? (st==='boarded' ? first(c.full_name)+' في الحافلة متجهًا للروضة' : first(c.full_name)+' وصل الروضة بالحافلة')
        : (st==='boarded' ? first(c.full_name)+' في الحافلة عائدًا للمنزل' : first(c.full_name)+' وصل المنزل بأمان');
      wrap.appendChild(el(`<div class="pickup-note">
        <span class="t">${ICONS.car} ${esc(txt)} · ${esc(fmtTime(t))}</span>
      </div>`));
    });

    // who is collecting the child today
    const pk = pickupOf(c.id, today());
    if(pk){
      const n = el(`<div class="pickup-note">
        <span class="t">يستلم ${esc(first(c.full_name))} اليوم: <b>${esc(pk.person_name)}</b>${pk.relation?' · '+esc(pk.relation):''}${pk.phone?' · '+esc(pk.phone):''}</span>
        <button type="button">إلغاء</button>
      </div>`);
      n.querySelector('button').onclick = async () => {
        const r = await safe(sb.rpc('clear_pickup', { p_child: c.id, p_day: today() }));
        if(!r){ toast('تعذّر الإلغاء'); return; }
        delete S.pickups[c.id + '|' + today()];
        toast('تم الإلغاء'); render();
      };
      wrap.appendChild(n);
    }

    const acts = el('<div class="actions2"></div>');
    if(!absenceOf(c.id, today()) || !absenceOf(c.id, dayOffset(1))){
      const b = el(`<button class="btn soft sm">إبلاغ عن غياب</button>`);
      b.onclick = () => { if(!previewBlock()) absenceSheet(c); };
      acts.appendChild(b);
    }
    const pb = el(`<button class="btn soft sm">${pk?'تغيير المستلم':'من سيستلم الطفل؟'}</button>`);
    pb.onclick = () => { if(!previewBlock()) pickupSheet(c); };
    acts.appendChild(pb);
    wrap.appendChild(acts);
  });
  const addKid = el('<button class="btn soft sm" style="align-self:center">+ إضافة طفل آخر</button>');
  addKid.onclick = () => { if(!previewBlock()) linkSiblingSheet(); };
  wrap.appendChild(addKid);
  wrap.appendChild(buildFeed());
  return wrap;
}

// siblings: link another child to this parent account with that child's code
function linkSiblingSheet(){
  openSheet(`
    <h2>إضافة طفل آخر</h2>
    <p class="help" style="margin:0">أدخل رمز الطفل الذي أعطتك إياه الروضة (يبدأ بـ P-). تنطبق موافقاتك الحالية على الطفل الجديد، ويمكنك تغييرها من الإعدادات.</p>
    <div id="acmsg"></div>
    <form id="acf" style="display:flex;flex-direction:column;gap:13px">
      <div class="field"><label for="acc">رمز الطفل</label><input id="acc" required placeholder="P-XXXXXXXX" dir="ltr" autocomplete="off" style="text-transform:uppercase"></div>
      <button class="btn" type="submit">إضافة</button>
    </form>
    <button class="btn soft sm" id="acx">إلغاء</button>
  `);
  sheetPanel.querySelector('#acx').onclick = closeSheet;
  sheetPanel.querySelector('#acf').onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button'); btn.disabled = true; btn.textContent = 'جارٍ الإضافة…';
    const code = sheetPanel.querySelector('#acc').value.trim().toUpperCase();
    const { data, error } = await sb.rpc('add_child_code', { p_code: code });
    if(error){
      const m = String(error.message||'');
      const t = m.includes('CODE_ALREADY_USED') ? 'هذا الرمز استُخدم لعدد أولياء الأمور المسموح.'
              : m.includes('CODE_EXPIRED') ? 'انتهت صلاحية الرمز. اطلب رمزًا جديدًا من الروضة.'
              : m.includes('CODE_REVOKED') ? 'هذا الرمز أُلغي. اطلب رمزًا جديدًا من الروضة.'
              : 'الرمز غير صحيح. تأكد منه أو اطلبه من الروضة.';
      sheetPanel.querySelector('#acmsg').innerHTML = `<div class="err">${t}</div>`;
      btn.disabled = false; btn.textContent = 'إضافة'; return;
    }
    const kid = Array.isArray(data) ? data[0] : data;
    closeSheet();
    await refresh(); render();
    toast(kid && kid.full_name ? `تمت إضافة ${first(kid.full_name)}` : 'تمت الإضافة');
  };
}
