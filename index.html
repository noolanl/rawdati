<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="المبدعون الصغار">
<title>المبدعون الصغار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* ===== brand tokens — taken from the kindergarten logo ===== */
:root{
  --ground:#F2F8FC;
  --surface:#FFFFFF;
  --sunken:#EDF3F8;
  --ink:#22374A;
  --ink-2:#7791A6;
  --line:#E4EEF6;

  --pink:#E0206E;      --pink-soft:#FDE7F0;   --pink-ink:#A5124F;
  --blue:#24A7E1;      --blue-soft:#E3F5FD;   --blue-ink:#0E6E99;
  --green:#7FB227;     --green-soft:#EEF7DF;  --green-ink:#4F7212;
  --yellow:#EFB513;    --yellow-soft:#FEF4D9; --yellow-ink:#9A6E00;

  --shadow-sm:0 2px 8px rgba(34,55,74,.06);
  --shadow:0 10px 28px -14px rgba(34,55,74,.30);
  --r-lg:24px; --r-md:18px; --r-sm:14px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif;font-weight:700;margin:0;text-wrap:balance;line-height:1.35}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
img{max-width:100%}

/* ===== shell ===== */
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--ground)}
.topbar{
  position:sticky;top:0;z-index:30;background:var(--surface);
  padding:12px 16px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--line);
}
.logo{width:42px;height:42px;flex:none;border-radius:13px;background:#fff;object-fit:contain;padding:1px}
.topbar .who{flex:1;min-width:0}
.topbar .who b{display:block;font-family:"Baloo Bhaijaan 2",sans-serif;font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .who span{font-size:12px;color:var(--ink-2)}
.iconbtn{
  background:var(--sunken);border:none;border-radius:12px;width:38px;height:38px;flex:none;
  display:grid;place-items:center;cursor:pointer;color:var(--ink-2);
}
.iconbtn svg{width:17px;height:17px}
main{flex:1;padding:16px 16px 100px;display:flex;flex-direction:column;gap:16px}

/* ===== auth ===== */
.auth{max-width:410px;margin:0 auto;padding:34px 22px 48px;display:flex;flex-direction:column;gap:18px;min-height:100%;justify-content:center}
.auth-logo{display:block;width:104px;margin:0 auto 2px;padding:14px;background:#fff;border-radius:28px;box-shadow:var(--shadow-sm)}
.auth h1{font-size:27px;text-align:center}
.auth .sub{margin:0;text-align:center;font-size:13.5px;color:var(--ink-2)}
.segmented{display:flex;background:var(--sunken);border-radius:999px;padding:5px;gap:5px}
.segmented button{
  flex:1;border:none;background:transparent;border-radius:999px;padding:10px;cursor:pointer;
  font-weight:600;color:var(--ink-2);font-size:14px;transition:.2s;
}
.segmented button[aria-selected="true"]{background:var(--surface);color:var(--pink);box-shadow:var(--shadow-sm)}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;color:var(--ink-2);font-weight:600}
.field input,.field textarea,.field select{
  background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-sm);
  padding:13px 15px;width:100%;transition:border-color .18s;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);outline:none}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-2);opacity:.65}
.help{font-size:12px;color:var(--ink-2);margin:0}
.err{background:var(--pink-soft);color:var(--pink-ink);border-radius:var(--r-sm);padding:11px 14px;font-size:13.5px}
.ok{background:var(--green-soft);color:var(--green-ink);border-radius:var(--r-sm);padding:11px 14px;font-size:13.5px}

/* ===== buttons ===== */
.btn{
  border:none;border-radius:999px;padding:14px 20px;cursor:pointer;width:100%;
  font-family:"Baloo Bhaijaan 2",sans-serif;font-size:16px;font-weight:600;
  background:var(--pink);color:#fff;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 6px 16px -8px rgba(224,32,110,.7);transition:transform .12s;
}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.55;cursor:progress;box-shadow:none}
.btn.blue{background:var(--blue);box-shadow:0 6px 16px -8px rgba(36,167,225,.7)}
.btn.green{background:var(--green);box-shadow:0 6px 16px -8px rgba(127,178,39,.7)}
.btn.soft{background:var(--sunken);color:var(--ink);box-shadow:none}
.btn.sm{padding:11px 16px;font-size:14.5px}
.btn svg{width:17px;height:17px}
.linkbtn{background:none;border:none;color:var(--blue);cursor:pointer;font-weight:600;font-size:13.5px;padding:0}

/* ===== pieces ===== */
.card{background:var(--surface);border-radius:var(--r-lg);padding:17px;display:flex;flex-direction:column;gap:11px;box-shadow:var(--shadow-sm)}
.card h3{font-size:16.5px}

.chips{display:flex;gap:6px;overflow-x:auto;background:var(--sunken);border-radius:999px;padding:5px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  border:none;background:transparent;border-radius:999px;padding:9px 16px;white-space:nowrap;
  cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink-2);transition:.2s;
}
.chip[aria-pressed="true"]{background:var(--surface);color:var(--blue);box-shadow:var(--shadow-sm)}

.counter{display:flex;gap:9px}
.pill{flex:1;border-radius:var(--r-md);padding:12px 13px;display:flex;flex-direction:column;background:var(--surface);box-shadow:var(--shadow-sm)}
.pill b{font-family:"Baloo Bhaijaan 2",sans-serif;font-size:24px;line-height:1.1}
.pill span{font-size:11.5px;color:var(--ink-2)}
.pill.ok{background:var(--green-soft);box-shadow:none} .pill.ok b{color:var(--green-ink)}
.pill.left{background:var(--yellow-soft);box-shadow:none} .pill.left b{color:var(--yellow-ink)}
.pill.no{background:var(--pink-soft);box-shadow:none} .pill.no b{color:var(--pink-ink)}
.pill.blue{background:var(--blue-soft);box-shadow:none} .pill.blue b{color:var(--blue-ink)}

/* ===== roster ===== */
.roster{display:flex;flex-direction:column;gap:8px}
.kid{
  display:flex;align-items:center;gap:12px;width:100%;text-align:right;
  background:var(--surface);border:none;border-radius:var(--r-md);padding:11px 13px;cursor:pointer;
  box-shadow:var(--shadow-sm);transition:background .18s;
}
.kid:active{transform:scale(.995)}
.kid.present{background:var(--green-soft);box-shadow:none}
.kid.left{background:var(--yellow-soft);box-shadow:none}
.face{
  width:36px;height:36px;border-radius:12px;flex:none;display:grid;place-items:center;
  font-weight:700;font-size:14px;background:var(--blue-soft);color:var(--blue-ink);
}
.kid.present .face{background:#fff;color:var(--green-ink)}
.kid.left .face{background:#fff;color:var(--yellow-ink)}
.kid .nm{flex:1;min-width:0}
.kid .nm b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kid .nm span{font-size:12px;color:var(--ink-2)}
.check{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--line);color:transparent;background:#fff}
.kid.present .check{background:var(--green);border-color:var(--green);color:#fff}
.kid.left .check{background:var(--yellow);border-color:var(--yellow);color:#fff}
.check svg{width:14px;height:14px}
.kid.busy{opacity:.5;pointer-events:none}
.kid.riding{background:var(--blue-soft);box-shadow:none}
.kid.riding .face{background:#fff;color:var(--blue-ink)}
.kid.riding .check{background:var(--blue);border-color:var(--blue);color:#fff}
.bell{font-size:11px;vertical-align:middle;opacity:.85}

/* ===== parent hero ===== */
.hero{border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:6px;background:var(--green-soft)}
.hero.out{background:var(--surface);box-shadow:var(--shadow-sm)}
.hero.left{background:var(--yellow-soft)}
.hero .st{display:flex;align-items:center;gap:10px;font-family:"Baloo Bhaijaan 2",sans-serif;font-size:20px;color:var(--green-ink)}
.hero.out .st{color:var(--ink-2)} .hero.left .st{color:var(--yellow-ink)}
.dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.hero small{color:var(--ink-2);font-size:13px}
.hero .who-kid{font-size:12px;color:var(--ink-2);font-weight:600}

/* ===== feed ===== */
.feed{display:flex;flex-direction:column;gap:12px}
.post{background:var(--surface);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-sm)}
.post.tint-green{background:var(--green-soft);box-shadow:none}
.post.tint-yellow{background:var(--yellow-soft);box-shadow:none}
.post.tint-blue{background:var(--blue-soft);box-shadow:none}
.post-head{display:flex;align-items:center;gap:11px}
.ic{width:36px;height:36px;border-radius:12px;flex:none;display:grid;place-items:center;background:#fff}
.ic svg{width:17px;height:17px}
.ic.green{color:var(--green-ink)} .ic.yellow{color:var(--yellow-ink)}
.ic.blue{color:var(--blue-ink)} .ic.pink{color:var(--pink-ink)}
.post-head .t{flex:1;min-width:0}
.post-head .t b{display:block;font-size:14.5px;font-weight:600}
.post-head .t span{font-size:12px;color:var(--ink-2)}
.post p{margin:0;font-size:14.5px;line-height:1.6}

.shots{display:grid;gap:6px}
.shots.n1{grid-template-columns:1fr}
.shots.n2{grid-template-columns:1fr 1fr}
.shots.n3{grid-template-columns:repeat(3,1fr)}
.shots button{border:none;padding:0;background:var(--sunken);border-radius:var(--r-sm);overflow:hidden;cursor:pointer;display:block}
.shots.n1 button{aspect-ratio:4/3}
.shots.n2 button,.shots.n3 button{aspect-ratio:1}
.shots img{width:100%;height:100%;object-fit:cover;display:block}
.shots .more{position:relative}
.shots .more::after{
  content:attr(data-more);position:absolute;inset:0;display:grid;place-items:center;
  background:rgba(34,55,74,.55);color:#fff;font-family:"Baloo Bhaijaan 2",sans-serif;font-size:20px;
}

/* ===== lightbox ===== */
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(20,32,44,.94);display:none;align-items:center;justify-content:center;padding:16px}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:86vh;border-radius:var(--r-md);object-fit:contain}
.lightbox .x{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.16);color:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center}

/* ===== dashboard ===== */
.bars{display:flex;flex-direction:column;gap:13px}
.bar{display:grid;grid-template-columns:1fr 60px;gap:10px;align-items:center;font-size:13.5px}
.bar .lbl{display:flex;flex-direction:column;gap:6px}
.track{height:9px;border-radius:99px;background:var(--sunken);overflow:hidden}
.fill{height:100%;background:var(--green);border-radius:99px;transition:width .5s}
.bar .val{text-align:left;color:var(--ink-2)}

.codes{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
.code{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--sunken);border-radius:var(--r-sm);padding:9px 13px;font-size:13px}
.code b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:600;color:var(--blue-ink)}
.code .used{color:var(--ink-2);font-size:11.5px}

/* ===== admin sub-nav, lists, absence ===== */
.subnav{display:flex;gap:6px;overflow-x:auto;background:var(--sunken);border-radius:999px;padding:5px;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav button{border:none;background:transparent;border-radius:999px;padding:9px 15px;white-space:nowrap;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.subnav button[aria-pressed="true"]{background:var(--surface);color:var(--pink);box-shadow:var(--shadow-sm)}

.rowlist{display:flex;flex-direction:column;gap:8px}
.row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:right;cursor:pointer;
  background:var(--surface);border:none;border-radius:var(--r-md);padding:11px 13px;box-shadow:var(--shadow-sm);
}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{font-size:12px;color:var(--ink-2)}
.row .tagx{flex:none;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--sunken);color:var(--ink-2)}
.row .tagx.free{background:var(--green-soft);color:var(--green-ink)}
.row .tagx.full{background:var(--blue-soft);color:var(--blue-ink)}

.codebox{display:flex;align-items:center;gap:10px;background:var(--blue-soft);border-radius:var(--r-md);padding:13px 15px}
.codebox b{flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:17px;color:var(--blue-ink);letter-spacing:.04em}
.codebox button{border:none;background:var(--blue);color:#fff;border-radius:999px;padding:8px 15px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}

.kid.absent{background:var(--pink-soft);box-shadow:none}
.kid.absent .face{background:#fff;color:var(--pink-ink)}
.absent-note{display:flex;align-items:center;gap:10px;background:var(--pink-soft);border-radius:var(--r-md);padding:12px 15px;font-size:13.5px;color:var(--pink-ink)}
.absent-note .t{flex:1}
.absent-note button{border:none;background:transparent;color:var(--pink-ink);font-weight:700;cursor:pointer;font-size:13px;text-decoration:underline;font-family:inherit}
.actions2{display:flex;gap:9px}
.actions2 .btn{flex:1}

.switchrow{display:flex;align-items:center;gap:12px;padding:11px 0}
.switchrow .t{flex:1;min-width:0}
.switchrow .t b{display:block;font-size:14.5px;font-weight:600}
.switchrow .t span{font-size:12.5px;color:var(--ink-2)}
.sw{width:48px;height:28px;border-radius:999px;background:var(--line);border:none;flex:none;position:relative;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw[aria-checked="true"]{background:var(--green)}
.sw[aria-checked="true"]::after{transform:translateX(-20px)}
.divider{height:1px;background:var(--line);margin:2px 0}

.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{color:var(--ink-2);font-weight:600;font-size:11.5px}
.tbl td.num{font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

.consentbox{display:flex;gap:11px;align-items:flex-start;background:var(--sunken);border-radius:var(--r-md);padding:13px 15px;font-size:13.5px;line-height:1.6}
.consentbox input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--green)}
.pickup-note{display:flex;align-items:center;gap:10px;background:var(--blue-soft);border-radius:var(--r-md);padding:12px 15px;font-size:13.5px;color:var(--blue-ink)}
.pickup-note .t{flex:1}
.pickup-note button{border:none;background:transparent;color:var(--blue-ink);font-weight:700;cursor:pointer;font-size:13px;text-decoration:underline;font-family:inherit}

/* ===== notification banner ===== */
.notif{display:flex;align-items:center;gap:12px;background:var(--yellow-soft);border-radius:var(--r-md);padding:13px 15px}
.notif .t{flex:1;min-width:0}
.notif .t b{display:block;font-size:14px}
.notif .t span{font-size:12.5px;color:var(--ink-2)}
.notif button{
  border:none;border-radius:999px;padding:10px 18px;cursor:pointer;flex:none;
  background:var(--yellow);color:#fff;font-weight:700;font-size:13.5px;font-family:"Baloo Bhaijaan 2",sans-serif;
}
.notif.info{background:var(--blue-soft)}

/* ===== bottom nav ===== */
nav.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);
  border-top:1px solid var(--line);display:flex;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto;
}
nav.tabs button{
  flex:1;background:none;border:none;cursor:pointer;border-radius:14px;padding:7px 4px;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink-2);font-weight:600;
}
nav.tabs button[aria-current="page"]{color:var(--pink)}
nav.tabs svg{width:21px;height:21px}

/* ===== sheet + toast ===== */
.sheet{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(20,32,44,.45)}
.sheet.open{display:flex}
.sheet .panel{background:var(--surface);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:13px;max-height:88vh;overflow:auto}
.sheet h3{font-size:19px}
.toast{
  position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;z-index:80;max-width:536px;margin:0 auto;
  background:var(--ink);color:#fff;border-radius:var(--r-md);padding:13px 16px;
  box-shadow:0 14px 30px -14px rgba(0,0,0,.5);
  opacity:0;transform:translateY(-16px);transition:.28s;pointer-events:none;font-size:14px;
}
.toast.show{opacity:1;transform:none}
.empty{text-align:center;color:var(--ink-2);font-size:14px;padding:28px 10px}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--pink);border-radius:50%;animation:sp .7s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}.btn:active{transform:none}}
</style>
</head>
<body>
<div id="app"><div class="spin"></div></div>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet"><div class="panel" id="sheetPanel"></div></div>
<div class="lightbox" id="lightbox"><button class="x" id="lbClose" aria-label="إغلاق">✕</button><img id="lbImg" alt=""></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://gpfczbyehgsxwsdhnrvz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XJaRuA9SMay-IzQGxcJg-Q_ztALOvac';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const app = document.getElementById('app');
const toastEl = document.getElementById('toast');
const sheet = document.getElementById('sheet');
const sheetPanel = document.getElementById('sheetPanel');
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
let toastTimer;

const S = {
  session:null, profile:null, kg:null,
  classes:[], children:[], attendance:{}, posts:[],
  myChildren:[], activeClass:null, tab:null, invites:[], people:{},
  channel:null, linked:new Set(), pushOn:false,
  absences:{}, staff:[], adminTab:'overview', childQuery:'', feedScope:'all',
  pickups:{}, notif:null, consentGiven:false, report:null, hasV2:true,
  brand:null, pending:new Set(), resets:[], isOwner:false, tenants:[],
  busTrip:(Number(new Date().toLocaleString('en-GB',{hour:'2-digit',hour12:false,timeZone:'Asia/Riyadh'})) < 11 ? 'am' : 'pm'),
  busRoster:[], busRoute:null, myBus:{}, preview:null
};

const el = (h) => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const SLUG = (location.hostname.split('.')[0] || 'mubdioon').toLowerCase();
const BRAND_FALLBACK = { name:'المبدعون الصغار', tagline:'تطبيق التواصل بين الروضة وأولياء الأمور', logo_url:'logo.png', theme:{} };
function brandLogo(){ return (S.brand && S.brand.logo_url) || 'logo.png'; }
function brandName(){ return (S.kg && S.kg.name) || (S.brand && S.brand.name) || BRAND_FALLBACK.name; }

async function loadBrand(){
  const r = await safe(sb.rpc('tenant_public', { p_slug: SLUG }));
  const row = r && r.data && r.data[0];
  S.brand = row || BRAND_FALLBACK;
  applyBrand();
}
function applyBrand(){
  const t = (S.brand && S.brand.theme) || {};
  const root = document.documentElement;
  ['pink','blue','green','yellow'].forEach(k => { if(t[k]) root.style.setProperty('--' + k, t[k]); });
  if(t.ground) root.style.setProperty('--ground', t.ground);
  const n = brandName();
  document.title = n;
  const m = document.querySelector('meta[name="apple-mobile-web-app-title"]'); if(m) m.setAttribute('content', n);
  if(S.brand && S.brand.logo_url){
    document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]').forEach(l => l.href = S.brand.logo_url);
  }
}

// parents sign in with a phone number; it maps to an internal address Supabase understands
const LOGIN_DOMAIN = 'wali.mubdioon.sa';
function normalisePhone(v){
  let d = String(v||'').replace(/[^\d+]/g,'');
  if(d.startsWith('+')) d = d.slice(1);
  if(d.startsWith('00')) d = d.slice(2);
  if(d.startsWith('966')) return d;
  if(d.startsWith('0')) return '966' + d.slice(1);
  if(d.startsWith('5') && d.length === 9) return '966' + d;
  return d;
}
function toEmail(id){
  const t = String(id||'').trim();
  if(t.includes('@')) return t;
  return normalisePhone(t) + '@' + LOGIN_DOMAIN;
}
function isPhone(id){ return !String(id||'').includes('@'); }
function copyText(t, btn){
  navigator.clipboard.writeText(t).then(()=>{ if(btn){ const o=btn.textContent; btn.textContent='تم النسخ'; setTimeout(()=>btn.textContent=o,1600);} }).catch(()=>toast('انسخ الرمز يدويًا: '+t));
}

function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 3200);
}

      <button class="btn" type="submit">${mode==='up'?'إنشاء الحساب':'دخول'}</button>

  app.appendChild(v);

  v.querySelectorAll('[data-m]').forEach(b => b.onclick = () => renderAuth(b.dataset.m));

  if(forgot) forgot.onclick = () => openSheet(`

      <p class="help">أدخل رقم جوالك وسنُبلّغ إدارة الروضة. ستتواصل معك بكلمة مرور مؤقتة.</p>

      <button class="btn" id="fsend">إرسال الطلب</button>
      <button class="btn soft sm" id="fcancel">إلغاء</button>
    `) || bindForgot();
  const msg = v.querySelector('#msg');
  v.querySelector('#f').onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true; msg.innerHTML = '';
    const raw = v.querySelector('#em').value.trim();
    const email = toEmail(raw);
    const phone = isPhone(raw) ? normalisePhone(raw) : null;
    const password = v.querySelector('#pw').value;
    try{
      if(mode==='up'){
        const full_name = v.querySelector('#nm').value.trim();
        const code = v.querySelector('#cd').value.trim().toUpperCase();
        if(phone && phone.length < 12){ throw new Error('رقم الجوال غير صحيح. مثال: 0551234567'); }
        const { data, error } = await sb.auth.signUp({ email, password, options:{ data:{ full_name, phone } } });

        if(!data.session){ msg.innerHTML = '<div class="ok">تم إنشاء الحساب. سجّل الدخول الآن.</div>'; btn.disabled=false; return; }

        await safe(sb.rpc('set_consent'));

        const { error } = await sb.auth.signInWithPassword({ email, password });
        if(error) throw new Error('رقم الجوال أو كلمة المرور غير صحيحة.');
      }
      await boot();
    }catch(err){
      msg.innerHTML = '<div class="err">'+esc(err.message||'حدث خطأ')+'</div>';
      btn.disabled = false;
    }
  };
}

function bindForgot(){
  const cancel = sheetPanel.querySelector('#fcancel');
  if(cancel) cancel.onclick = closeSheet;
  const send = sheetPanel.querySelector('#fsend');
  if(!send) return;
  send.onclick = async () => {
    const raw = sheetPanel.querySelector('#fp').value.trim();
    if(!raw){ sheetPanel.querySelector('#fmsg').innerHTML = '<div class="err">أدخل رقم الجوال.</div>'; return; }
    send.disabled = true; send.textContent = 'جارٍ الإرسال…';
    await safe(sb.rpc('request_reset', { p_phone: normalisePhone(raw) }));
    sheetPanel.querySelector('#fmsg').innerHTML = '<div class="ok">تم إرسال الطلب. ستتواصل معك الروضة قريبًا.</div>';
    send.disabled = false; send.textContent = 'إرسال الطلب';
  };
}

/* ================= data ================= */
async function loadCore(){
  const { data: prof } = await sb.from('profiles').select('*').eq('id', S.session.user.id).single();
  S.profile = prof;
  if(!prof || !prof.kindergarten_id) return false;
  const [kg, classes] = await Promise.all([
    sb.from('kindergartens').select('*').eq('id', prof.kindergarten_id).single(),
    sb.from('classes').select('*').eq('kindergarten_id', prof.kindergarten_id).order('name')
  ]);
  S.kg = kg.data; S.classes = classes.data || [];
  S.notif = (prof && prof.notif) ? Object.assign({}, NOTIF_DEFAULT, prof.notif) : Object.assign({}, NOTIF_DEFAULT);
  S.hasV2 = !!(prof && prof.notif);
  const ow = await safe(sb.rpc('is_owner'));
  S.isOwner = !!(ow && ow.data === true);
  const g = await safe(sb.from('guardians').select('consent_at').eq('profile_id', prof.id));
  S.consentGiven = !!(g && (g.data||[]).some(x => x.consent_at));
  await refresh();
  return true;
}

async function refresh(){
  if(S.profile && S.profile.role === 'bus'){
    await loadBusRoster();
    S.children = []; S.attendance = {}; S.posts = []; S.absences = {}; S.pickups = {};
    S.linked = new Set();
    return;
  }
  const [ch, at, po, ab] = await Promise.all([
    sb.from('children').select('id,full_name,gender,class_id,active,rides_bus,bus_route').eq('active', true).order('full_name'),
    sb.from('attendance').select('*').eq('day', today()),
    sb.from('posts').select('*').order('created_at',{ascending:false}).limit(30),
    sb.from('absences').select('*').gte('day', today()).lte('day', dayOffset(7))
  ]);
  S.children = ch.data || [];
  S.attendance = {};
  (at.data||[]).forEach(r => S.attendance[r.child_id] = r);
  S.posts = po.data || [];
  S.absences = {};
  (ab.data||[]).forEach(r => S.absences[r.child_id + '|' + r.day] = r);
  const pk = await safe(sb.from('pickups').select('*').gte('day', today()).lte('day', dayOffset(7)));
  S.pickups = {};
  if(pk) (pk.data||[]).forEach(r => S.pickups[r.child_id + '|' + r.day] = r);
  if(S.profile.role === 'parent'){
    S.myChildren = S.children;
    const mb = await safe(sb.rpc('my_bus_today'));
    S.myBus = {};
    if(mb) (mb.data||[]).forEach(r => S.myBus[r.child_id + '|' + r.trip] = r);
  }
  // previewing another role: borrow the data that role would see
  if(S.preview === 'parent'){
    S.myChildren = S.children.slice(0, 1);
    S.myBus = {};
    const ids = S.myChildren.map(c => c.id);
    if(ids.length){
      const bl = await safe(sb.from('bus_logs').select('*').eq('day', today()).in('child_id', ids));
      if(bl) (bl.data||[]).forEach(r => S.myBus[r.child_id + '|' + r.trip] = r);
    }
  }
  if(S.preview === 'bus') await loadBusRoster();
  if(S.profile.role !== 'parent'){
    const { data: lk } = await sb.rpc('children_with_push');
    S.linked = new Set((lk || []).map(r => (typeof r === 'string' ? r : r.children_with_push)));
  }
  if(!S.activeClass && S.classes.length) S.activeClass = S.classes[0].id;
}

function subscribe(){
  if(S.channel) sb.removeChannel(S.channel);
  S.channel = sb.channel('live')
    .on('postgres_changes',{event:'*',schema:'public',table:'attendance'}, p => {
      const r = p.new && p.new.id ? p.new : null;
      if(r && r.day === today()){ S.attendance[r.child_id] = r; render(); }
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'posts'}, p => {
      if(!S.posts.find(x=>x.id===p.new.id)){ S.posts.unshift(p.new); render(); }
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'absences'}, async () => {
      await refresh(); render();
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'bus_logs'}, async () => {
      if(S.profile.role === 'bus') { await loadBusRoster(); render(); }
      else if(S.profile.role === 'parent'){ await refresh(); render(); }
    })
    .subscribe();
}

// ---- offline queue: a tap at the door must never be lost to bad wifi ----
const QKEY = 'pendingTaps_v1';
function queueGet(){ try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch(_){ return []; } }
function queueSet(v){ try { localStorage.setItem(QKEY, JSON.stringify(v)); } catch(_){} }
function stateOfRow(r){
  if(!r || !r.check_in_at) return 'out';
  return r.check_out_at ? 'left' : 'in';
}
function nextState(cur){ return cur === 'out' ? 'in' : cur === 'in' ? 'left' : 'out'; }

function queueTap(childId, want){
  const q = queueGet().filter(x => x.child_id !== childId);
  q.push({ child_id: childId, want, ts: Date.now() });
  queueSet(q);
  S.pending.add(childId);
}

async function flushQueue(){
  const q = queueGet();
  if(!q.length || !navigator.onLine) return;
  const at = await safe(sb.from('attendance').select('*').eq('day', today()));
  if(!at) return;                                  // still offline; try again later
  const cur = {};
  (at.data || []).forEach(r => cur[r.child_id] = r);

  const rest = [];
  let done = 0;
  for(const it of q){
    // the tap may have reached the server before the connection dropped
    if(stateOfRow(cur[it.child_id]) === it.want){ done++; continue; }
    let row = cur[it.child_id], guard = 0, ok = false;
    while(guard++ < 3){
      const { data, error } = await sb.rpc('toggle_attendance', { p_child: it.child_id });
      if(error) break;
      row = data;
      if(stateOfRow(row) === it.want){ ok = true; break; }
    }
    if(ok){
      cur[it.child_id] = row; S.attendance[it.child_id] = row; done++;
      if(it.want !== 'out') notifyServer({ type:'attendance', child_id: it.child_id });
    } else {
      rest.push(it);
    }
  }
  queueSet(rest);
  S.pending = new Set(rest.map(x => x.child_id));
  if(done){ toast('تم إرسال ' + done + ' تسجيل كان محفوظًا على الجهاز'); await refresh(); render(); }
}
window.addEventListener('online', () => flushQueue());

}
async function loadBusRoster(){
  const r = await safe(sb.rpc('bus_roster', { p_trip: S.busTrip }));
  S.busRoster = (r && r.data) || [];
  const routes = [...new Set(S.busRoster.map(x=>x.bus_route).filter(Boolean))];
  if(S.busRoute && !routes.includes(S.busRoute)) S.busRoute = null;
}

function statusOf(childId){
  const a = S.attendance[childId];
  if(!a || !a.check_in_at) return {k:'out', t:null};
  if(a.check_out_at) return {k:'left', t:a.check_out_at};
  return {k:'in', t:a.check_in_at};
}

/* ================= staff: roster ================= */
function viewRoster(){
  const kids = S.children.filter(c => c.class_id === S.activeClass);
  const inN = kids.filter(k => statusOf(k.id).k==='in').length;
  const leftN = kids.filter(k => statusOf(k.id).k==='left').length;
  const absN = kids.filter(k => statusOf(k.id).k==='out' && absenceOf(k.id)).length;

  const wrap = el('<div style="display:flex;flex-direction:column;gap:16px"></div>');

  if(S.classes.length > 1){
    const chips = el('<div class="chips"></div>');
    S.classes.forEach(c => {
      const b = el(`<button class="chip" aria-pressed="${c.id===S.activeClass}">${esc(c.name)}</button>`);
      b.onclick = () => { S.activeClass = c.id; render(); };
      chips.appendChild(b);
    });
    wrap.appendChild(chips);
  }

  wrap.appendChild(el(`<div class="counter">
    <div class="pill ok"><b class="num">${inN}</b><span>في الروضة</span></div>
    <div class="pill left"><b class="num">${leftN}</b><span>غادر</span></div>
    <div class="pill no"><b class="num">${kids.length-inN-leftN-absN}</b><span>لم يصل</span></div>
    <div class="pill blue"><b class="num">${absN}</b><span>غياب مُبلّغ</span></div>
  </div>`));

  const roster = el('<div class="roster"></div>');
  if(!kids.length) roster.appendChild(el('<div class="empty">لا يوجد أطفال في هذا الفصل.</div>'));
  kids.forEach(k => {
    const st = statusOf(k.id);
    const ab = st.k==='out' ? absenceOf(k.id) : null;
    const label = st.k==='in' ? 'وصل ' + fmtTime(st.t)
                : st.k==='left' ? 'غادر ' + fmtTime(st.t)
                : ab ? 'غياب مُبلّغ · ' + (REASONS[ab.reason] || ab.reason) + (ab.note ? ' · ' + ab.note : '')
                : 'لم يصل بعد';
    const pk = pickupOf(k.id);
    const label2 = (S.pending.has(k.id) ? '⏳ بانتظار الإرسال · ' : '')
                 + (pk ? label + ' · يستلمه: ' + pk.person_name : label);
    const b = el(`<button class="kid ${st.k==='out' ? (ab?'absent':'') : st.k}">
      <span class="face">${esc(initial(k.full_name))}</span>
      <span class="nm"><b>${esc(k.full_name)}${S.linked.has(k.id)?' <span class="bell" title="ولي الأمر مشترك في الإشعارات">🔔</span>':''}</b><span>${label2}</span></span>
      <span class="check">${ICONS.check}</span>
    </button>`);
    b.onclick = async () => {
      if(previewBlock()) return;
      b.classList.add('busy');
      const want = nextState(statusOf(k.id).k);
      let failedOffline = false;
      try{
        if(!navigator.onLine) throw new Error('offline');
        const { data, error } = await sb.rpc('toggle_attendance', { p_child: k.id });
        if(error) throw error;
        S.attendance[k.id] = data;
        S.pending.delete(k.id);
        const q = queueGet().filter(x => x.child_id !== k.id); queueSet(q);
      }catch(err){
        const msg = String((err && err.message) || err);
        if(!navigator.onLine || /offline|fetch|network|Failed to fetch|timeout/i.test(msg)){
          failedOffline = true;
          queueTap(k.id, want);
          // show the teacher what she just did, even with no signal
          const now = new Date().toISOString();
          const row = S.attendance[k.id] || { child_id:k.id, day:today(), check_in_at:null, check_out_at:null };
          if(want === 'in'){ row.check_in_at = now; row.check_out_at = null; }
          else if(want === 'left'){ row.check_out_at = now; }
          else { row.check_in_at = null; row.check_out_at = null; }
          S.attendance[k.id] = row;
        } else {
          b.classList.remove('busy');
          toast('تعذّر التسجيل: ' + msg);
          return;
        }
      }
      b.classList.remove('busy');
      const s2 = statusOf(k.id);
      if(failedOffline){
        toast('لا يوجد اتصال — حُفظ على الجهاز وسيُرسل تلقائيًا');
      } else {
        if(s2.k !== 'out') notifyServer({ type:'attendance', child_id: k.id });
        const notified = S.linked.has(k.id) ? ' — أُشعر ولي الأمر' : '';
        toast(s2.k==='in' ? 'تم تسجيل وصول ' + first(k.full_name) + notified
            : s2.k==='left' ? 'تم تسجيل مغادرة ' + first(k.full_name) + notified
            : 'تم إلغاء التسجيل');
      }
      render();
    };
    roster.appendChild(b);
  });
  wrap.appendChild(roster);

  const acts = el('<div style="display:flex;flex-direction:column;gap:9px"></div>');
  const a1 = el(`<button class="btn blue">${ICONS.photo} نشر نشاط وصور</button>`);
  a1.onclick = () => { if(!previewBlock()) composer('activity'); };
  const a2 = el(`<button class="btn soft">${ICONS.megaphone} إرسال إعلان</button>`);
  a2.onclick = () => { if(!previewBlock()) composer('announcement'); };
  acts.append(a1,a2);
  wrap.appendChild(acts);
  return wrap;
}


/* ================= bus escort: the whole app for her ================= */
function viewBus(){
  const wrap = el('<div style="display:flex;flex-direction:column;gap:16px"></div>');

  // which trip
  const seg = el(`<div class="segmented">
    <button aria-selected="${S.busTrip==='am'}">رحلة الصباح</button>
    <button aria-selected="${S.busTrip==='pm'}">رحلة العودة</button>
  </div>`);
  seg.children[0].onclick = async ()=>{ if(S.busTrip==='am') return; S.busTrip='am'; await loadBusRoster(); render(); };
  seg.children[1].onclick = async ()=>{ if(S.busTrip==='pm') return; S.busTrip='pm'; await loadBusRoster(); render(); };
  wrap.appendChild(seg);

  // which bus, when the kindergarten runs more than one
  const routes = [...new Set(S.busRoster.map(x=>x.bus_route).filter(Boolean))];
  if(routes.length > 1){
    const chips = el('<div class="chips"></div>');
    const all = el(`<button class="chip" aria-pressed="${!S.busRoute}">الكل</button>`);
    all.onclick = ()=>{ S.busRoute=null; render(); };
    chips.appendChild(all);
    routes.forEach(rt => {
      const b = el(`<button class="chip" aria-pressed="${rt===S.busRoute}">${esc(rt)}</button>`);
      b.onclick = ()=>{ S.busRoute=rt; render(); };
      chips.appendChild(b);
    });
    wrap.appendChild(chips);
  }

  const kids = S.busRoster.filter(k => !S.busRoute || k.bus_route === S.busRoute);
  const onBus = kids.filter(k => busState(k)==='boarded').length;
  const done  = kids.filter(k => busState(k)==='arrived').length;
  const absN  = kids.filter(k => k.absent && busState(k)==='none').length;
  const waiting = kids.length - onBus - done - absN;

  wrap.appendChild(el(`<div class="counter">
    <div class="pill blue"><b class="num">${onBus}</b><span>في الحافلة</span></div>
    <div class="pill ok"><b class="num">${done}</b><span>${S.busTrip==='am'?'وصل الروضة':'وصل المنزل'}</span></div>
    <div class="pill no"><b class="num">${waiting}</b><span>لم يركب</span></div>
    <div class="pill left"><b class="num">${absN}</b><span>غياب مُبلّغ</span></div>
  </div>`));

  // the one thing that matters: nobody left on the bus
  if(kids.length && onBus === 0 && done > 0 && waiting === 0){
    wrap.appendChild(el(`<div class="ok">✅ الحافلة فارغة — كل الأطفال ${S.busTrip==='am'?'وصلوا الروضة':'وصلوا منازلهم'}.</div>`));
  } else if(onBus > 0){
    wrap.appendChild(el(`<div class="absent-note"><span class="t">لا يزال <b>${onBus}</b> ${onBus===1?'طفل':'أطفال'} في الحافلة.</span></div>`));
  }

  const roster = el('<div class="roster"></div>');
  if(!kids.length){
    roster.appendChild(el('<div class="empty">لا يوجد أطفال مسجّلين في الحافلة. تراجع الإدارة قائمة الأطفال.</div>'));
  }
  kids.forEach(k => {
    const st = busState(k);
    const t  = st==='arrived' ? k.arrived_at : k.boarded_at;
    const cls = st==='boarded' ? 'riding' : st==='arrived' ? 'present' : (k.absent ? 'absent' : '');
    const label = k.absent && st==='none' ? 'غياب مُبلّغ اليوم' : busLabel(S.busTrip, st, t);
    const b = el(`<button class="kid ${cls}">
      <span class="face">${esc(initial(k.full_name))}</span>
      <span class="nm"><b>${esc(k.full_name)}</b><span>${esc(label)}${k.bus_route && routes.length>1 ? ' · '+esc(k.bus_route) : ''}</span></span>
      <span class="check">${st==='arrived' ? ICONS.check : ICONS.car}</span>
    </button>`);
    b.onclick = async () => {
      if(previewBlock()) return;
      b.classList.add('busy');
      const r = await safe(sb.rpc('bus_mark', { p_child: k.child_id, p_trip: S.busTrip }));
      b.classList.remove('busy');
      if(!r || !r.data){ toast('تعذّر التسجيل — تأكدي من الاتصال'); return; }
      const row = r.data;
      k.boarded_at = row.boarded_at; k.arrived_at = row.arrived_at;
      const s2 = busState(k);
      if(s2 !== 'none') notifyServer({ type:'bus', child_id: k.child_id, trip: S.busTrip });
      toast(s2==='boarded' ? 'ركب ' + first(k.full_name) + ' الحافلة — أُشعر ولي الأمر'
          : s2==='arrived' ? (S.busTrip==='am' ? 'وصل ' : 'وصل ') + first(k.full_name) + (S.busTrip==='am'?' الروضة':' المنزل') + ' — أُشعر ولي الأمر'
          : 'تم إلغاء التسجيل');
      render();
    };
    roster.appendChild(b);
  });
  wrap.appendChild(roster);
  return wrap;
}

function composer(kind){
  const isAct = kind==='activity';
  openSheet(`
    <h3>${isAct?'نشر نشاط':'إرسال إعلان'}</h3>
    <div class="field">
      <label for="bd">${isAct?'ماذا فعل الأطفال؟':'نص الإعلان'}</label>
      <textarea id="bd" rows="3" placeholder="${isAct?'مثال: الرسم بألوان الماء':'مثال: رحلة مزرعة النخيل يوم الأربعاء'}"></textarea>
    </div>
    <div class="field">
      <label for="sc">يظهر لـ</label>
      <select id="sc">
        <option value="">كل أولياء الأمور في الروضة</option>
        ${S.classes.map(c=>`<option value="${c.id}" ${c.id===S.activeClass?'selected':''}>فصل ${esc(c.name)}</option>`).join('')}
      </select>
    </div>
    ${isAct?`<div class="field"><label for="ph">الصور (اختياري)</label><input id="ph" type="file" accept="image/*" multiple></div>`:''}
    <div id="cmsg"></div>
    <button class="btn" id="send">نشر</button>
    <button class="btn soft sm" id="cancel">إلغاء</button>
  `);
  sheetPanel.querySelector('#cancel').onclick = closeSheet;
  sheetPanel.querySelector('#send').onclick = async () => {
    const body = sheetPanel.querySelector('#bd').value.trim();
    if(!body){ sheetPanel.querySelector('#cmsg').innerHTML='<div class="err">اكتب النص أولًا.</div>'; return; }
    const btn = sheetPanel.querySelector('#send'); btn.disabled = true; btn.textContent = 'جارٍ النشر…';
    const class_id = sheetPanel.querySelector('#sc').value || null;
    const paths = [];
    try{
      const files = isAct ? Array.from(sheetPanel.querySelector('#ph').files||[]) : [];
      for(const f of files.slice(0,9)){
        const path = `${S.kg.id}/${crypto.randomUUID()}-${f.name.replace(/[^\w.\-]/g,'_')}`;
        const { error } = await sb.storage.from('photos').upload(path, f, { upsert:false });
        if(error) throw error;
        paths.push(path);
      }
      const { data, error } = await sb.from('posts').insert({
        kindergarten_id: S.kg.id, class_id, author_id: S.profile.id,
        kind, body, photo_paths: paths
      }).select().single();
      if(error) throw error;
      if(!S.posts.find(p=>p.id===data.id)) S.posts.unshift(data);
      notifyServer({ type:'post', post_id: data.id });
      closeSheet(); toast(isAct?'تم نشر النشاط':'تم إرسال الإعلان'); render();
    }catch(err){
      sheetPanel.querySelector('#cmsg').innerHTML = '<div class="err">تعذّر النشر: '+esc(err.message)+'</div>';
      btn.disabled=false; btn.textContent='نشر';
    }
  };
}

/* ================= parent ================= */
function viewParent(){
  const wrap = el('<div style="display:flex;flex-direction:column;gap:16px"></div>');
  if(!S.myChildren.length){
    wrap.appendChild(el('<div class="empty">لم يتم ربط حسابك بطفل بعد. راجع إدارة الروضة.</div>'));
    return wrap;
  }
  S.myChildren.forEach(c => {
    const st = statusOf(c.id);
    const cls = S.classes.find(x=>x.id===c.class_id);
    const txt = st.k==='in' ? first(c.full_name) + ' في الروضة الآن'
              : st.k==='left' ? first(c.full_name) + ' غادر الروضة'
              : first(c.full_name) + ' لم يصل بعد';
    const sub = st.t ? (st.k==='in'?'الوصول ':'المغادرة ') + fmtTime(st.t) : fmtDay(new Date());
    wrap.appendChild(el(`<div class="hero ${st.k==='in'?'':st.k}">
      <span class="who-kid">${esc(c.full_name)}${cls?' · فصل '+esc(cls.name):''}</span>
      <div class="st"><span class="dot"></span><span>${esc(txt)}</span></div>
      <small>${esc(sub)}</small>
    </div>`));

    // reported absences for today and tomorrow
    [today(), dayOffset(1)].forEach(d => {
      const ab = absenceOf(c.id, d);
      if(!ab) return;
      const n = el(`<div class="absent-note">
        <span class="t">بلاغ غياب ${esc(dayLabel(d))} · ${esc(REASONS[ab.reason]||ab.reason)}${ab.note?' · '+esc(ab.note):''}</span>
        <button type="button">إلغاء</button>
      </div>`);
      n.querySelector('button').onclick = async () => {
        const { error } = await sb.rpc('cancel_absence', { p_child: c.id, p_day: d });
        if(error){ toast('تعذّر الإلغاء'); return; }
        delete S.absences[c.id + '|' + d];
        toast('تم إلغاء البلاغ'); render();
      };
      wrap.appendChild(n);
    });

    // the bus, when the child rides it
    ['am','pm'].forEach(tp => {
      const r = S.myBus[c.id + '|' + tp];
      const st = busState(r);
      if(st === 'none') return;
      const t = st==='arrived' ? r.arrived_at : r.boarded_at;
      const txt = tp==='am'
        ? (st==='boarded' ? first(c.full_name)+' في الحافلة متجهًا للروضة' : first(c.full_name)+' وصل الروضة بالحافلة')
        : (st==='boarded' ? first(c.full_name)+' في الحافلة عائدًا للمنزل' : first(c.full_name)+' وصل المنزل بأمان');
      wrap.appendChild(el(`<div class="pickup-note">
        <span class="t">${ICONS.car} ${esc(txt)} · ${esc(fmtTime(t))}</span>
      </div>`));
    });

    // who is collecting the child today
    const pk = pickupOf(c.id, today());
    if(pk){
      const n = el(`<div class="pickup-note">
        <span class="t">يستلم ${esc(first(c.full_name))} اليوم: <b>${esc(pk.person_name)}</b>${pk.relation?' · '+esc(pk.relation):''}${pk.phone?' · '+esc(pk.phone):''}</span>
        <button type="button">إلغاء</button>
      </div>`);
      n.querySelector('button').onclick = async () => {
        const r = await safe(sb.rpc('clear_pickup', { p_child: c.id, p_day: today() }));
        if(!r){ toast('تعذّر الإلغاء'); return; }
        delete S.pickups[c.id + '|' + today()];
        toast('تم الإلغاء'); render();
      };
      wrap.appendChild(n);
    }

    const acts = el('<div class="actions2"></div>');
    if(!absenceOf(c.id, today()) || !absenceOf(c.id, dayOffset(1))){
      const b = el(`<button class="btn soft sm">إبلاغ عن غياب</button>`);
      b.onclick = () => { if(!previewBlock()) absenceSheet(c); };
      acts.appendChild(b);
    }
    const pb = el(`<button class="btn soft sm">${pk?'تغيير المستلم':'من سيستلم الطفل؟'}</button>`);
    pb.onclick = () => { if(!previewBlock()) pickupSheet(c); };
    acts.appendChild(pb);
    wrap.appendChild(acts);
  });
  wrap.appendChild(buildFeed());
  return wrap;
}

function absenceSheet(child){
  const days = [today(), dayOffset(1)].filter(d => !absenceOf(child.id, d));
  openSheet(`
    <h3>إبلاغ عن غياب</h3>
    <p class="help">${esc(child.full_name)} — سيصل البلاغ لمعلمة الفصل مباشرة.</p>
    <div class="field">
      <label for="ad">اليوم</label>
      <select id="ad">${days.map(d=>`<option value="${d}">${esc(dayLabel(d))}</option>`).join('')}</select>
    </div>
    <div class="field">
      <label for="ar">السبب</label>
      <select id="ar">${Object.entries(REASONS).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('')}</select>
    </div>
    <div class="field"><label for="an">ملاحظة (اختياري)</label><input id="an" placeholder="مثال: موعد في المستشفى"></div>
    <div id="amsg"></div>
    <button class="btn" id="asend">إرسال البلاغ</button>
    <button class="btn soft sm" id="acancel">إلغاء</button>
  `);
  sheetPanel.querySelector('#acancel').onclick = closeSheet;
  sheetPanel.querySelector('#asend').onclick = async () => {
    const btn = sheetPanel.querySelector('#asend'); btn.disabled = true; btn.textContent = 'جارٍ الإرسال…';
    const p_day = sheetPanel.querySelector('#ad').value;
    const p_reason = sheetPanel.querySelector('#ar').value;
    const p_note = sheetPanel.querySelector('#an').value.trim() || null;
    const { data, error } = await sb.rpc('report_absence', { p_child: child.id, p_day, p_reason, p_note });
    if(error){
      sheetPanel.querySelector('#amsg').innerHTML = '<div class="err">تعذّر الإرسال: '+esc(error.message)+'</div>';
      btn.disabled = false; btn.textContent = 'إرسال البلاغ'; return;
    }
    S.absences[child.id + '|' + p_day] = data;
    notifyServer({ type:'absence', child_id: child.id, day: p_day });
    closeSheet(); toast('تم إرسال البلاغ للروضة'); render();
  };
}

function pickupSheet(child){
  const existing = pickupOf(child.id, today());
  openSheet(`
    <h3>من سيستلم ${esc(first(child.full_name))}؟</h3>
    <p class="help">يظهر للمعلمة عند وقت الخروج اليوم فقط.</p>
    <div class="field"><label for="pn">اسم المستلم</label><input id="pn" value="${existing?esc(existing.person_name):''}" placeholder="الاسم الكامل"></div>
    <div class="field"><label for="pr">صلة القرابة</label><input id="pr" value="${existing&&existing.relation?esc(existing.relation):''}" placeholder="مثال: الخال"></div>
    <div class="field"><label for="pp">رقم الجوال</label><input id="pp" inputmode="tel" value="${existing&&existing.phone?esc(existing.phone):''}" placeholder="05XXXXXXXX"></div>
    <div id="pmsg"></div>
    <button class="btn" id="psave">حفظ</button>
    <button class="btn soft sm" id="pcancel">إلغاء</button>
  `);
  sheetPanel.querySelector('#pcancel').onclick = closeSheet;
  sheetPanel.querySelector('#psave').onclick = async () => {
    const name = sheetPanel.querySelector('#pn').value.trim();
    if(!name){ sheetPanel.querySelector('#pmsg').innerHTML = '<div class="err">اكتب اسم المستلم.</div>'; return; }
    const btn = sheetPanel.querySelector('#psave'); btn.disabled = true; btn.textContent = 'جارٍ الحفظ…';
    const r = await safe(sb.rpc('set_pickup', {
      p_child: child.id, p_day: today(), p_name: name,
      p_relation: sheetPanel.querySelector('#pr').value.trim() || null,
      p_phone: sheetPanel.querySelector('#pp').value.trim() || null
    }));
    if(!r){
      sheetPanel.querySelector('#pmsg').innerHTML = '<div class="err">تعذّر الحفظ. حدّث الصفحة وحاول مرة أخرى.</div>';
      btn.disabled = false; btn.textContent = 'حفظ'; return;
    }
    S.pickups[child.id + '|' + today()] = r.data;
    notifyServer({ type:'pickup', child_id: child.id, day: today() });
    closeSheet(); toast('تم إبلاغ الروضة'); render();
  };
}

function buildFeed(){
  const staff = S.profile.role !== 'parent';
  const box = el('<div style="display:flex;flex-direction:column;gap:14px"></div>');

  // ---- scope selector: classes for staff, children for parents with more than one ----
  let scopes = [];
  if(staff){
    scopes = [{id:'all', label:'كل الفصول'}].concat(S.classes.map(c => ({id:c.id, label:'فصل '+c.name})));
  } else if(S.myChildren.length > 1){
    scopes = [{id:'all', label:'الكل'}].concat(S.myChildren.map(c => ({id:c.id, label:first(c.full_name)})));
  }
  if(scopes.length && !scopes.find(x=>x.id===S.feedScope)) S.feedScope = 'all';

  if(scopes.length > 1){
    const chips = el('<div class="chips"></div>');
    scopes.forEach(sc => {
      const b = el(`<button class="chip" aria-pressed="${sc.id===S.feedScope}">${esc(sc.label)}</button>`);
      b.onclick = () => { S.feedScope = sc.id; render(); };
      chips.appendChild(b);
    });
    box.appendChild(chips);
  }

  // ---- which children and which class does the scope cover ----
  let kids, classIds;
  if(staff){
    kids = S.feedScope === 'all' ? S.children : S.children.filter(c => c.class_id === S.feedScope);
    classIds = S.feedScope === 'all' ? S.classes.map(c=>c.id) : [S.feedScope];
  } else {
    kids = S.feedScope === 'all' ? S.myChildren : S.myChildren.filter(c => c.id === S.feedScope);
    classIds = kids.map(c => c.class_id).filter(Boolean);
  }

  const items = [];
  kids.forEach(c => {
    const a = S.attendance[c.id];
    const fem = c.gender === 'f';
    if(a && a.check_in_at) items.push({t:a.check_in_at, kind:'in', title:(fem?'وصلت ':'وصل ')+first(c.full_name)+' إلى الروضة', sub:fmtTime(a.check_in_at)});
    if(a && a.check_out_at) items.push({t:a.check_out_at, kind:'out', title:(fem?'غادرت ':'غادر ')+first(c.full_name)+' الروضة', sub:fmtTime(a.check_out_at)});
  });

  S.posts
    .filter(p => p.class_id === null || classIds.includes(p.class_id))
    .forEach(p => {
      const cls = S.classes.find(x => x.id === p.class_id);
      items.push({
        t:p.created_at, kind:p.kind==='activity'?'photo':'megaphone',
        title:p.kind==='activity'?'نشاط جديد':'إعلان من الإدارة',
        sub:fmtTime(p.created_at) + (cls ? ' · فصل ' + cls.name : ' · لكل الروضة'),
        body:p.body, photos:p.photo_paths||[]
      });
    });

  items.sort((a,b)=> new Date(b.t)-new Date(a.t));

  const feed = el('<div class="feed"></div>');
  box.appendChild(feed);
  if(!items.length){ feed.appendChild(el('<div class="empty">لا توجد أخبار هنا بعد.</div>')); return box; }

  const TINT = { in:'tint-green', out:'tint-yellow', photo:'tint-blue', megaphone:'' };
  const ICCLR = { in:'green', out:'yellow', photo:'blue', megaphone:'pink' };

  items.slice(0,25).forEach(it => {
    const node = el(`<article class="post ${TINT[it.kind]||''}">
      <div class="post-head">
        <div class="ic ${ICCLR[it.kind]||'blue'}">${ICONS[it.kind]||ICONS.photo}</div>
        <div class="t"><b>${esc(it.title)}</b><span>${esc(it.sub)}</span></div>
      </div>
      ${it.body?'<p>'+esc(it.body)+'</p>':''}
    </article>`);
    feed.appendChild(node);

    const photos = it.photos || [];
    if(photos.length){
      const n = Math.min(photos.length, 3);
      const grid = el(`<div class="shots n${n}"></div>`);
      node.appendChild(grid);
      sb.storage.from('photos').createSignedUrls(photos, 3600).then(({data})=>{
        const urls = (data||[]).map(u=>u.signedUrl).filter(Boolean);
        grid.innerHTML = '';
        urls.slice(0,n).forEach((u,i) => {
          const last = (i===n-1 && photos.length>n);
          const b = el(`<button class="${last?'more':''}" ${last?`data-more="+${photos.length-n}"`:''} aria-label="عرض الصورة"><img loading="lazy" alt="صورة من النشاط" src="${u}"></button>`);
          b.onclick = () => openPhoto(u);
          grid.appendChild(b);
        });
      });
    }
  });
  return box;
}

// CSV or pasted rows: الاسم , الفصل , الجنس
function parseRows(text){
  const lines = String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return [];
  const split = (l) => l.includes('\t') ? l.split('\t') : l.split(',');
  let cols = split(lines[0]).map(x=>x.trim());
  let start = 0, idx = { name:0, cls:1, gender:2 };
  const looksLikeHeader = cols.some(c => /^(الاسم|اسم|name|الطفل)$/i.test(c));
  if(looksLikeHeader){
    start = 1;
    cols.forEach((c,i) => {
      if(/^(الاسم|اسم|name|الطفل)$/i.test(c)) idx.name = i;
      else if(/^(الفصل|الصف|class|group)$/i.test(c)) idx.cls = i;
      else if(/^(الجنس|النوع|gender|sex)$/i.test(c)) idx.gender = i;
    });
  }
  const out = [];
  for(let i=start;i<lines.length;i++){
    const p = split(lines[i]).map(x=>x.trim());
    const name = (p[idx.name]||'').trim();
    if(!name) continue;
    const graw = (p[idx.gender]||'').trim();
    const gender = /^(m|ذكر|ولد|بنين)$/i.test(graw) ? 'm' : 'f';
    out.push({ name, class: (p[idx.cls]||'').trim(), gender });
  }
  return out;
}

function importSheet(){

      <textarea id="it" rows="5" placeholder="الاسم,الفصل,الجنس&#10;لمى العتيبي,الفراشات,أنثى&#10;تركي الحربي,النحل,ذكر"></textarea></div>

    <div id="imsg"></div>
    <button class="btn" id="igo">معاينة</button>

  `);

  sheetPanel.querySelector('#if').onchange = async (e) => {
    const f = e.target.files[0]; if(!f) return;
    sheetPanel.querySelector('#it').value = await f.text();
  };

  sheetPanel.querySelector('#igo').onclick = async (e) => {
    const rows = parseRows(sheetPanel.querySelector('#it').value);
    const prev = sheetPanel.querySelector('#iprev');
    const msg = sheetPanel.querySelector('#imsg');
    if(!rows.length){ msg.innerHTML = '<div class="err">لم يُقرأ أي صف.</div>'; return; }

    if(e.target.textContent === 'معاينة'){
      const classes = Array.from(new Set(rows.map(r=>r.class).filter(Boolean)));
      const known = classes.filter(c => S.classes.some(x=>x.name===c));
      const isNew = classes.filter(c => !known.includes(c));
      prev.innerHTML = `<div class="ok">${rows.length} طفل جاهز للاستيراد.</div>` +
        (isNew.length ? `<p class="help">فصول ستُنشأ: ${esc(isNew.join('، '))}</p>` : '') +
        `<div class="tblwrap"><table class="tbl"><thead><tr><th>الاسم</th><th>الفصل</th><th>الجنس</th></tr></thead><tbody>` +

      e.target.textContent = 'استيراد ' + rows.length + ' طفل';

    if(!r || !r.data){

      e.target.disabled = false; e.target.textContent = 'استيراد'; return;
    }

    await refresh(); await loadInvites();
    openSheet(`<h3>تم استيراد ${made.length} طفل</h3>
      <p class="help">هذه رموز أولياء الأمور. كل رمز يصلح لأربعة أشخاص.</p>

function classSheet(c){
  openSheet(`
    <h3>${c?'تعديل الفصل':'فصل جديد'}</h3>
    <div class="field"><label for="kn">اسم الفصل</label><input id="kn" value="${c?esc(c.name):''}" placeholder="مثال: الفراشات"></div>

    <button class="btn soft sm" id="kcancel">إلغاء</button>
  `);
  sheetPanel.querySelector('#kcancel').onclick = closeSheet;
  sheetPanel.querySelector('#ksave').onclick = async () => {
    const name = sheetPanel.querySelector('#kn').value.trim();
    if(!name){ sheetPanel.querySelector('#kmsg').innerHTML='<div class="err">اكتب الاسم.</div>'; return; }
    const btn = sheetPanel.querySelector('#ksave'); btn.disabled = true;
    const q = c ? sb.from('classes').update({ name }).eq('id', c.id)
                : sb.from('classes').insert({ name, kindergarten_id: S.kg.id });
    const { error } = await q;
    if(error){ sheetPanel.querySelector('#kmsg').innerHTML='<div class="err">'+esc(error.message)+'</div>'; btn.disabled=false; return; }
    const { data } = await sb.from('classes').select('*').eq('kindergarten_id', S.kg.id).order('name');
    S.classes = data || [];
    closeSheet(); toast('تم الحفظ'); render();
  };
}

      const pre = String((S.kg && S.kg.slug) || 'KG').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8) || 'KG';
      const rnd = Math.random().toString(36).slice(2,6).toUpperCase();
      const code = pre + '-' + (role === 'admin' ? 'A' : 'T') + rnd;
      const r = await safe(sb.from('invites').insert({

      }).select().single());

      sheetPanel.querySelector('#sd').onclick = ()=>{ closeSheet(); render(); };
    };

  const list = el('<div class="rowlist"></div>');
  S.staff.forEach(p => {
    const r = el(`<button class="row">
      <span class="face">${esc(initial(p.full_name))}</span>
      <span class="nm"><b>${esc(p.full_name||'—')}</b><span>${esc(p.phone||'')}</span></span>
      <span class="tagx ${p.role==='admin'?'full':''}">${ROLE_AR[p.role]||'معلمة'}</span>
    </button>`);
    r.onclick = () => staffSheet(p);
    list.appendChild(r);
  });
  if(!S.staff.length) list.appendChild(el('<div class="empty">لا توجد حسابات بعد.</div>'));
  wrap.appendChild(list);

  const unused = S.invites.filter(i => i.role !== 'parent' && (i.uses||0) < (i.max_uses||1));
  if(unused.length){
    const card = el('<div class="card"><h3>رموز غير مستخدمة</h3><div class="rowlist"></div></div>');
    const lx = card.querySelector('.rowlist');
    const roleLabel = { admin:'مديرة', teacher:'معلمة', bus:'مرافقة الحافلة' };
    unused.forEach(i => {
      const r = el(`<div class="codebox" style="margin-bottom:6px">
        <span style="flex:1;display:flex;flex-direction:column;gap:1px;min-width:0">

        </span>

      r.querySelector('button').onclick = (e)=>copyText(i.code, e.target);
      lx.appendChild(r);
    });
    wrap.appendChild(card);
  }
  return wrap;
}

    }
    btn.disabled = false; btn.textContent = 'حفظ';
  };

function monthStart(){ const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1).toLocaleDateString('en-CA'); }

function adminReports(){
  const wrap = el('<div style="display:flex;flex-direction:column;gap:14px"></div>');
  const card = el(`<div class="card">
    <h3>تقرير الحضور</h3>
    <div class="actions2">
      <div class="field" style="flex:1"><label for="rf">من</label><input id="rf" type="date" value="${monthStart()}"></div>
      <div class="field" style="flex:1"><label for="rt">إلى</label><input id="rt" type="date" value="${today()}"></div>
    </div>
    <button class="btn sm" id="rrun">عرض التقرير</button>
    <div id="rout"></div>
  </div>`);
  const out = card.querySelector('#rout');

  const paint = (rows, from, to) => {
    if(!rows || !rows.length){ out.innerHTML = '<div class="empty">لا توجد بيانات في هذه الفترة.</div>'; return; }
    out.innerHTML = '';
    out.appendChild(el(`<div class="tblwrap"><table class="tbl">
      <thead><tr><th>الطفل</th><th>الفصل</th><th>أيام الحضور</th><th>غياب مُبلّغ</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td>${esc(r.full_name)}</td><td>${esc(r.class_name||'—')}</td>
        <td class="num">${r.present}</td><td class="num">${r.absent_reported}</td></tr>`).join('')}</tbody>
    </table></div>`));
    const dl = el('<button class="btn soft sm">تنزيل CSV</button>');
    dl.onclick = () => {
      const head = 'الطفل,الفصل,أيام الحضور,غياب مبلغ\n';
      const body = rows.map(r=>[r.full_name, r.class_name||'', r.present, r.absent_reported].join(',')).join('\n');
      const blob = new Blob(['\ufeff' + head + body], {type:'text/csv;charset=utf-8'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `attendance-${from}-to-${to}.csv`;
      document.body.appendChild(a); a.click(); a.remove();
    };
    out.appendChild(dl);
  };

  card.querySelector('#rrun').onclick = async (e) => {
    const btn = e.target; btn.disabled = true; btn.textContent = 'جارٍ الحساب…';
    const from = card.querySelector('#rf').value, to = card.querySelector('#rt').value;
    const r = await safe(sb.rpc('attendance_report', { p_from: from, p_to: to }));
    btn.disabled = false; btn.textContent = 'عرض التقرير';
    if(!r){ out.innerHTML = '<div class="err">التقرير غير متاح بعد — شغّل تحديث قاعدة البيانات أولًا.</div>'; return; }
    S.report = r.data || [];
    paint(S.report, from, to);
  };
  wrap.appendChild(card);

  // consent overview
  const cs = el('<div class="card"><h3>موافقات أولياء الأمور</h3><div id="csout"><p class="help">جارٍ التحميل…</p></div></div>');
  wrap.appendChild(cs);
  safe(sb.rpc('consent_status')).then(r => {
    const box = cs.querySelector('#csout'); if(!box) return;
    if(!r){ box.innerHTML = '<p class="help">غير متاح بعد — شغّل تحديث قاعدة البيانات.</p>'; return; }
    const rows = r.data || [];
    const withG = rows.filter(x => x.guardians > 0);
    const done = withG.filter(x => x.consented > 0).length;
    const missing = withG.filter(x => x.consented === 0)
      .map(x => (S.children.find(c=>c.id===x.child_id)||{}).full_name).filter(Boolean);
    box.innerHTML = `<p class="help">${done} من ${withG.length} طفل لديهم موافقة مسجّلة.</p>` +
      (missing.length ? '<p class="help">بدون موافقة: ' + esc(missing.slice(0,12).join('، ')) + '</p>' : '');
  });

  // full data export — the kindergarten owns its own records
  const ex = el(`<div class="card"><h3>تصدير بيانات الروضة</h3>
    <p class="help">ملف واحد يحتوي الأطفال والفصول وأولياء الأمور والحضور والغياب والأنشطة. الصور نفسها تبقى في التطبيق.</p>
    <div id="exout"></div>
    <button class="btn soft sm" id="exgo">تصدير الآن</button></div>`);
  ex.querySelector('#exgo').onclick = async (e) => {
    const b = e.target; b.disabled = true; b.textContent = 'جارٍ التصدير…';
    const r = await safe(sb.rpc('export_kindergarten'));
    if(!r || !r.data){
      ex.querySelector('#exout').innerHTML = '<div class="err">غير متاح بعد — شغّل تحديث قاعدة البيانات.</div>';
      b.disabled = false; b.textContent = 'تصدير الآن'; return;
    }
    const blob = new Blob([JSON.stringify(r.data, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `kindergarten-export-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    ex.querySelector('#exout').innerHTML = '<div class="ok">تم تنزيل الملف.</div>';
    b.disabled = false; b.textContent = 'تصدير الآن';
  };
  wrap.appendChild(ex);

  // photo retention
  const rt = el(`<div class="card"><h3>الاحتفاظ بالصور</h3>
    <p class="help">تُحذف صور الأنشطة الأقدم من ${S.kg && S.kg.photo_retention_days ? S.kg.photo_retention_days : 365} يومًا.</p>
    <div id="pgout"></div>
    <button class="btn soft sm" id="purge">حذف الصور القديمة الآن</button></div>`);
  rt.querySelector('#purge').onclick = async (e) => {
    const b = e.target; b.disabled = true; b.textContent = 'جارٍ الحذف…';
    const r = await safe(sb.rpc('purge_old_photos'));
    rt.querySelector('#pgout').innerHTML = r
      ? '<div class="ok">تم حذف ' + (r.data ?? 0) + ' صورة.</div>'
      : '<div class="err">غير متاح بعد — شغّل تحديث قاعدة البيانات.</div>';
    b.disabled = false; b.textContent = 'حذف الصور القديمة الآن';
  };
  wrap.appendChild(rt);
  return wrap;
}

    <div id="rpout"></div>

    <button class="btn soft sm" id="rpx">إلغاء</button>`);
  sheetPanel.querySelector('#rpx').onclick = closeSheet;
  sheetPanel.querySelector('#rpgo').onclick = async (e) => {
    e.target.disabled = true; e.target.textContent = 'جارٍ الإصدار…';

    if(!r || !r.data){
      sheetPanel.querySelector('#rpout').innerHTML = '<div class="err">تعذّر الإصدار — تأكد من تشغيل تحديث قاعدة البيانات.</div>';

    sheetPanel.querySelector('#rpout').innerHTML =

// a destructive action always needs a second, deliberate tap
function confirmAction(title, body, label, run){
  openSheet(`
    <h3>${title}</h3>
    <p class="help">${body}</p>
    <div id="cfmsg"></div>
    <button class="btn" id="cfgo" style="background:var(--pink)">${esc(label)}</button>
    <button class="btn soft sm" id="cfx">تراجع</button>
  `);
  sheetPanel.querySelector('#cfx').onclick = closeSheet;
  sheetPanel.querySelector('#cfgo').onclick = async (e) => {
    e.target.disabled = true; e.target.textContent = 'جارٍ التنفيذ…';
    const err = await run();
    if(err){
      sheetPanel.querySelector('#cfmsg').innerHTML = '<div class="err">' + esc(err) + '</div>';
      e.target.disabled = false; e.target.textContent = label; return;
    }
    closeSheet();
  };
}

async function loadResets(){
  const r = await safe(sb.rpc('open_resets'));
  S.resets = (r && r.data) ? r.data : [];
}

/* ================= settings ================= */
function viewSettings(){
  const wrap = el('<div style="display:flex;flex-direction:column;gap:16px"></div>');
  const parent = actingRole() === 'parent';
  const busOnly = actingRole() === 'bus';

  // --- notifications ---
  const card = el(`<div class="card"><h3>الإشعارات</h3></div>`);
  const rows = [
    ['attendance', 'الوصول والمغادرة', parent ? 'تنبيه فور تسجيل دخول أو خروج طفلك.' : 'تنبيه عند تسجيل الحضور.'],
    ['announcements', 'إعلانات الإدارة', 'الرحلات، الإجازات، التذكيرات.'],
  ];
  if(!parent) rows.push(['absence', 'بلاغات الغياب', 'عندما يُبلّغ ولي أمر عن غياب طفله.']);

  rows.forEach(([key, title, desc]) => {
    const r = el(`<div class="switchrow"><div class="t"><b>${title}</b><span>${desc}</span></div>
      <button class="sw" role="switch" aria-checked="${!!S.notif[key]}"></button></div>`);
    r.querySelector('.sw').onclick = async (e) => {
      S.notif[key] = !S.notif[key];
      e.target.setAttribute('aria-checked', String(!!S.notif[key]));
      await safe(sb.rpc('set_notif', { p: S.notif }));
    };
    card.appendChild(r);
    card.appendChild(el('<div class="divider"></div>'));
  });

  const act = el(`<div class="field"><label for="ac">الأنشطة والصور</label>
    <select id="ac">
      <option value="instant" ${S.notif.activities==='instant'?'selected':''}>تنبيه فوري لكل نشاط</option>
      <option value="daily" ${S.notif.activities==='daily'?'selected':''}>ملخّص واحد الساعة ٦ مساءً</option>
      <option value="off" ${S.notif.activities==='off'?'selected':''}>بدون تنبيه</option>
    </select></div>`);
  act.querySelector('#ac').onchange = async (e) => {
    S.notif.activities = e.target.value;
    await safe(sb.rpc('set_notif', { p: S.notif }));
    toast('تم الحفظ');
  };
  card.appendChild(act);

  const quiet = el(`<div class="switchrow"><div class="t"><b>ساعات الهدوء</b><span>لا تصل تنبيهات الأنشطة والإعلانات بين ٩ مساءً و٦ صباحًا.</span></div>
    <button class="sw" role="switch" aria-checked="${!!S.notif.quiet}"></button></div>`);
  quiet.querySelector('.sw').onclick = async (e) => {
    S.notif.quiet = !S.notif.quiet;
    e.target.setAttribute('aria-checked', String(!!S.notif.quiet));
    await safe(sb.rpc('set_notif', { p: S.notif }));
  };
  card.appendChild(quiet);
  if(!busOnly) wrap.appendChild(card);

  if(busOnly){
    wrap.appendChild(el(`<div class="card"><h3>مرافقة الحافلة</h3>
      <p class="help">تظهر لك أطفال الحافلة فقط. أول ضغطة تسجّل ركوب الطفل، والثانية تسجّل وصوله، والثالثة تلغي التسجيل إذا ضغطتِ على الطفل الخطأ.</p>
      <p class="help">ولي الأمر يصله إشعار فوري عند كل ضغطة.</p></div>`));
  }

  // --- device ---
  if(!busOnly){
    const dev = el('<div class="card"><h3>هذا الجهاز</h3></div>');
    const b = pushBanner();
    if(b) dev.appendChild(b);
    else dev.appendChild(el('<p class="help">الإشعارات مفعّلة على هذا الجهاز ✅</p>'));
    wrap.appendChild(dev);
  }

  // --- privacy (parents) ---
  if(parent){
    const pv = el(`<div class="card"><h3>الخصوصية</h3>
      <p class="help">${S.consentGiven ? 'وافقتَ على حفظ بيانات طفلك وصوره داخل التطبيق.' : 'لم تُسجَّل موافقتك بعد.'}</p></div>`);
    if(!S.consentGiven){
      const cb = el('<button class="btn sm">تسجيل الموافقة</button>');
      cb.onclick = async () => {
        const r = await safe(sb.rpc('set_consent'));
        if(!r){ toast('تعذّر الحفظ'); return; }
        S.consentGiven = true; toast('تم تسجيل الموافقة'); render();
      };
      pv.appendChild(cb);
    } else {
      const wd = el('<button class="btn soft sm">سحب الموافقة</button>');
      wd.onclick = () => toast('راجع إدارة الروضة لسحب الموافقة وحذف الصور.');
      pv.appendChild(wd);
    }
    wrap.appendChild(pv);
  }

  // --- password ---
  const pw = el(`<div class="card"><h3>كلمة المرور</h3>
    <div class="field"><label for="np">كلمة مرور جديدة</label><input id="np" type="password" minlength="6" placeholder="٦ أحرف على الأقل"></div>
    <div id="pwmsg"></div>
    <button class="btn soft sm" id="pwsave">تغيير كلمة المرور</button></div>`);
  pw.querySelector('#pwsave').onclick = async () => {
    const v = pw.querySelector('#np').value;
    if(!v || v.length < 6){ pw.querySelector('#pwmsg').innerHTML = '<div class="err">٦ أحرف على الأقل.</div>'; return; }
    const { error } = await sb.auth.updateUser({ password: v });
    pw.querySelector('#pwmsg').innerHTML = error
      ? '<div class="err">'+esc(error.message)+'</div>'
      : '<div class="ok">تم تغيير كلمة المرور.</div>';
    if(!error) pw.querySelector('#np').value = '';
  };
  wrap.appendChild(pw);

  const out = el('<button class="btn soft">تسجيل الخروج</button>');
  out.onclick = async()=>{ if(S.channel) sb.removeChannel(S.channel); await sb.auth.signOut(); location.reload(); };
  wrap.appendChild(out);
  return wrap;
}

/* ================= push ================= */
const VAPID_PUBLIC = 'BNqCBI2yu25gyEKTWJ-7EumIBd7-ggybkflelEWHougONUbkkF1t6HJ2xpNCPTWMt9k6BgsXEaxSN4tGh3ic3U0';
function b64ToBytes(b64){
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g,'+').replace(/_/g,'/'));
  const out = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) out[i] = raw.charCodeAt(i);
  return out;
}
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const pushSupported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

async function registerSW(){
  if(!('serviceWorker' in navigator)) return null;
  try { return await navigator.serviceWorker.register('sw.js'); } catch(e){ return null; }
}
async function saveSubscription(sub){
  const j = sub.toJSON();
  const { error } = await sb.from('push_subscriptions').upsert({
    profile_id: S.profile.id, endpoint: j.endpoint,
    p256dh: j.keys.p256dh, auth: j.keys.auth, user_agent: navigator.userAgent
  }, { onConflict: 'endpoint' });
  if(error) throw new Error('تعذّر حفظ الاشتراك.');
  S.pushOn = true;
}
async function enablePush(){
  if(!pushSupported) throw new Error('متصفحك لا يدعم الإشعارات.');
  const reg = await registerSW();
  if(!reg) throw new Error('تعذّر تشغيل خدمة الإشعارات.');
  await navigator.serviceWorker.ready;
  const perm = await Notification.requestPermission();
  if(perm !== 'granted') throw new Error('لم يتم السماح بالإشعارات من إعدادات المتصفح.');
  let sub = await reg.pushManager.getSubscription();
  if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: b64ToBytes(VAPID_PUBLIC) });
  await saveSubscription(sub);
}
function notifyServer(payload){ sb.functions.invoke('notify', { body: payload }).catch(()=>{}); }

function pushBanner(){
  const iosHint = el(`<div class="notif info">
    <div class="t"><b>فعّل الإشعارات</b><span>افتح قائمة المشاركة ⬆️ ثم «إضافة إلى الشاشة الرئيسية»، وشغّل التطبيق من هناك.</span></div>
  </div>`);
  if(!pushSupported) return (isIOS && !isStandalone) ? iosHint : null;
  if(Notification.permission === 'granted' && S.pushOn) return null;
  if(Notification.permission === 'denied'){
    return el(`<div class="notif info"><div class="t"><b>الإشعارات موقوفة</b><span>فعّلها من إعدادات المتصفح لهذا الموقع.</span></div></div>`);
  }
  if(isIOS && !isStandalone) return iosHint;
  const n = el(`<div class="notif">
    <div class="t"><b>فعّل إشعارات الهاتف</b><span>ليصلك تنبيه فور وصول طفلك أو نشر نشاط.</span></div>
    <button type="button">تفعيل</button>
  </div>`);
  n.querySelector('button').onclick = async (e) => {
    e.target.disabled = true; e.target.textContent = '…';
    try { await enablePush(); toast('تم تفعيل الإشعارات'); render(); }
    catch(err){ toast(err.message); e.target.disabled=false; e.target.textContent='تفعيل'; }
  };
  return n;
}

async function checkPushState(){
  if(!pushSupported || Notification.permission !== 'granted'){ S.pushOn = false; return; }
  const reg = await registerSW();
  if(!reg){ S.pushOn = false; return; }
  const sub = await reg.pushManager.getSubscription();
  if(!sub){ S.pushOn = false; return; }
  try { await saveSubscription(sub); } catch(_){ S.pushOn = false; }
}

/* ================= shell ================= */
function render(){
  const role = actingRole();
  const staff = role==='admin' || role==='teacher';
  const isBus = role==='bus';
  const tabs = (staff
    ? [{k:'roster',l:'الفصل',i:'users'}, {k:'feed',l:'الأخبار',i:'home'}].concat(role==='admin'?[{k:'admin',l:'الإدارة',i:'chart'}]:[])
    : isBus
    ? [{k:'bus',l:'الحافلة',i:'car'}]
    : [{k:'home',l:'طفلي',i:'home'}]
  ).concat(S.isOwner && !S.preview ? [{k:'platform',l:'المنصة',i:'chart'}] : [])
   .concat([{k:'settings',l:'الإعدادات',i:'gear'}]);
  if(!S.tab || !tabs.find(t=>t.k===S.tab)) S.tab = tabs[0].k;

  app.innerHTML = '';
  const cls = S.classes.find(c=>c.id===S.activeClass);
  const sub = staff && S.tab==='roster' && cls ? 'فصل '+cls.name+' · '+fmtDay(new Date())
            : isBus && S.tab==='bus' ? BUS_TRIPS[S.busTrip] + ' · ' + fmtDay(new Date())
            : fmtDay(new Date());

  const top = el(`<div class="topbar">
    <img class="logo" src="${esc(brandLogo())}" alt="">
    <div class="who"><b>${esc(brandName())}</b><span>${esc(sub)}</span></div>
    <button class="iconbtn" id="gotoSettings" aria-label="الإعدادات">${ICONS.gear}</button>
  </div>`);
  top.querySelector('#gotoSettings').onclick = ()=>{ S.tab='settings'; render(); };
  app.appendChild(top);

  const main = el('<main></main>');
  if(S.preview){
    const pv = el(`<div class="notif info">
      <div class="t"><b>معاينة كـ ${esc(ROLE_AR[S.preview]||S.preview)}</b><span>هذا عرض تجريبي — البيانات حقيقية والأزرار معطّلة.</span></div>
      <button type="button">خروج</button>
    </div>`);
    pv.querySelector('button').onclick = ()=>setPreview(null);
    main.appendChild(pv);
  }
  if(S.tab !== 'settings' && !isBus && !S.preview){
    const banner = pushBanner();
    if(banner) main.appendChild(banner);
  }
  if(S.tab==='settings') main.appendChild(viewSettings());
  else if(S.tab==='platform') main.appendChild(viewPlatform());
  else if(S.tab==='roster') main.appendChild(viewRoster());
  else if(S.tab==='bus') main.appendChild(viewBus());
  else if(S.tab==='admin') main.appendChild(viewAdmin());
  else if(S.tab==='feed') main.appendChild(buildFeed());
  else main.appendChild(viewParent());
  app.appendChild(main);

  if(tabs.length>1){
    const nav = el('<nav class="tabs"></nav>');
    tabs.forEach(t=>{
      const b = el(`<button ${S.tab===t.k?'aria-current="page"':''}>${ICONS[t.i]}<span>${t.l}</span></button>`);
      b.onclick = async ()=>{ S.tab=t.k;
        if(t.k==='admin'){ if(!S.invites.length) await loadInvites(); if(!S.staff.length) await loadStaff(); await loadResets(); }
        if(t.k==='platform') await loadTenants();
        render(); };
      nav.appendChild(b);
    });
    app.appendChild(nav);
  }
}

/* ================= boot ================= */
async function boot(){
  app.innerHTML = '<div class="spin"></div>';
  if(!S.brand) await loadBrand();
  const { data } = await sb.auth.getSession();
  S.session = data.session;
  if(!S.session){ renderAuth('in'); return; }
  const ready = await loadCore();
  if(!ready){ renderNeedsCode(); return; }
  subscribe();
  S.pending = new Set(queueGet().map(x => x.child_id));
  await checkPushState();
  render();
  flushQueue();
  setInterval(async()=>{ if(S.session && document.visibilityState==='visible'){ await flushQueue(); await refresh(); render(); } }, 60000);
}
document.addEventListener('visibilitychange', async ()=>{
  if(document.visibilityState==='visible' && S.session && S.profile && S.kg){ await refresh(); render(); }
});
boot();
