<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>رمز ولي الأمر — كيدورا</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=IBM+Plex+Mono:wght@700&display=swap">
<style>
:root{--pink:#E0206E;--ink:#241820;--mute:#6E6069;--bg:#FBF7F9;--soft:#FDE9F1;--green:#EFF7E2;--greenInk:#4F7212}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
main{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;text-align:center}
.dots{display:grid;grid-template-columns:repeat(2,14px);gap:5px;justify-content:center;margin:0 auto 4px}
.dots i{width:14px;height:14px;border-radius:50%;display:block}
h1{font-size:22px;margin:0}
p{margin:0;color:var(--mute);font-size:15px;line-height:1.6}
.code{background:var(--soft);border-radius:20px;padding:18px 12px}
.code small{display:block;color:#A5124F;font-weight:600;font-size:14px}
.code b{display:block;font:700 34px "IBM Plex Mono",ui-monospace,monospace;direction:ltr;letter-spacing:1px;margin-top:4px;user-select:all;-webkit-user-select:all}
button,.btn{font:inherit;font-weight:700;font-size:17px;border:0;border-radius:16px;padding:15px;cursor:pointer;text-decoration:none;display:block}
#copy{background:var(--pink);color:#fff}
#copy.done{background:var(--green);color:var(--greenInk)}
.stores{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.store{background:#111;color:#fff;font-size:15px;padding:12px 8px;line-height:1.25}
.btn.store span{display:block;font-weight:400;font-size:12px;opacity:.8}
.web{color:#0E6E99;font-size:14px}
.err{background:#fff3cd;color:#664d03;border-radius:12px;padding:12px}
</style>
</head>
<body>
<main>
  <div class="dots" aria-hidden="true"><i style="background:#E0206E"></i><i style="background:#24A7E1"></i><i style="background:#EFB513"></i><i style="background:#7FB227"></i></div>
  <h1>رمز ولي الأمر</h1>
  <p>انسخ الرمز، ثم حمّل تطبيق «كيدورا» واختر «حساب جديد» والصق الرمز عند التسجيل.</p>
  <div class="code"><small>رمز الدخول</small><b id="code">—</b></div>
  <button id="copy">نسخ الرمز</button>
  <div class="stores">
    <a class="btn store" href="https://apps.apple.com/sa/app/id6819013599" rel="noopener"><span>آيفون — حمّل من</span>App Store</a>
    <a class="btn store" href="https://play.google.com/store/apps/details?id=sa.answer.wanas" rel="noopener"><span>أندرويد — حمّل من</span>Google Play</a>
  </div>
  <a class="web" id="web" href="https://kidora.answer.sa/">أو سجّل من المتصفح</a>
  <p style="font-size:13px">الرمز خاص بطفلك — لا تشاركه خارج العائلة.</p>
</main>
<script>
(function(){
  // the code travels in the #fragment, so it never reaches any server log
  var code = decodeURIComponent((location.hash || '').slice(1)).trim().toUpperCase();
  var ok = /^[A-Z]{1,3}-[A-Z0-9]{4,16}$/.test(code);
  var el = document.getElementById('code'), btn = document.getElementById('copy');
  if(!ok){ el.textContent = '—'; btn.outerHTML = '<div class="err">الرابط ناقص. اكتب الرمز الموجود في البطاقة بنفسك.</div>'; return; }
  el.textContent = code;
  document.getElementById('web').href = 'https://kidora.answer.sa/?code=' + encodeURIComponent(code);
  function done(){ btn.textContent = '✓ تم النسخ — الصقه عند التسجيل'; btn.className = 'done'; }
  function fallback(){
    var t = document.createElement('textarea'); t.value = code; t.setAttribute('readonly', '');
    t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t);
    t.select(); t.setSelectionRange(0, 99);
    var r = false; try { r = document.execCommand('copy'); } catch(e){}
    t.remove(); return r;
  }
  btn.onclick = function(){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(code).then(done, function(){ if(fallback()) done(); });
    } else if(fallback()) done();
  };
})();
</script>
</body>
</html>
